<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Suggestion Log</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,900&family=Spline+Sans+Mono:wght@400;500;600&display=swap');
  :root { --ink:#1a1714; --paper:#f4f0e8; --paper-2:#e3dac9; --card:#fbf9f4; --accent:#c2410c; --accent-2:#1e3a2f; --line:#d6cdbd; --muted:#8a8071; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--paper-2); color:var(--ink); font-family:'Spline Sans Mono',monospace; line-height:1.5; padding:2rem 1.5rem 4rem; }
  .wrap { max-width:1100px; margin:0 auto; }
  .quicklinks { display:flex; gap:0.6rem; flex-wrap:wrap; margin-bottom:1.5rem; }
  .qlink { display:inline-flex; align-items:center; gap:0.4rem; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.1em; text-decoration:none; color:var(--ink); background:var(--card); border:1px solid var(--ink); border-radius:99px; padding:0.4rem 0.85rem; transition:background 0.15s,color 0.15s; }
  .qlink:hover { background:var(--ink); color:var(--paper); }
  .qlink.accent { border-color:var(--accent-2); color:var(--accent-2); }
  .qlink.accent:hover { background:var(--accent-2); color:var(--paper); }
  h1 { font-family:'Fraunces',serif; font-weight:900; font-size:clamp(1.7rem,4vw,2.6rem); letter-spacing:-0.02em; }
  h1 em { font-style:italic; color:var(--accent); }
  .sub { color:var(--muted); font-size:0.8rem; margin:0.3rem 0 1.3rem; }
  .toolbar { display:flex; gap:0.75rem; flex-wrap:wrap; align-items:center; margin-bottom:1rem; }
  .toolbar input.search { flex:1; min-width:220px; padding:0.6rem 0.8rem; border:1px solid var(--ink); background:var(--card); font-family:inherit; font-size:0.9rem; color:var(--ink); border-radius:6px; }
  .filters { display:flex; gap:0.4rem; }
  .filters button { font-family:inherit; font-size:0.66rem; text-transform:uppercase; letter-spacing:0.1em; background:none; border:1px solid var(--ink); padding:0.4rem 0.8rem; cursor:pointer; color:var(--ink); border-radius:99px; }
  .filters button.active { background:var(--ink); color:var(--paper); }
  .card { background:var(--card); border:1px solid var(--ink); border-radius:12px; box-shadow:0 10px 30px -14px rgba(26,23,20,0.45); overflow:hidden; }
  table { width:100%; border-collapse:collapse; }
  thead th { text-align:left; font-size:0.6rem; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); padding:0.7rem 0.7rem; border-bottom:2px solid var(--ink); white-space:nowrap; }
  tbody tr.logrow { border-bottom:1px solid var(--line); cursor:pointer; }
  tbody tr.logrow:nth-child(4n+1) td { background:rgba(26,23,20,0.03); }
  tbody tr.logrow:hover td { background:var(--paper-2); }
  tbody td { padding:0.6rem 0.7rem; font-size:0.84rem; vertical-align:top; }
  .id { font-variant-numeric:tabular-nums; color:var(--muted); }
  .hp { font-family:'Fraunces',serif; font-size:1rem; }
  .when { color:var(--muted); font-size:0.76rem; white-space:nowrap; }
  .pill { display:inline-block; font-size:0.6rem; text-transform:uppercase; letter-spacing:0.08em; border:1px solid var(--line); border-radius:99px; padding:0.1rem 0.55rem; white-space:nowrap; }
  .pill.pending  { border-color:var(--accent);   color:var(--accent); }
  .pill.reviewed { border-color:var(--accent-2); color:var(--accent-2); }
  .pill.accepted { border-color:#2d7a3a; color:#2d7a3a; background:rgba(45,122,58,0.08); }
  .pill.rejected { border-color:var(--muted); color:var(--muted); }
  .filters button[data-f="pending"].active  { background:var(--accent);   border-color:var(--accent);   color:var(--paper); }
  .filters button[data-f="reviewed"].active { background:var(--accent-2); border-color:var(--accent-2); color:var(--paper); }
  .filters button[data-f="accepted"].active { background:#2d7a3a;         border-color:#2d7a3a;         color:var(--paper); }
  .filters button[data-f="rejected"].active { background:var(--muted);    border-color:var(--muted);    color:var(--paper); }
  .caretcol { width:2rem; text-align:center; }
  .expandbtn { background:none; border:none; cursor:pointer; color:var(--muted); font-size:1.1rem; line-height:1; }
  .caret { display:inline-block; transition:transform 0.15s ease; }
  tr.logrow.open .caret { transform:rotate(90deg); color:var(--accent); }
  tr.detailrow > td { padding:0; }
  .detailwrap { padding:1.1rem 1.4rem; border-left:3px solid var(--accent); background:rgba(26,23,20,0.02); }
  .detail-specs { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:0.6rem 1.5rem; margin:0 0 0.8rem; }
  .detail-specs dt { font-size:0.58rem; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); }
  .detail-specs dd { font-size:0.86rem; }
  .detail-notes { font-size:0.84rem; margin-bottom:0.7rem; }
  .detail-meta { font-size:0.76rem; color:var(--muted); }
  .detail-meta a { color:var(--accent-2); word-break:break-all; }
  .loading,.empty { text-align:center; color:var(--muted); padding:3rem 1rem; }
  .vh { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
  a:focus-visible, button:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *{ transition-duration:0.01ms !important; } }
</style>
</head>
<body>
<div class="wrap">
  <nav class="quicklinks" aria-label="Quick links">
    <a class="qlink accent" href="admin.html">&larr; Back to Catalog Editor</a>
    <a class="qlink" href="index.html">View Archive</a>
  </nav>
  <h1>Suggestion <em>Log</em></h1>
  <p class="sub" id="sub">Loading&hellip;</p>

  <div class="toolbar">
    <input type="text" class="search" id="q" placeholder="Search by ID, headphone, source, submitter, notes&hellip;" autocomplete="off" aria-label="Search suggestions">
    <div class="filters">
      <button data-f="all" class="active">All</button>
      <button data-f="pending">Pending</button>
      <button data-f="reviewed">Reviewed</button>
      <button data-f="accepted">Accepted</button>
      <button data-f="rejected">Rejected</button>
    </div>
  </div>

  <div class="card"><div id="list"><div class="loading">Loading suggestions&hellip;</div></div></div>
</div>

<script>
let all = [], filter = "all";

function esc(s){ return (s||"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

async function load() {
  try {
    const res = await fetch("/api/admin/suggestions");
    const data = await res.json();
    if (!data.ok) throw new Error();
    all = data.suggestions;
    render();
  } catch(e) {
    document.getElementById("list").innerHTML = '<div class="empty">Could not load suggestions. Check the D1 binding and Access policy.</div>';
    document.getElementById("sub").textContent = "";
  }
}

function spec(label, v, unit){ return v ? `<div><dt>${label}</dt><dd>${esc(v)}${unit||""}</dd></div>` : ""; }

function detail(s){
  return `
    <dl class="detail-specs">
      <div><dt>Suggestion ID</dt><dd>#${esc(s.id)}</dd></div>
      ${spec("Driver size", s.driver_size_mm, " mm")}
      ${spec("Impedance", s.impedance_ohms, " \u03A9")}
      ${spec("Sensitivity", s.sensitivity_db, " dB")}
      ${spec("Connector", s.connector)}
      ${spec("Detachable cable", s.detachable)}
      ${spec("Weight", s.weight_g, " g")}
    </dl>
    ${s.notes ? `<div class="detail-notes">${esc(s.notes)}</div>` : ""}
    <div class="detail-meta">
      Source: <a href="${esc(s.source)}" target="_blank" rel="noopener">${esc(s.source)}</a><br>
      ${s.submitter ? "Submitted by " + esc(s.submitter) + " \u00b7 " : ""}${esc(s.created_at)} \u00b7 status: ${esc(s.status)}
    </div>`;
}

function render() {
  const q = document.getElementById("q").value.toLowerCase();
  let rows = all.filter(s => filter === "all" ? true : s.status === filter);
  if (q) rows = rows.filter(s => (`#${s.id} ${s.headphone} ${s.source} ${s.submitter} ${s.notes} ${s.status}`||"").toLowerCase().includes(q));
  const counts = { pending:0, reviewed:0, accepted:0, rejected:0 };
  all.forEach(s => { if (s.status in counts) counts[s.status]++; });
  const parts = [`${all.length} total`];
  if (counts.pending)  parts.push(`${counts.pending} pending`);
  if (counts.accepted) parts.push(`${counts.accepted} accepted`);
  if (counts.rejected) parts.push(`${counts.rejected} rejected`);
  if (counts.reviewed) parts.push(`${counts.reviewed} reviewed`);
  document.getElementById("sub").textContent =
    parts.join(" \u00b7 ") + (q||filter!=="all" ? ` \u00b7 ${rows.length} shown` : "") + " \u00b7 click a row for details";

  if (!rows.length) { document.getElementById("list").innerHTML = '<div class="empty">No suggestions match.</div>'; return; }

  document.getElementById("list").innerHTML = `
    <table><thead><tr>
      <th>ID</th><th>Headphone</th><th>Submitted</th><th>Status</th><th class="caretcol"><span class="vh">Details</span></th>
    </tr></thead><tbody>
    ${rows.map(s=>`
      <tr class="logrow" data-id="${esc(s.id)}">
        <td class="id">#${esc(s.id)}</td>
        <td class="hp">${esc(s.headphone)}</td>
        <td class="when">${esc((s.created_at||"").slice(0,10))}</td>
        <td><span class="pill ${esc(s.status)}">${esc(s.status)}</span></td>
        <td class="caretcol"><button class="expandbtn" aria-expanded="false" aria-label="Show details for suggestion ${esc(s.id)}"><span class="caret" aria-hidden="true">\u203A</span></button></td>
      </tr>
      <tr class="detailrow" hidden><td colspan="5"><div class="detailwrap">${detail(s)}</div></td></tr>
    `).join("")}
    </tbody></table>`;

  document.querySelectorAll("tr.logrow").forEach(tr => {
    tr.addEventListener("click", (e) => {
      if (e.target.closest("a")) return;
      const d = tr.nextElementSibling;
      if (!d || !d.classList.contains("detailrow")) return;
      const opening = d.hasAttribute("hidden");
      if (opening) d.removeAttribute("hidden"); else d.setAttribute("hidden","");
      tr.classList.toggle("open", opening);
      const b = tr.querySelector(".expandbtn"); if (b) b.setAttribute("aria-expanded", String(opening));
    });
  });
}

document.getElementById("q").addEventListener("input", render);
document.querySelectorAll(".filters button").forEach(b =>
  b.addEventListener("click", () => {
    document.querySelectorAll(".filters button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active"); filter = b.dataset.f; render();
  }));

load();
</script>
</body>
</html>
