<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Brands — The Headphone Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Spline+Sans+Mono:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  .site-nav { max-width: 1400px; margin: 0 auto; padding: 1rem var(--pad); border-bottom: 2px solid var(--ink); }
  .site-name { font-family: 'Fraunces', serif; font-size: 1.1rem; font-weight: 700; color: var(--ink); text-decoration: none; }
  .site-name:hover { color: var(--accent); }

  .hero { max-width: 1400px; margin: 0 auto; padding: 3rem var(--pad) 2rem; border-bottom: 1px solid var(--line); }
  .eyebrow { margin-bottom: 0.6rem; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); }
  .hero h1 { font-family: 'Fraunces', serif; font-weight: 900; font-size: clamp(2.4rem, 6vw, 5rem);
    line-height: 0.92; letter-spacing: -0.02em; }
  .hero-summary { margin-top: 1rem; font-size: 0.8rem; color: var(--muted); }

  /* ---- Search, country buttons, letter strip ---- */
  .filter-bar { max-width: 1400px; margin: 0 auto; padding: 1rem var(--pad) 0.5rem;
    display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
  .filter-bar input { flex: 1; min-width: 200px; padding: 0.55rem 0.75rem; border: 1px solid var(--ink);
    background: var(--paper); font-family: inherit; font-size: 0.85rem; color: var(--ink); }
  .filter-bar input:focus { outline: none; border-color: var(--accent); }
  .country-buttons { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .country-button { padding: 0.35rem 0.75rem; background: none; border: 1px solid var(--line); border-radius: 99px;
    cursor: pointer; font-family: inherit; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted); transition: all 0.12s; }
  .country-button:hover { border-color: var(--ink); color: var(--ink); }
  .country-button.active { background: var(--ink); border-color: var(--ink); color: var(--paper); }

  .letter-strip { max-width: 1400px; margin: 0 auto; padding: 0.4rem var(--pad);
    display: flex; flex-wrap: wrap; gap: 0.1rem; border-bottom: 1px solid var(--line); }
  .letter-button { padding: 0.25rem 0.4rem; background: none; border: none; border-radius: 2px; cursor: pointer;
    font-family: inherit; font-size: 0.72rem; color: var(--muted); transition: all 0.1s; }
  .letter-button:disabled { cursor: default; }
  .letter-button:not(:disabled) { font-weight: 600; color: var(--ink); }
  .letter-button:not(:disabled):hover, .letter-button.active { color: var(--accent); }

  .result-count { max-width: 1400px; margin: 0 auto; padding: 0.75rem var(--pad); font-size: 0.72rem; color: var(--muted); }

  /* ---- Brand cards. The 1px gap over a line-coloured background draws the grid lines. ---- */
  .brand-grid { max-width: 1400px; margin: 0 auto; padding: 0 var(--pad) 4rem;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1px;
    background: var(--line); border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  .brand-card { position: relative; display: flex; flex-direction: column; gap: 0.3rem; padding: 1.25rem 1.4rem;
    background: var(--paper); color: inherit; text-decoration: none; transition: background 0.12s; }
  .brand-card:hover { background: var(--paper-2); }
  .brand-card:hover .card-name { color: var(--accent); }
  .card-name { font-family: 'Fraunces', serif; font-size: 1.15rem; font-weight: 700; line-height: 1.1; color: var(--ink); }
  .card-facts { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; margin-top: 0.15rem; }
  .card-country { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
  .card-founded { font-size: 0.65rem; color: var(--muted); }
  .card-discontinued { padding: 0.1rem 0.45rem; border: 1px solid #fde68a; border-radius: 99px; background: #fef3c7;
    font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.08em; color: #92400e; }
  .card-description { margin-top: 0.5rem; font-size: 0.74rem; line-height: 1.55; color: var(--muted);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card-count { margin-top: auto; padding-top: 0.75rem; border-top: 1px solid var(--line);
    font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
  .card-count strong { color: var(--accent-2); }
  .letter-heading { grid-column: 1 / -1; padding: 0.5rem 1.4rem; background: var(--paper-2); border-top: 1px solid var(--line);
    font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.15em; color: var(--muted); }

  .empty, .loading { grid-column: 1 / -1; padding: 3rem 1rem; text-align: center; font-size: 0.85rem; color: var(--muted); }

  @media (max-width: 600px) {
    .brand-grid { grid-template-columns: 1fr; }
    .country-buttons { display: none; }
  }
</style>
</head>
<body>

<nav class="site-nav">
  <a href="index.html" class="site-name">The Headphone Archive</a>
</nav>

<div class="hero">
  <div class="eyebrow">The Headphone Archive</div>
  <h1>All Brands</h1>
  <p class="hero-summary" id="heroSummary">Loading&hellip;</p>
</div>

<div class="filter-bar">
  <label for="search" class="visually-hidden">Search brands</label>
  <input type="text" id="search" placeholder="Search brands&hellip;" autocomplete="off">
  <div class="country-buttons" id="countryButtons"></div>
</div>

<div class="letter-strip" id="letterStrip"></div>
<p class="result-count" id="resultCount"></p>

<div class="brand-grid" id="brandGrid"><div class="loading">Loading brands&hellip;</div></div>

<script src="shared.js"></script>
<script>
// Countries that get a quick-filter button, if any brand is from there.
const COUNTRY_BUTTONS = ["Japan", "Germany", "USA", "China", "UK", "Denmark", "France", "Austria"];

let brands = [];
const productCounts = {}; // manufacturer_id -> number of products
let country = "";
let letter = "";

const firstLetter = brand => brand.name[0].toUpperCase();

async function load() {
  try {
    const [brandsResponse, catalogResponse] = await Promise.all([fetch("/api/brands"), fetch("/api/catalog")]);
    const brandsData = await brandsResponse.json();
    const catalogData = await catalogResponse.json();
    if (!brandsData.ok) throw new Error(brandsData.error || "Failed to load brands");

    brands = (brandsData.brands || []).sort((a, b) => a.name.localeCompare(b.name));
    (catalogData.products || []).forEach(product => {
      productCounts[product.manufacturer_id] = (productCounts[product.manufacturer_id] || 0) + 1;
    });

    const countryCount = new Set(brands.map(brand => brand.country)).size;
    document.getElementById("heroSummary").textContent = `${brands.length} brands from ${countryCount} countries`;
    buildCountryButtons();
    buildLetterStrip();
    render();
  } catch (e) {
    document.getElementById("brandGrid").innerHTML = `<div class="empty">Could not load brands: ${escapeHtml(e.message)}</div>`;
  }
}

function buildCountryButtons() {
  const countries = new Set(brands.map(brand => brand.country));
  const button = (value, label) =>
    `<button class="country-button${value === country ? " active" : ""}" data-country="${escapeHtml(value)}">${escapeHtml(label)}</button>`;
  document.getElementById("countryButtons").innerHTML =
    button("", "All") + COUNTRY_BUTTONS.filter(name => countries.has(name)).map(name => button(name, name)).join("");
}

// A to Z, with letters that have no brands shown but disabled.
function buildLetterStrip() {
  const used = new Set(brands.map(firstLetter));
  document.getElementById("letterStrip").innerHTML = [..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"].map(char =>
    `<button class="letter-button${char === letter ? " active" : ""}" data-letter="${char}"${used.has(char) ? "" : " disabled"}>${char}</button>`
  ).join("");
}

function brandCard(brand) {
  const count = productCounts[brand.manufacturer_id] || 0;
  return `<a class="brand-card" href="brand.html?id=${escapeHtml(brand.manufacturer_id)}">
    <div class="card-name">${escapeHtml(brand.name)}</div>
    <div class="card-facts">
      <span class="card-country">${escapeHtml(brand.country)}</span>
      ${brand.founded_year ? `<span class="card-founded">Est. ${escapeHtml(brand.founded_year)}</span>` : ""}
      ${brand.status === "Discontinued" ? '<span class="card-discontinued">Discontinued</span>' : ""}
    </div>
    ${brand.description ? `<p class="card-description">${escapeHtml(brand.description)}</p>` : ""}
    <div class="card-count"><strong>${count}</strong> headphone${count === 1 ? "" : "s"}</div>
  </a>`;
}

function render() {
  const search = document.getElementById("search").value.toLowerCase().trim();
  const shown = brands.filter(brand =>
    (!search || [brand.name, brand.description, brand.country].join(" ").toLowerCase().includes(search)) &&
    (!country || brand.country === country) &&
    (!letter || firstLetter(brand) === letter)
  );
  document.getElementById("resultCount").textContent = `${shown.length} of ${brands.length} brands`;

  const grid = document.getElementById("brandGrid");
  if (!shown.length) {
    grid.innerHTML = '<div class="empty">No brands match.</div>';
    return;
  }
  // Letter headings only make sense for the full A to Z list, not search or country results.
  const showHeadings = !search && !country;
  let html = "";
  shown.forEach((brand, i) => {
    if (showHeadings && firstLetter(brand) !== (i && firstLetter(shown[i - 1]))) {
      html += `<div class="letter-heading">${escapeHtml(firstLetter(brand))}</div>`;
    }
    html += brandCard(brand);
  });
  grid.innerHTML = html;
}

document.getElementById("countryButtons").addEventListener("click", event => {
  const button = event.target.closest("button");
  if (!button) return;
  country = button.dataset.country;
  letter = "";
  buildCountryButtons();
  buildLetterStrip();
  render();
});

document.getElementById("letterStrip").addEventListener("click", event => {
  const button = event.target.closest("button:not(:disabled)");
  if (!button) return;
  letter = letter === button.dataset.letter ? "" : button.dataset.letter;
  buildLetterStrip();
  render();
});

document.getElementById("search").addEventListener("input", () => {
  letter = "";
  buildLetterStrip();
  render();
});

load();
</script>
</body>
</html>
