<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brand — The Headphone Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Spline+Sans+Mono:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  /* ---- Nav ---- */
  .site-nav { max-width: 1300px; margin: 0 auto; padding: 1rem 2rem; border-bottom: 2px solid var(--ink);
    display: flex; justify-content: space-between; align-items: center; }
  .site-nav a { color: var(--ink); text-decoration: none; }
  .site-nav a:hover { color: var(--accent); }
  .site-name { font-family: 'Fraunces', serif; font-size: 1.1rem; font-weight: 700; }
  .nav-links { display: flex; gap: 1.5rem; align-items: center; }
  .nav-link { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.12em; }

  /* ---- Brand header ---- */
  .brand-hero { max-width: 1300px; margin: 0 auto; padding: 3.5rem 2rem 2rem; border-bottom: 1px solid var(--line); }
  .eyebrow { margin-bottom: 0.6rem; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); }
  .brand-name { margin-bottom: 1.2rem; font-family: 'Fraunces', serif; font-weight: 900;
    font-size: clamp(3rem, 8vw, 6.5rem); line-height: 0.9; letter-spacing: -0.03em; }
  .brand-facts { display: flex; flex-wrap: wrap; gap: 1.5rem; align-items: center; font-size: 0.75rem; color: var(--muted); }
  .brand-facts .pill { padding: 0.25rem 0.75rem; background: var(--paper-2); border: 1px solid var(--line);
    border-radius: 99px; color: var(--ink); }
  .brand-facts .pill.active { background: #d1fae5; border-color: var(--accent-2); color: #065f46; }
  .brand-facts .pill.discontinued { background: #fef3c7; border-color: #fcd34d; color: #92400e; }
  .brand-facts a { color: var(--accent-2); }
  .brand-facts a:hover { color: var(--accent); }
  .brand-description { max-width: 680px; margin-top: 1.2rem; font-size: 0.83rem; line-height: 1.7; color: var(--muted); }

  /* ---- Layout: summary sidebar + timeline ---- */
  .brand-body { max-width: 1300px; margin: 0 auto; padding: 2.5rem 2rem 4rem;
    display: grid; grid-template-columns: 280px 1fr; gap: 3rem; align-items: start; }
  @media (max-width: 860px) { .brand-body { grid-template-columns: 1fr; } }
  .panel-title { margin-bottom: 1.5rem; padding-bottom: 0.5rem; border-bottom: 2px solid var(--ink);
    font-family: 'Fraunces', serif; font-size: 1.1rem; }

  /* ---- Brand DNA: headline numbers and breakdown bars ---- */
  .summary { position: sticky; top: 1.5rem; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 2rem; }
  .stat { padding: 0.75rem; background: var(--card); border: 1px solid var(--line); border-radius: 6px; }
  .stat strong { display: block; font-family: 'Fraunces', serif; font-size: 1.8rem; font-weight: 700; line-height: 1; }
  .stat span { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
  .breakdown { margin-bottom: 1.8rem; }
  .breakdown-label { margin-bottom: 0.5rem; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }
  .bar { display: flex; height: 28px; overflow: hidden; border-radius: 4px; background: var(--line); }
  .bar-segment { display: flex; align-items: center; min-width: 0; padding: 0 0.5rem; overflow: hidden;
    font-size: 0.6rem; white-space: nowrap; transition: width 0.4s ease; }
  .bar-segment span { overflow: hidden; text-overflow: ellipsis; }

  /* ---- Timeline of products by decade ---- */
  .decade { margin-bottom: 2.5rem; }
  .decade-label { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem;
    font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); }
  .decade-label::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .decade-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 0.6rem; }
  .product-card { position: relative; display: block; padding: 0.7rem 0.8rem; color: inherit; text-decoration: none;
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    transition: border-color 0.15s, transform 0.15s; }
  .product-card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .product-card.active { border-left: 3px solid var(--accent-2); }
  .product-card.discontinued { opacity: 0.7; }
  .product-years { margin-bottom: 0.2rem; font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
  .product-model { margin-bottom: 0.35rem; font-family: 'Fraunces', serif; font-size: 0.9rem; font-weight: 600; line-height: 1.2; }
  .product-tags { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.4rem; }
  .product-tag { padding: 0.1rem 0.4rem; border: 1px solid var(--line); border-radius: 99px; background: var(--paper-2);
    font-size: 0.55rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .product-specs { margin-top: 0.3rem; font-size: 0.6rem; color: var(--muted); }
  .product-price { margin-top: 0.3rem; font-size: 0.65rem; font-weight: 600; letter-spacing: 0.03em; color: var(--accent-2); }

  /* One colour pair per value, shared by the bars and the product tags. After .product-tag so they win. */
  .open-back, .electrostatic { background: #d1fae5; color: #065f46; border-color: #a7f3d0; }
  .closed-back { background: #e0e7ff; color: #3730a3; border-color: #c7d2fe; }
  .semi-open { background: #fef3c7; color: #92400e; border-color: #fde68a; }
  .dynamic { background: #fee2e2; color: #991b1b; }
  .planar { background: #ede9fe; color: #5b21b6; border-color: #ddd6fe; }
  .other-driver { background: var(--paper-2); color: var(--muted); }
  .over-ear { background: #e0f2fe; color: #0369a1; }
  .on-ear { background: #fce7f3; color: #9d174d; border-color: #fbcfe8; }

  .loading-state { padding: 4rem 2rem; text-align: center; font-size: 0.75rem; color: var(--muted); }
  .error-state { padding: 4rem 2rem; text-align: center; font-size: 0.85rem; color: var(--accent); }
  .empty-note { font-size: 0.8rem; color: var(--muted); }
</style>
</head>
<body>

<nav class="site-nav">
  <a href="index.html" class="site-name">The Headphone Archive</a>
  <div class="nav-links">
    <a href="brands.html" class="nav-link">&#9674; All Brands</a>
    <a href="index.html" class="nav-link">&larr; Back to archive</a>
  </div>
</nav>

<div id="brandHero"><div class="loading-state">Loading brand&hellip;</div></div>
<div id="brandContent"></div>

<script src="shared.js"></script>
<script>
// Short labels and colour classes for the tags and breakdown bars.
const DESIGNS = {
  "Closed Back": { label: "Closed", className: "closed-back" },
  "Open Back": { label: "Open", className: "open-back" },
  "Semi-Open": { label: "Semi", className: "semi-open" },
};
const DRIVER_TAGS = {
  "Planar Magnetic": { label: "Planar", className: "planar" },
  "Electrostatic": { label: "Electrostatic", className: "electrostatic" },
};

const countWhere = (items, test) => items.filter(test).length;

// A bar split into coloured segments by share. Labels only show on segments wide enough to hold them.
function breakdownBar(segments) {
  const total = segments.reduce((sum, segment) => sum + segment.count, 0);
  const parts = segments.filter(segment => segment.count > 0).map(segment => {
    const percent = Math.round(segment.count / total * 100);
    const label = percent >= 12 ? `${segment.label} ${percent}%` : "";
    return `<div class="bar-segment ${segment.className}" style="width:${percent}%"><span>${label}</span></div>`;
  });
  return `<div class="bar">${parts.join("")}</div>`;
}

function productTags(product) {
  const tags = [];
  if (product.design) tags.push(DESIGNS[product.design] || DESIGNS["Semi-Open"]);
  if (product.driver_type && product.driver_type !== "Dynamic") {
    tags.push(DRIVER_TAGS[product.driver_type] || { label: product.driver_type, className: "" });
  }
  if (product.fit === "On-Ear") tags.push({ label: "On-Ear", className: "on-ear" });
  return tags.map(tag => `<span class="product-tag ${tag.className}">${escapeHtml(tag.label)}</span>`).join("");
}

// Each card links to the product's row on the main archive page.
function productCard(product) {
  const isActive = product.status === "Active";
  const endYear = product.discontinued_year ? "–" + product.discontinued_year : isActive ? "–present" : "";
  const specs = [
    product.impedance_ohms && product.impedance_ohms + "Ω",
    product.sensitivity_db && product.sensitivity_db + " dB",
  ].filter(Boolean).join(" · ");
  return `
    <a class="product-card ${isActive ? "active" : "discontinued"}" href="index.html?focus=${escapeHtml(product.id)}" title="View ${escapeHtml(product.model_name)} in archive">
      <div class="product-years">${escapeHtml(product.release_year)}${escapeHtml(endYear)}</div>
      <div class="product-model">${escapeHtml(product.model_name)}</div>
      <div class="product-tags">${productTags(product)}</div>
      ${specs ? `<div class="product-specs">${escapeHtml(specs)}</div>` : ""}
      ${product.msrp_usd ? `<div class="product-price">${formatPrice(product.msrp_usd)} MSRP</div>` : ""}
    </a>`;
}

// Newest decade first, oldest model first within each decade.
function timelineHtml(products) {
  const byDecade = {};
  for (const product of products) {
    const year = +product.release_year;
    if (!year) continue;
    const decade = Math.floor(year / 10) * 10;
    (byDecade[decade] ||= []).push(product);
  }
  const currentDecade = Math.floor(new Date().getFullYear() / 10) * 10;
  return Object.keys(byDecade).map(Number).sort((a, b) => b - a).map(decade => {
    const models = byDecade[decade].sort((a, b) => a.release_year - b.release_year);
    return `
      <div class="decade">
        <div class="decade-label">${decade}s${decade === currentDecade ? " (present)" : ""} &mdash; ${models.length} model${models.length === 1 ? "" : "s"}</div>
        <div class="decade-grid">${models.map(productCard).join("")}</div>
      </div>`;
  }).join("");
}

function summaryHtml(products) {
  const years = products.map(product => +product.release_year).filter(Boolean);
  const by = (key, value) => countWhere(products, product => product[key] === value);
  const stat = (value, label) => `<div class="stat"><strong>${value}</strong><span>${label}</span></div>`;
  return `
    <div class="summary">
      <h2 class="panel-title">Brand DNA</h2>
      <div class="stat-grid">
        ${stat(products.length, "Total models")}
        ${stat(by("status", "Active"), "Active now")}
        ${stat(years.length ? Math.min(...years) : "—", "First model")}
        ${stat(years.length ? Math.max(...years) : "—", "Latest model")}
      </div>
      <div class="breakdown">
        <div class="breakdown-label">Acoustic design</div>
        ${breakdownBar([
          { label: "Closed", className: "closed-back", count: by("design", "Closed Back") },
          { label: "Open", className: "open-back", count: by("design", "Open Back") },
          { label: "Semi", className: "semi-open", count: countWhere(products, p => p.design !== "Closed Back" && p.design !== "Open Back") },
        ])}
      </div>
      <div class="breakdown">
        <div class="breakdown-label">Driver technology</div>
        ${breakdownBar([
          { label: "Dynamic", className: "dynamic", count: by("driver_type", "Dynamic") },
          { label: "Planar", className: "planar", count: by("driver_type", "Planar Magnetic") },
          { label: "Electro", className: "electrostatic", count: by("driver_type", "Electrostatic") },
          { label: "Other", className: "other-driver",
            count: countWhere(products, p => !["Dynamic", "Planar Magnetic", "Electrostatic"].includes(p.driver_type)) },
        ])}
      </div>
      <div class="breakdown">
        <div class="breakdown-label">Form factor</div>
        ${breakdownBar([
          { label: "Over-Ear", className: "over-ear", count: countWhere(products, p => p.fit !== "On-Ear") },
          { label: "On-Ear", className: "on-ear", count: by("fit", "On-Ear") },
        ])}
      </div>
    </div>`;
}

function render(brand, products) {
  document.title = `${brand.name} — The Headphone Archive`;
  const statusClass = brand.status === "Active" ? "active" : "discontinued";
  document.getElementById("brandHero").innerHTML = `
    <div class="brand-hero">
      <div class="eyebrow">Brand Study</div>
      <div class="brand-name">${escapeHtml(brand.name)}</div>
      <div class="brand-facts">
        <span class="pill">${escapeHtml(brand.country)}</span>
        ${brand.founded_year ? `<span class="pill">Est. ${escapeHtml(brand.founded_year)}</span>` : ""}
        <span class="pill ${statusClass}">${escapeHtml(brand.status)}</span>
        ${brand.website ? `<a href="${escapeHtml(brand.website)}" target="_blank" rel="noopener">${escapeHtml(brand.website.replace(/^https?:\/\//, ""))} &nearr;</a>` : ""}
      </div>
      ${brand.description ? `<p class="brand-description">${escapeHtml(brand.description)}</p>` : ""}
    </div>`;

  document.getElementById("brandContent").innerHTML = `
    <div class="brand-body">
      <aside>${summaryHtml(products)}</aside>
      <main>
        <h2 class="panel-title">Product history &mdash; ${products.length} headphone${products.length === 1 ? "" : "s"}</h2>
        ${timelineHtml(products) || '<p class="empty-note">No products found.</p>'}
      </main>
    </div>`;
}

async function load() {
  const hero = document.getElementById("brandHero");
  const brandId = new URLSearchParams(location.search).get("id");
  if (!brandId) {
    hero.innerHTML = '<div class="error-state">No brand specified. <a href="index.html">Return to archive.</a></div>';
    return;
  }
  try {
    const response = await fetch(`/api/brands?id=${encodeURIComponent(brandId)}`);
    const data = await response.json();
    if (!data.ok) throw new Error(data.error || "Not found");
    render(data.brand, data.products);
  } catch (e) {
    hero.innerHTML = `<div class="error-state">Could not load brand: ${escapeHtml(e.message)}</div>`;
  }
}

load();
</script>
</body>
</html>
