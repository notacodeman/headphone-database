<footer>
  <span>Data: community-maintained CSV catalog</span>
  <span id="source"></span>
</footer>

<script>
// ---- Config & data source ----
// RAW_BASE points at the GitHub raw CSVs, which are the fallback data source. The
// site normally reads the live D1 catalog API and only drops to these CSVs if that fails.
const RAW_BASE = "https://raw.githubusercontent.com/notacodeman/headphone-database/main/database";

// Column definitions. `on` is the default visibility. `w` is a relative weight used to
// split 100% of the table's width; `minW` is a soft floor in pixels — the width
// distributor (see distributeColumnWidths) tries not to shrink a column past it, only
// giving up on that if every visible column is already at its floor and there still
// isn't enough room, so the table still never overflows. `fixed: true` opts a column
// out of that proportional split entirely — it always renders at exactly `w` pixels
// (like the compare/caret columns), for content whose size doesn't vary meaningfully
// (a 4-digit year, a short enum), so it never wastes flex space or gets squeezed. `w` is
// sized to the longest value that column actually shows today (measured against the real
// header/cell fonts, not guessed) — re-measure if a column's content set changes.
// A fixed column with `wSmall`/`labelSmall` also gets a drag handle: dragging it snaps
// between the normal width/label and this compact one (see startResize/FIXED_DRAG_THRESHOLD)
// instead of resizing continuously, since there's no in-between size that makes sense for
// content this short.
const COLS = [
  { key: "_brand",         label: "Brand",       on: true,  sortable: true,  w: 130, minW: 110 },
  { key: "model_name",     label: "Model",       on: true,  sortable: true,  w: 180, minW: 150 },
  { key: "release_year",   label: "Year", labelSmall: "Y", on: true, sortable: true, w: 58, wSmall: 42, fixed: true },
  { key: "design",     label: "Design", labelSmall: "D", on: true, sortable: true, w: 116, wSmall: 34, fixed: true },
  { key: "fit",            label: "Fit",         on: true,  sortable: true,  w: 92,  fixed: true },
  { key: "driver_type",    label: "Driver",      on: false, sortable: true,  w: 130, minW: 90 },
  { key: "driver_size_mm", label: "Driver Size", on: false, sortable: true,  w: 120, minW: 90 },
  { key: "impedance_ohms", label: "Impedance",   on: true,  sortable: true,  w: 104, fixed: true },
  { key: "sensitivity_db", label: "Sensitivity", on: false, sortable: true,  w: 130, minW: 90 },
  { key: "status",         label: "Status",      on: false, sortable: true,  w: 130, minW: 90 },
  { key: "_flags",         label: "Wireless/ANC", on: false, sortable: false, w: 120, minW: 90 },
  { key: "weight_g",       label: "Weight (g)",   on: false, sortable: true,  w: 100, minW: 70 },
  { key: "msrp_usd",       label: "MSRP (USD)",   on: true,  sortable: true,  w: 110, minW: 80 },
  { key: "connector_type", label: "Connector",    on: false, sortable: true,  w: 140, minW: 100 },
  { key: "detachable_cable",label:"Detachable",   on: false, sortable: true,  w: 100, minW: 80 }
];

// ---- Application state ----
// Single source of truth for the table: all rows, the filtered subset, current sort,
// and per-column visibility. render() reads only from here, never from the DOM.
const state = { rows: [], filtered: [], sortKey: "release_year", sortDir: "descending", visible: {}, small: {} };

// ---- Compare state ----
// compareSet holds integer IDs (up to 3). URL: ?compare=1,42,187
const compareSet = new Set();
const COMPARE_MAX = 3;

function compareFromURL() {
  const params = new URLSearchParams(location.search);
  const ids = (params.get("compare") || "").split(",").map(s => parseInt(s, 10)).filter(n => n > 0);
  compareSet.clear();
  ids.slice(0, COMPARE_MAX).forEach(id => compareSet.add(id));
}

function compareToURL() {
  const params = new URLSearchParams(location.search);
  if (compareSet.size > 0) {
    params.set("compare", [...compareSet].join(","));
  } else {
    params.delete("compare");
  }
  const newURL = params.toString() ? `${location.pathname}?${params}` : location.pathname;
  history.replaceState(null, "", newURL);
}

function toggleCompare(intId) {
  if (compareSet.has(intId)) {
    compareSet.delete(intId);
  } else {
    if (compareSet.size >= COMPARE_MAX) return; // max reached
    compareSet.add(intId);
  }
  compareToURL();
  updateCompareBar();
  // Update just the affected row's button without full re-render
  document.querySelectorAll(`tr.datarow[data-id="${intId}"]`).forEach(tr => {
    const btn = tr.querySelector(".cmpbtn");
    if (btn) syncCompareBtnState(btn, intId);
  });
}

function syncCompareBtnState(btn, intId) {
  const selected = compareSet.has(intId);
  const full = !selected && compareSet.size >= COMPARE_MAX;
  btn.classList.toggle("cmpbtn--on", selected);
  btn.setAttribute("aria-pressed", String(selected));
  btn.setAttribute("title", selected ? "Remove from comparison" : (full ? "Maximum 3 selected" : "Add to comparison"));
  btn.disabled = full;
}

// Load saved column prefs (works on the live site; falls back to defaults if unavailable)
function loadColPrefs() {
  COLS.forEach(c => state.visible[c.key] = c.on);
  try {
    const saved = JSON.parse(localStorage.getItem("archive_cols") || "null");
    if (saved) COLS.forEach(c => { if (c.key in saved) state.visible[c.key] = !!saved[c.key]; });
  } catch (e) {}
}
function saveColPrefs() {
  try { localStorage.setItem("archive_cols", JSON.stringify(state.visible)); } catch (e) {}
}

const CARET_W = 44;
const COMPARE_COL_W = 44;
// Column widths are now proportional *weights*, not absolute pixels. The data
// columns split 100% of the available width by weight, so the table always
// fills the container exactly and never overflows. Dragging a divider moves
// weight from that column to its right neighbor, keeping the total constant.
const colW = {};
function loadColW(){ COLS.forEach(c=>colW[c.key]=c.w); try{ const s=JSON.parse(localStorage.getItem("archive_colw")||"null"); if(s) COLS.forEach(c=>{ if(typeof s[c.key]==="number") colW[c.key]=s[c.key]; });}catch(e){} }
function saveColW(){ try{ localStorage.setItem("archive_colw",JSON.stringify(colW)); }catch(e){} }
// Per-column "small" mode for fixed columns that define a wSmall/labelSmall (currently
// Year and Design) — toggled by dragging their handle, see startResize.
function loadColSmall(){ try{ const s=JSON.parse(localStorage.getItem("archive_colsmall")||"null"); if(s) COLS.forEach(c=>{ if(c.wSmall) state.small[c.key] = !!s[c.key]; }); }catch(e){} }
function saveColSmall(){ try{ localStorage.setItem("archive_colsmall",JSON.stringify(state.small)); }catch(e){} }
// The effective width of a fixed column right now (its compact width when in small mode).
function fixedColW(c){ return (c.fixed && c.wSmall && state.small[c.key]) ? c.wSmall : c.w; }
// Sum of weights for currently-visible, non-fixed data columns.
function visibleWeight(){ return COLS.filter(c=>state.visible[c.key] && !c.fixed).reduce((s,c)=>s+colW[c.key],0); }
// Percentage width for one column = its share of the visible weight.
function colPct(key){ const t=visibleWeight(); return t>0 ? (colW[key]/t*100) : 0; }
// Total pixels permanently reserved by visible `fixed: true` columns (they render at
// exactly their w in px, outside the proportional split — see the COLS comment above).
function fixedColsPx(cols){ return cols.filter(c=>c.fixed).reduce((s,c)=>s+fixedColW(c),0); }

// Splits containerPx among `cols` by weight, same as colPct, but tries not to shrink
// any column below its minW. When a column's proportional share would be too small,
// it's bumped up to minW and the shortfall is taken from the still-flexible columns
// (proportional to their own weight), repeating until stable. If every column is
// already at its floor and there's still a shortfall, the floors are abandoned and
// widths fall back to a plain proportional split — the table filling its container
// with no overflow always wins over honoring a soft minimum. Returns {key: pixels}.
function distributeColumnWidths(cols, containerPx) {
  const totalWeight = cols.reduce((s, c) => s + colW[c.key], 0);
  const px = {};
  if (totalWeight <= 0 || containerPx <= 0) { cols.forEach(c => px[c.key] = 0); return px; }
  cols.forEach(c => { px[c.key] = colW[c.key] / totalWeight * containerPx; });

  const totalMin = cols.reduce((s, c) => s + (c.minW || 0), 0);
  if (totalMin >= containerPx) return px; // no room to honor floors; plain split stands

  const locked = new Set();
  for (let iter = 0; iter < cols.length; iter++) {
    let deficit = 0;
    cols.forEach(c => {
      if (!locked.has(c.key) && px[c.key] < (c.minW || 0)) {
        deficit += c.minW - px[c.key];
        px[c.key] = c.minW;
        locked.add(c.key);
      }
    });
    if (deficit <= 0) break;
    const flexible = cols.filter(c => !locked.has(c.key));
    if (!flexible.length) break;
    const flexWeight = flexible.reduce((s, c) => s + colW[c.key], 0);
    flexible.forEach(c => { px[c.key] -= deficit * (colW[c.key] / flexWeight); });
  }
  return px;
}

// Re-applies distributeColumnWidths' output to the live <th> elements. Shared by the
// column-drag reflow and the window-resize listener below, so both paths honor minW.
function reflowColumnWidths() {
  const tbl = document.querySelector("#tablewrap table");
  if (!tbl) return;
  const dataCols = COLS.filter(c => state.visible[c.key]);
  const flexCols = dataCols.filter(c => !c.fixed);
  // Percentage widths on the flexible data columns are only sharing out whatever's left
  // after the two fixed-px utility columns (compare/caret) AND any `fixed: true` data
  // columns, so minimums must be computed — and percentages back-converted — against
  // that remainder, not the table's full width.
  const dataAreaPx = tbl.clientWidth - COMPARE_COL_W - CARET_W - fixedColsPx(dataCols);
  const px = distributeColumnWidths(flexCols, dataAreaPx);
  flexCols.forEach(c => {
    const th = tbl.querySelector(`th[data-key="${c.key}"]`);
    if (th) th.style.width = (px[c.key] / dataAreaPx * 100) + "%";
  });
}
// Sizes #tablewrap's own scroll area to exactly whatever vertical space is left in the
// viewport below it, down to the footer, so the table scrolls internally instead of the
// whole page needing to scroll to reach the bottom. Recomputed on load, on window resize,
// and once web fonts finish swapping in (which can shift the header's height slightly).
// The filters popover is `position:absolute` and doesn't affect document flow, so opening
// it doesn't require a recompute.
function fitTableHeight() {
  const wrap = document.getElementById("tablewrap");
  if (!wrap) return;
  // Below 600px the mobile card layout takes over and wants the whole page to scroll
  // normally (max-height: none, set by the mobile media query) — clear any inline
  // override from a wider viewport so that CSS rule can apply again.
  if (window.innerWidth <= 600) { wrap.style.maxHeight = ""; return; }
  const top = wrap.getBoundingClientRect().top;
  const footer = document.querySelector("footer");
  const footerH = footer ? footer.getBoundingClientRect().height : 0;
  const available = window.innerHeight - top - footerH;
  wrap.style.maxHeight = Math.max(200, Math.floor(available)) + "px";
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTableHeight);
fitTableHeight();

let resizeReflowTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeReflowTimer);
  resizeReflowTimer = setTimeout(() => { reflowColumnWidths(); fitTableHeight(); }, 100);
});

let resizing = null;
// Dragging a fixed column's handle (Year, Design — anything with wSmall) doesn't resize
// continuously; it snaps between the normal and small width/label once the drag passes
// FIXED_DRAG_THRESHOLD px, since there's no useful in-between size for content this short.
let fixedDrag = null;
const FIXED_DRAG_THRESHOLD = 15;
document.addEventListener("mousemove", e => {
  if (fixedDrag) {
    const delta = e.clientX - fixedDrag.startX;
    let next = fixedDrag.startSmall;
    if (!fixedDrag.startSmall && delta < -FIXED_DRAG_THRESHOLD) next = true;
    else if (fixedDrag.startSmall && delta > FIXED_DRAG_THRESHOLD) next = false;
    if (next !== state.small[fixedDrag.key]) {
      state.small[fixedDrag.key] = next;
      render();
    }
    return;
  }
  if (!resizing) return;
  const tbl = document.querySelector("#tablewrap table");
  if (!tbl) return;
  // Translate the pixel drag into a change in this column's weight, measured against
  // the space actually available to flexible data columns (table width minus the two
  // fixed-px compare/caret columns and any `fixed: true` data columns) so a 100px drag
  // feels like 100px on screen. `fixed` columns never take part in this at all.
  const dataCols = COLS.filter(c=>state.visible[c.key] && !c.fixed);
  const others = dataCols.filter(c=>c.key!==resizing.key);
  if (!others.length) return;                  // only one column visible; nothing to trade against
  const pxPerWeight = (tbl.clientWidth - COMPARE_COL_W - CARET_W - fixedColsPx(COLS.filter(c=>state.visible[c.key]))) / resizing.startTotal;
  let deltaW = (e.clientX - resizing.startX) / pxPerWeight;
  // Clamp: the dragged column can't shrink below MINW, and can't grow so far
  // that the remaining columns would each be pushed below MINW.
  const MINW = 30;
  const minOthersTotal = others.length * MINW;
  const maxGrow = resizing.startOthersTotal - minOthersTotal;
  deltaW = Math.max(-(resizing.startW - MINW), Math.min(maxGrow, deltaW));
  // Grow/shrink the dragged column, then scale every OTHER column proportionally
  // to absorb the opposite change. The grand total stays constant, so all columns
  // visibly reflow together and the table always fills the container.
  colW[resizing.key] = resizing.startW + deltaW;
  const scale = (resizing.startOthersTotal - deltaW) / resizing.startOthersTotal;
  others.forEach(c => { colW[c.key] = resizing.startOtherW[c.key] * scale; });
  // Re-apply widths to every visible column so the whole row reflows, not just the
  // two columns nearest the divider — routed through distributeColumnWidths so a
  // drag can't push a column past its soft minimum either.
  reflowColumnWidths();
});
document.addEventListener("mouseup", () => {
  if (fixedDrag) { fixedDrag = null; document.body.style.userSelect = ""; saveColSmall(); return; }
  if (resizing){ resizing=null; document.body.style.userSelect=""; saveColW(); }
});
function startResize(e){
  const key = e.target.getAttribute("data-key");
  const col = COLS.find(c => c.key === key);
  if (col && col.fixed) {
    // Fixed columns snap between two states rather than resizing continuously.
    fixedDrag = { key, startX: e.clientX, startSmall: !!state.small[key] };
    document.body.style.userSelect = "none";
    e.preventDefault(); e.stopPropagation();
    return;
  }
  const dataCols = COLS.filter(c=>state.visible[c.key] && !c.fixed);
  const others = dataCols.filter(c=>c.key!==key);
  if (!others.length) { e.preventDefault(); e.stopPropagation(); return; }
  // Snapshot every starting weight so the whole drag is computed from the state
  // at mousedown; this avoids cumulative drift from reading values mid-drag.
  const startOtherW = {}; others.forEach(c=>startOtherW[c.key]=colW[c.key]);
  const startOthersTotal = others.reduce((s,c)=>s+colW[c.key],0);
  resizing = { key, startX:e.clientX, startW:colW[key],
               startTotal:visibleWeight(), startOthersTotal, startOtherW };
  document.body.style.userSelect = "none";
  e.preventDefault(); e.stopPropagation();
}

// ---- CSV fallback parser ----
// Quote-aware CSV parser used only on the fallback path. It mirrors the server's parser
// so the site renders identically whether data came from the API or the raw CSVs.
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i+1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === '\r') { /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  const header = rows.shift();
  return rows.filter(r => r.length > 1).map(r => {
    const o = {}; header.forEach((h, i) => o[h.trim()] = (r[i] || "").trim()); return o;
  });
}

// ---- Data loading ----
// Primary load path: fetch the live D1 catalog. On any failure (network, empty, or a
// server error) it delegates to loadFromCSV() so the archive still renders something.
async function load() {
  // Prefer the live D1 catalog; fall back to the GitHub CSVs so the site never breaks.
  try {
    const res = await fetch("/api/catalog");
    if (res.ok) {
      const data = await res.json();
      if (data.ok && data.products && data.products.length) {
        state.rows = data.products.map(p => ({ ...p, _brand: p._brand || "Unknown" }));
        initFilters();
        buildColMenu();
        apply();
        updateCompareBar();
        handleFocusParam();
        document.getElementById("source").innerHTML =
          'Source: <a href="https://github.com/notacodeman/headphone-database">github.com/notacodeman/headphone-database</a>';
        return;
      }
    }
    throw new Error("api empty");
  } catch (e) {
    await loadFromCSV();
  }
}

// Fallback loader: fetch both CSVs from GitHub, join brand names client-side, and
// populate state. If even this fails it shows an inline "catalog unavailable" message.
async function loadFromCSV() {
  try {
    const [pRes, mRes] = await Promise.all([
      fetch(RAW_BASE + "/products.csv"),
      fetch(RAW_BASE + "/manufacturers.csv")
    ]);
    if (!pRes.ok || !mRes.ok) throw new Error("fetch failed");
    const products = parseCSV(await pRes.text());
    const mfrs = parseCSV(await mRes.text());
    const mfrName = {};
    mfrs.forEach(m => mfrName[m.manufacturer_id] = m.name);
    products.forEach(p => p._brand = mfrName[p.manufacturer_id] || "Unknown");
    state.rows = products;
    initFilters();
    buildColMenu();
    apply();
    updateCompareBar();
    handleFocusParam();
    fitTableHeight();
    document.getElementById("source").innerHTML =
      'Source: <a href="https://github.com/notacodeman/headphone-database">github.com/notacodeman/headphone-database</a>';
  } catch (e) {
    document.getElementById("tablewrap").innerHTML =
      '<div class="empty">Could not load the catalog. If you just updated the repo, give it a moment and refresh.</div>';
    document.getElementById("statnums").innerHTML = '<span>Catalog unavailable</span>';
    fitTableHeight();
  }
}

// Fixed valid values — must match _generate_data.py VALID_* constants exactly.
// Hardcoding these means a data typo can never silently create a new filter option.
const FILTER_DESIGN  = ["Closed Back", "Open Back", "Semi-Open"];
const FILTER_DRIVER  = ["AMT", "Dynamic", "Electrostatic", "Hybrid", "Planar Magnetic", "Ribbon"];
const FILTER_STATUS  = ["Active", "Discontinued", "Legacy Active"];
const FILTER_FIT     = ["On-Ear", "Over-Ear"];

function uniqueSorted(key) {
  return [...new Set(state.rows.map(r => r[key]).filter(Boolean))].sort();
}

// ---- Filters ----
// Populates the filter dropdowns and the header stat counts, then wires every filter
// control to re-run apply() on change. Called once after data loads (and on CSV refallback).
function initFilters() {
  const fill = (id, vals) => {
    const sel = document.getElementById(id);
    // Remove any options added on a previous call (re-initialisation on CSV fallback)
    while (sel.options.length > 1) sel.remove(1);
    vals.forEach(v => { const o = document.createElement("option"); o.value = v; o.textContent = v; sel.appendChild(o); });
  };
  // Brand: dynamic (94+ brands — hardcoding would be unmaintainable)
  fill("brand", uniqueSorted("_brand"));
  // Design / driver / status: fixed sets — never drift with data
  fill("design", FILTER_DESIGN);
  fill("fit",    FILTER_FIT);
  fill("driver", FILTER_DRIVER);
  fill("status", FILTER_STATUS);

  const brands = uniqueSorted("_brand").length;
  const years = state.rows.map(r => +r.release_year).filter(Boolean);
  document.getElementById("statnums").innerHTML =
    `<span><strong>${state.rows.length}</strong> headphones</span>` +
    `<span><strong>${brands}</strong> brands</span>` +
    `<span><strong>${Math.min(...years)}</strong>&ndash;<strong>${Math.max(...years)}</strong></span>`;

  ["q","brand","design","fit","driver","status","sig","connector","detachable","imp_max","price_max"].forEach(id =>
    document.getElementById(id).addEventListener("input", apply));
  document.getElementById("reset").addEventListener("click", () => {
    ["q","brand","design","fit","driver","status","sig","connector","detachable","imp_max","price_max"].forEach(id => document.getElementById(id).value = "");
    apply();
  });
}

// Builds the show/hide-columns checkbox menu from COLS, reflecting current visibility
// and persisting any toggle to localStorage before re-rendering the table.
function buildColMenu() {
  const wrap = document.getElementById("colboxes");
  wrap.innerHTML = "";
  COLS.forEach(c => {
    const id = "col_" + c.key;
    const lab = document.createElement("label");
    lab.innerHTML = `<input type="checkbox" id="${id}" ${state.visible[c.key] ? "checked" : ""}> ${c.label}`;
    wrap.appendChild(lab);
    lab.querySelector("input").addEventListener("change", (e) => {
      state.visible[c.key] = e.target.checked;
      saveColPrefs();
      render();
    });
  });
}

// ---- Filter + sort pipeline ----
// Reads every filter control, narrows state.rows into state.filtered, then sorts and
// renders. This is the single entry point re-run whenever any filter or search changes.
function apply() {
  const q        = document.getElementById("q").value.toLowerCase();
  const b        = document.getElementById("brand").value;
  const d        = document.getElementById("design").value;
  const ft       = document.getElementById("fit").value;
  const dr       = document.getElementById("driver").value;
  const s        = document.getElementById("status").value;
  const sig      = document.getElementById("sig").value;
  const conn     = document.getElementById("connector").value;
  const detach   = document.getElementById("detachable").value;
  const impMax   = parseFloat(document.getElementById("imp_max").value) || null;
  const priceMax = parseFloat(document.getElementById("price_max").value) || null;

  state.filtered = state.rows.filter(r => {
    if (b      && r._brand            !== b)     return false;
    if (d      && r.design            !== d)     return false;
    if (ft     && r.fit               !== ft)    return false;
    if (dr     && r.driver_type       !== dr)    return false;
    if (s      && r.status            !== s)     return false;
    if (sig    && r.sound_signature   !== sig)   return false;
    if (conn   && r.connector_type    !== conn)  return false;
    if (detach && r.detachable_cable  !== detach) return false;
    if (impMax !== null) {
      const imp = parseFloat(r.impedance_ohms);
      if (isNaN(imp) || imp > impMax) return false;
    }
    if (priceMax !== null) {
      const price = parseFloat(r.msrp_usd);
      if (isNaN(price) || price > priceMax) return false;
    }
    if (q) {
      const hay = [r.full_name, r._brand, r.notes, r.model_name].map(x => x || "").join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  sortRows();
  render();
  updateFilterBadge();
}

// Sorts state.filtered in place by the active column. Numeric spec columns are compared
// as numbers (blank treated as 0); everything else is compared case-insensitively as text.
function sortRows() {
  const k = state.sortKey, dir = state.sortDir === "ascending" ? 1 : -1;
  const numeric = ["release_year","driver_size_mm","impedance_ohms","sensitivity_db"];
  state.filtered.sort((a, b) => {
    let va = a[k], vb = b[k];
    if (numeric.includes(k)) {
      va = parseFloat(va) || 0; vb = parseFloat(vb) || 0;
    } else { va = (va||"").toLowerCase(); vb = (vb||"").toLowerCase(); }
    return va < vb ? -dir : va > vb ? dir : 0;
  });
}

// ---- Cell rendering ----
// Returns the inner HTML for one table cell, with per-column formatting (brand links,
// status tags, spec units, wireless/ANC flags). All user-visible strings pass through esc().
function cellValue(r, key) {
  if (key === "_brand") return `<a class="brand" href="brand.html?id=${esc(r.manufacturer_id)}">${esc(r._brand)}</a>`;
  if (key === "model_name") return `<span class="model-name">${esc(r.model_name)}</span>`;
  if (key === "release_year") {
    if (state.small.release_year) return `<span class="year">${esc(String(r.release_year ?? "").slice(-2))}</span>`;
    return `<span class="year">${esc(r.release_year)}${r.discontinued_year ? "&ndash;" + esc(r.discontinued_year) : ""}</span>`;
  }
  if (key === "design") {
    if (state.small.design) return esc((r.design || "").charAt(0).toUpperCase());
    return esc(r.design);
  }
  if (key === "status") {
    const cls = /disc/i.test(r.status) ? "disc" : "active";
    return `<span class="tag ${cls}">${esc(r.status)}</span>`;
  }
  if (key === "driver_size_mm") return specCell(r.driver_size_mm, "mm");
  if (key === "impedance_ohms") return specCell(r.impedance_ohms, "\u03A9");
  if (key === "sensitivity_db") return specCell(r.sensitivity_db, "dB");
  if (key === "_flags") {
    const f = [];
    if (r.wireless === "Yes") f.push("WL");
    if (r.anc === "Yes") f.push("ANC");
    return `<span class="flags">${f.join(" \u00b7 ") || "&mdash;"}</span>`;
  }
  if (key === "weight_g") return r.weight_g ? `<span class="spec">${esc(r.weight_g)}\u200ag</span>` : `<span class="spec empty">&mdash;</span>`;
  if (key === "msrp_usd") return r.msrp_usd ? `<span class="spec">$${Number(r.msrp_usd).toLocaleString()}</span>` : `<span class="spec empty">&mdash;</span>`;
  if (key === "connector_type") return r.connector_type ? `<span class="spec">${esc(r.connector_type)}</span>` : `<span class="spec empty">&mdash;</span>`;
  if (key === "detachable_cable") return r.detachable_cable ? `<span class="spec">${esc(r.detachable_cable)}</span>` : `<span class="spec empty">&mdash;</span>`;
  return esc(r[key]);
}

function specCell(val, unit) {
  if (!val) return '<span class="spec empty">&mdash;</span>';
  return `<span class="spec">${esc(val)}\u200a${unit}</span>`;
}

function modelById(id) {
  const r = state.rows.find(x => x.product_id === id);
  return r ? `${r._brand} ${r.model_name}` : id;
}

// Builds the expandable detail panel shown when a row is clicked, listing every spec
// as a definition list plus a lineage chain visualization and a review-search shortcut.
function rowDetail(r) {
  const parts = [];
  const add = (label, val, unit = "") => { if (val) parts.push(`<div><dt>${esc(label)}</dt><dd>${esc(val)}${unit}</dd></div>`); };
  add("Full name", r.full_name);
  add("Released", r.release_year);
  add("Discontinued", r.discontinued_year);
  add("Status", r.status);
  add("Category", r.category);
  add("Design", r.design);
  add("Fit", r.fit || "Over-Ear");
  add("Driver type", r.driver_type);
  add("Driver size", r.driver_size_mm, "\u200amm");
  add("Impedance", r.impedance_ohms, "\u200a\u03A9");
  add("Sensitivity", r.sensitivity_db, "\u200adB");
  add("Wireless", r.wireless);
  add("Active noise cancelling", r.anc);
  if (r.weight_g)        add("Weight", r.weight_g, "\u200ag");
  if (r.msrp_usd)        add("Launch price", "$" + Number(r.msrp_usd).toLocaleString());
  if (r.connector_type)  add("Connector", r.connector_type);
  if (r.detachable_cable) add("Detachable cable", r.detachable_cable);
  if (r.sound_signature) add("Sound signature", r.sound_signature);
  if (r.msrp_usd) add("Launch price", "$" + Number(r.msrp_usd).toLocaleString());

  // Build lineage chain — walk back to root predecessor, then forward to end
  let lineageHtml = "";
  if (r.predecessor || r.successor) {
    // Collect full chain: walk predecessors backward, then append current + successors forward
    const chain = [];
    let cur = r.predecessor;
    const visited = new Set();
    while (cur && !visited.has(cur)) {
      visited.add(cur);
      const p = state.rows.find(x => x.product_id === cur);
      if (!p) break;
      chain.unshift(p);
      cur = p.predecessor;
    }
    chain.push(r);
    cur = r.successor;
    visited.clear();
    while (cur && !visited.has(cur)) {
      visited.add(cur);
      const s = state.rows.find(x => x.product_id === cur);
      if (!s) break;
      chain.push(s);
      cur = s.successor;
    }

    if (chain.length > 1) {
      const nodes = chain.map(p => {
        const isCurrent = p.product_id === r.product_id;
        const yr = p.release_year || "";
        // All nodes use the integer id to match tr.datarow[data-id]
        // Current node still clickable — toggles its own row closed
        return `<span class="ln-node${isCurrent ? " ln-current" : " ln-other"}" data-id="${esc(p.id)}" title="${esc(p._brand + " " + p.model_name + (yr ? " (" + yr + ")" : ""))}">
          <span class="ln-name">${esc(p.model_name)}</span>
          ${yr ? `<span class="ln-year">${yr}</span>` : ""}
        </span>`;
      });
      const joined = nodes.join('<span class="ln-arrow">\u2192</span>');
      lineageHtml = `<div class="lineage-chain"><div class="ln-label">Lineage</div><div class="ln-row">${joined}</div></div>`;
    }
  }

  const q = encodeURIComponent(`${r._brand} ${r.model_name} headphone review measurements`);
  return `
    <dl class="detail-specs">${parts.join("")}</dl>
    ${r.notes ? `<p class="detail-notes">${esc(r.notes)}</p>` : ""}
    ${lineageHtml}
    <p class="detail-links"><a href="https://duckduckgo.com/?q=${q}" target="_blank" rel="noopener">Find reviews &amp; measurements &rarr;</a></p>
  `;
}

function toggleDetail(tr) {
  const detail = tr.nextElementSibling;
  if (!detail || !detail.classList.contains("detailrow")) return;
  const opening = detail.hasAttribute("hidden");
  if (opening) detail.removeAttribute("hidden"); else detail.setAttribute("hidden", "");
  tr.classList.toggle("expanded", opening);
  const btn = tr.querySelector(".expandbtn");
  if (btn) btn.setAttribute("aria-expanded", String(opening));
}

// ---- Table render ----
// Rebuilds the entire table from state: header cells with sort + resizer handles, data
// rows, the compare button, and the expand caret. Pure and idempotent — safe to call anytime.
function render() {
  document.getElementById("count").textContent =
    `${state.filtered.length} result${state.filtered.length === 1 ? "" : "s"}`;
  if (!state.filtered.length) {
    document.getElementById("tablewrap").innerHTML = '<div class="empty">No headphones match those filters.</div>';
    return;
  }
  const cols = COLS.filter(c => state.visible[c.key]);
  const flexCols = cols.filter(c => !c.fixed);
  // Compute widths up front against the wrapper's current pixel width (the table itself
  // doesn't exist yet) so soft minimums are honored on first paint, not just mid-drag.
  // Percentages only divide up what's left after the fixed-px compare/caret columns and
  // any `fixed: true` data columns, so the budget passed in — and used to convert back
  // to a percentage — has to match that same remainder.
  const wrapperPx = document.getElementById("tablewrap").clientWidth || 0;
  const dataAreaPx = Math.max(0, wrapperPx - COMPARE_COL_W - CARET_W - fixedColsPx(cols));
  const colPx = distributeColumnWidths(flexCols, dataAreaPx);
  let html = `<table class="autofit"><thead><tr>`;
  cols.forEach(c => {
    const sortAttr = c.sortable ? (state.sortKey === c.key ? ` aria-sort="${state.sortDir}"` : ' aria-sort="none"') : "";
    const last = c.key === cols[cols.length-1].key;
    // Last data column gets no resizer (nothing to its right to borrow from). A fixed
    // column only gets one if it has a small mode to snap to (wSmall) — otherwise its
    // width never changes at all, so a handle would be a false affordance.
    const canResize = !last && (!c.fixed || c.wSmall);
    const rz = canResize ? `<span class="resizer" data-key="${c.key}"></span>` : "";
    const widthStyle = c.fixed ? `${fixedColW(c)}px` : (dataAreaPx > 0 ? (colPx[c.key] / dataAreaPx * 100) + "%" : colPct(c.key) + "%");
    const label = (c.fixed && c.labelSmall && state.small[c.key]) ? c.labelSmall : c.label;
    html += `<th scope="col" data-key="${c.key}" style="width:${widthStyle}"${sortAttr}><span>${label}</span>${rz}</th>`;
  });
  html += `<th scope="col" class="cmpcol" style="width:${COMPARE_COL_W}px"><span class="vh">Compare</span></th>`;
  html += `<th scope="col" class="caretcol" style="width:${CARET_W}px"><span class="vh">Details</span></th>`;
  html += "</tr></thead><tbody>";
  state.filtered.forEach((r, i) => {
    const z = i % 2 ? " zebra" : "";
    const label = `${r._brand} ${r.model_name}`;
    const intId = r.id ? parseInt(r.id, 10) : 0;
    const selected = compareSet.has(intId);
    const full = !selected && compareSet.size >= COMPARE_MAX;
    html += `<tr class="datarow${z}" data-id="${intId}">` +
      cols.map(c => `<td data-key="${c.key}">${cellValue(r, c.key)}</td>`).join("") +
      `<td class="cmpcol"><button class="cmpbtn${selected?" cmpbtn--on":""}" data-cid="${intId}" aria-pressed="${selected}" ${full?"disabled":""} title="${selected?"Remove from comparison":(full?"Maximum 3 selected":"Add to comparison")}"></button></td>` +
      `<td class="caretcol"><button class="expandbtn" aria-expanded="false" aria-label="Show details for ${esc(label)}"><span class="caret" aria-hidden="true">\u203A</span></button></td>` +
      `</tr>`;
    html += `<tr class="detailrow${z}" hidden><td colspan="${cols.length + 2}"><div class="detailwrap">${rowDetail(r)}</div></td></tr>`;
  });
  html += "</tbody></table>";
  document.getElementById("tablewrap").innerHTML = html;

  document.querySelectorAll("tr.datarow").forEach(tr => {
    tr.addEventListener("click", (e) => {
      if (e.target.closest("a") || e.target.closest(".cmpbtn")) return;
      toggleDetail(tr);
    });
  });

  document.querySelectorAll(".ln-node.ln-other").forEach(node => {
    node.addEventListener("click", () => {
      const intId = node.getAttribute("data-id");
      let targetTr = document.querySelector(`tr.datarow[data-id="${intId}"]`);

      // If the target isn't currently rendered (filtered out), clear all filters first
      if (!targetTr) {
        ["q","brand","design","fit","driver","status","imp_max","price_max"].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.value = "";
        });
        apply();
        targetTr = document.querySelector(`tr.datarow[data-id="${intId}"]`);
      }

      if (!targetTr) return;
      // Close any open detail rows
      document.querySelectorAll("tr.detailrow:not([hidden])").forEach(dr => {
        dr.setAttribute("hidden", "");
        dr.previousElementSibling.classList.remove("expanded");
      });
      targetTr.scrollIntoView({ behavior: "smooth", block: "center" });
      setTimeout(() => toggleDetail(targetTr), 300);
    });
  });

  document.querySelectorAll(".cmpbtn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const intId = parseInt(btn.getAttribute("data-cid"), 10);
      if (intId) toggleCompare(intId);
    });
  });

  document.querySelectorAll(".resizer").forEach(rz => {
    rz.addEventListener("mousedown", startResize);
    rz.addEventListener("click", e => e.stopPropagation());
  });

  document.querySelectorAll("th[data-key]").forEach(th => {
    const key = th.getAttribute("data-key");
    const col = COLS.find(c => c.key === key);
    if (!col || !col.sortable) return;
    th.setAttribute("tabindex", "0");
    th.setAttribute("role", "button");
    const doSort = () => {
      if (state.sortKey === key) state.sortDir = state.sortDir === "ascending" ? "descending" : "ascending";
      else { state.sortKey = key; state.sortDir = "ascending"; }
      sortRows(); render();
    };
    th.addEventListener("click", (e) => { if (e.target.closest(".resizer")) return; doSort(); });
    th.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); doSort(); } });
  });
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// Wires the columns-menu open/close button and its outside-click dismissal. Kept separate
// from buildColMenu() because the toggle button is static while the checkboxes are rebuilt.
function wireColumnsMenu() {
  const toggle = document.getElementById("coltoggle");
  const menu = document.getElementById("colmenu");
  toggle.setAttribute("aria-haspopup", "true");
  toggle.setAttribute("aria-expanded", "false");
  toggle.addEventListener("click", (e) => {
    e.stopPropagation();
    const open = menu.classList.toggle("open");
    toggle.setAttribute("aria-expanded", String(open));
  });
  document.addEventListener("click", (e) => {
    if (!menu.contains(e.target) && e.target !== toggle) {
      menu.classList.remove("open");
      toggle.setAttribute("aria-expanded", "false");
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { menu.classList.remove("open"); toggle.setAttribute("aria-expanded", "false"); }
  });
}

loadColPrefs();
loadColW();
loadColSmall();
buildColMenu();
wireColumnsMenu();
document.getElementById("exportBtn").addEventListener("click", exportCSV);

// Read ?focus=ID from the URL (set by brand page links) and scroll to + expand that row.
// Runs once after data loads; clears the param from the URL so refresh is clean.
function handleFocusParam() {
  const params = new URLSearchParams(location.search);
  const focusId = params.get("focus");
  if (!focusId) return;

  // Remove focus param from URL without reloading
  params.delete("focus");
  const newUrl = params.toString()
    ? `${location.pathname}?${params}`
    : location.pathname;
  history.replaceState(null, "", newUrl);

  // Find the row in the rendered table
  requestAnimationFrame(() => {
    const tr = document.querySelector(`tr.datarow[data-id="${focusId}"]`);
    if (!tr) return;
    tr.scrollIntoView({ behavior: "smooth", block: "center" });
    // Brief highlight then expand
    tr.style.outline = "2px solid var(--accent)";
    setTimeout(() => {
      tr.style.outline = "";
      toggleDetail(tr);
    }, 600);
  });
}

compareFromURL();
load();

function exportCSV() {
  // Export the currently filtered + sorted rows as a clean, human-readable CSV.
  // Columns are chosen for readability — internal IDs omitted.
  const cols = [
    { label: "Brand",            key: "_brand" },
    { label: "Model",            key: "model_name" },
    { label: "Full Name",        key: "full_name" },
    { label: "Year",             key: "release_year" },
    { label: "Status",           key: "status" },
    { label: "Design",           key: "design" },
    { label: "Fit",              key: "fit" },
    { label: "Driver Type",      key: "driver_type" },
    { label: "Driver Size (mm)", key: "driver_size_mm" },
    { label: "Impedance (Ω)",    key: "impedance_ohms" },
    { label: "Sensitivity (dB)", key: "sensitivity_db" },
    { label: "Wireless",         key: "wireless" },
    { label: "ANC",              key: "anc" },
    { label: "MSRP (USD)",       key: "msrp_usd" },
    { label: "Notes",            key: "notes" },
  ];

  const escCell = v => {
    const s = String(v ?? "");
    return s.includes(",") || s.includes('"') || s.includes("\n")
      ? '"' + s.replace(/"/g, '""') + '"'
      : s;
  };

  const header = cols.map(c => c.label).join(",");
  const rows = state.filtered.map(r =>
    cols.map(c => escCell(r[c.key] ?? "")).join(",")
  );

  const csv = [header, ...rows].join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `headphone-archive-${state.filtered.length}-results.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Filters popover — same open/outside-click/Escape pattern as the Columns menu below.
function wireFilterPanel() {
  const toggle = document.getElementById("filterToggle");
  const grid = document.getElementById("filtersGrid");
  toggle.addEventListener("click", (e) => {
    e.stopPropagation();
    const open = grid.classList.toggle("open");
    toggle.setAttribute("aria-expanded", String(open));
    toggle.querySelector("svg").style.opacity = open ? "1" : "0.6";
  });
  document.addEventListener("click", (e) => {
    if (!grid.contains(e.target) && e.target !== toggle && !toggle.contains(e.target)) {
      grid.classList.remove("open");
      toggle.setAttribute("aria-expanded", "false");
      toggle.querySelector("svg").style.opacity = "0.6";
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      grid.classList.remove("open");
      toggle.setAttribute("aria-expanded", "false");
      toggle.querySelector("svg").style.opacity = "0.6";
    }
  });
}
wireFilterPanel();

// Updates the small count badge on the Filters button so an active filter is still
// visible at a glance while the popover itself is collapsed.
const FILTER_FIELD_IDS = ["q","brand","design","fit","driver","status","sig","connector","detachable","imp_max","price_max"];
function updateFilterBadge() {
  const n = FILTER_FIELD_IDS.filter(id => document.getElementById(id).value !== "").length;
  const badge = document.getElementById("filterCount");
  badge.hidden = n === 0;
  badge.textContent = n;
}

// ---- Compare bar ----
function updateCompareBar() {
  const bar = document.getElementById("cmpbar");
  const slots = document.getElementById("cmpSlots");
  if (compareSet.size === 0) { bar.hidden = true; return; }
  bar.hidden = false;
  slots.innerHTML = [...compareSet].map(intId => {
    const r = state.rows.find(p => p.id == intId);
    const label = r ? `${r._brand} ${r.model_name}` : `#${intId}`;
    return `<span class="cmpbar-slot">${esc(label)}<button aria-label="Remove ${esc(label)}" data-cid="${intId}">&times;</button></span>`;
  }).join("");
  slots.querySelectorAll("button[data-cid]").forEach(b =>
    b.addEventListener("click", () => { toggleCompare(parseInt(b.getAttribute("data-cid"),10)); })
  );
}

// ---- Compare modal ----
const CMP_FIELDS = [
  { label: "Brand",        key: "_brand" },
  { label: "Full name",    key: "full_name" },
  { label: "Released",     key: "release_year" },
  { label: "Status",       key: "status" },
  { label: "Design",       key: "design" },
  { label: "Fit",          key: "fit" },
  { label: "Driver type",  key: "driver_type" },
  { label: "Driver size",  key: "driver_size_mm",  unit: " mm" },
  { label: "Impedance",    key: "impedance_ohms",  unit: " \u03A9" },
  { label: "Sensitivity",  key: "sensitivity_db",  unit: " dB" },
  { label: "Wireless",      key: "wireless" },
  { label: "ANC",           key: "anc" },
  { label: "Weight",        key: "weight_g",        unit: " g" },
  { label: "Launch price",  key: "msrp_usd" },
  { label: "Connector",     key: "connector_type" },
  { label: "Detachable",    key: "detachable_cable" },
  { label: "Sound signature",key:"sound_signature" },
  { label: "Predecessor",   key: "_pred_name" },
  { label: "Successor",     key: "_succ_name" },
  { label: "Notes",         key: "notes" },
];

function resolvedName(id) {
  if (!id) return "";
  const r = state.rows.find(p => p.product_id === id);
  return r ? `${r._brand} ${r.model_name}` : id;
}

function openCompare() {
  const selected = [...compareSet].map(id => state.rows.find(p => p.id == id)).filter(Boolean);
  if (selected.length < 2) { alert("Select at least 2 headphones to compare."); return; }

  // Augment with resolved lineage names
  selected.forEach(r => {
    r._pred_name = resolvedName(r.predecessor);
    r._succ_name = resolvedName(r.successor);
  });

  const n = selected.length;
  const colW = Math.floor((100 - 16) / n); // 16% for label col, rest split equally

  let html = `<table class="cmptable"><thead><tr><th></th>`;
  selected.forEach(r => {
    html += `<td><div class="cmp-brand">${esc(r._brand)}</div><div class="cmp-label">${esc(r.model_name)}</div></td>`;
  });
  html += `</tr></thead><tbody>`;

  CMP_FIELDS.forEach(f => {
    const vals = selected.map(r => {
      const v = r[f.key];
      return (v !== undefined && v !== null && v !== "") ? String(v) : "";
    });
    // Skip rows where all values are empty
    if (vals.every(v => !v)) return;

    // Determine if values differ (ignoring empty cells)
    const nonEmpty = vals.filter(v => v);
    const allSame = nonEmpty.length > 1 && nonEmpty.every(v => v === nonEmpty[0]);

    html += `<tr><th>${esc(f.label)}</th>`;
    vals.forEach(v => {
      if (!v) {
        html += `<td class="cmp-empty">\u2014</td>`;
      } else {
        const cls = nonEmpty.length < 2 ? "" : allSame ? " cmp-same" : " cmp-diff";
        html += `<td class="${cls}">${esc(v)}${v && f.unit ? esc(f.unit) : ""}</td>`;
      }
    });
    html += `</tr>`;
  });
  html += `</tbody></table>`;

  document.getElementById("cmpBody").innerHTML = html;

  // Shareable URL
  const shareURL = `${location.origin}${location.pathname}?compare=${[...compareSet].join(",")}`;
  const linkEl = document.getElementById("cmpShareLink");
  linkEl.href = shareURL;
  linkEl.textContent = shareURL;

  const overlay = document.getElementById("cmpOverlay");
  overlay.removeAttribute("hidden");
  document.getElementById("cmpClose").focus();
}

function closeCompare() {
  document.getElementById("cmpOverlay").setAttribute("hidden", "");
}

document.getElementById("cmpGo").addEventListener("click", openCompare);
document.getElementById("cmpClear").addEventListener("click", () => {
  compareSet.clear();
  compareToURL();
  updateCompareBar();
  document.querySelectorAll(".cmpbtn--on").forEach(b => {
    b.classList.remove("cmpbtn--on");
    b.setAttribute("aria-pressed", "false");
    b.disabled = false;
    b.title = "Add to comparison";
  });
  document.querySelectorAll(".cmpbtn:disabled").forEach(b => {
    b.disabled = false;
    b.title = "Add to comparison";
  });
});
document.getElementById("cmpClose").addEventListener("click", closeCompare);
document.getElementById("cmpOverlay").addEventListener("click", e => {
  if (e.target.id === "cmpOverlay") closeCompare();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeCompare();
});
