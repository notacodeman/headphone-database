<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Headphone Archive</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,400&family=Spline+Sans+Mono:wght@400;500;600&display=swap');

  :root {
    --ink: #1a1714;
    --paper: #f4f0e8;
    --paper-2: #eae3d6;
    --accent: #c2410c;
    --accent-2: #1e3a2f;
    --line: #d6cdbd;
    --muted: #8a8071;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: var(--paper); }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Spline Sans Mono', monospace;
    line-height: 1.5;
  }

  header {
    border-bottom: 2px solid var(--ink);
    padding: 2.5rem 2rem 1.5rem;
    max-width: 1300px;
    margin: 0 auto;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 1rem;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: clamp(2.2rem, 6vw, 4.5rem);
    line-height: 0.92;
    letter-spacing: -0.02em;
  }
  h1 em { font-style: italic; color: var(--accent); }

  .tagline {
    text-align: right;
    font-size: 0.78rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    max-width: 240px;
  }

  .stats-bar {
    max-width: 1300px;
    margin: 0 auto;
    padding: 0.75rem 2rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
    font-size: 0.8rem;
    border-bottom: 1px solid var(--line);
    color: var(--accent-2);
  }
  #statnums { display: flex; gap: 2rem; flex-wrap: wrap; align-items: center; }
  .suggest-btn {
    margin-left: auto;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--paper);
    background: var(--accent);
    padding: 0.45rem 0.95rem;
    text-decoration: none;
    border-radius: 99px;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .suggest-btn:hover { background: var(--accent-2); }
  .stats-bar strong { font-weight: 600; }

  .controls {
    max-width: 1300px;
    margin: 0 auto;
    padding: 1.5rem 2rem 0.5rem;
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr 1fr 1fr;
    gap: 0.75rem;
  }
  @media (max-width: 1100px) { .controls { grid-template-columns: 2fr 1fr 1fr 1fr; } }
  @media (max-width: 900px)  { .controls { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 520px)  { .controls { grid-template-columns: 1fr; } }

  .field label {
    display: block;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 0.3rem;
  }
  input, select {
    width: 100%;
    padding: 0.6rem 0.7rem;
    border: 1px solid var(--ink);
    background: var(--paper);
    font-family: inherit;
    font-size: 0.9rem;
    color: var(--ink);
    border-radius: 0;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  main { max-width: 1300px; margin: 0 auto; padding: 0 2rem 4rem; }

  .resultmeta {
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 1rem 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .meta-actions { display: flex; gap: 1.25rem; align-items: center; }
  .linkbtn {
    background: none; border: none; font-family: inherit; cursor: pointer;
    color: var(--accent-2); font-size: 0.75rem; text-transform: uppercase;
    letter-spacing: 0.1em; text-decoration: underline; text-underline-offset: 3px;
    padding: 0;
  }
  .linkbtn:hover { color: var(--accent); }

  /* Columns panel */
  .colpanel {
    position: relative;
    display: inline-block;
  }
  .colmenu {
    position: absolute;
    right: 0;
    top: 1.8rem;
    z-index: 20;
    background: var(--paper);
    border: 1px solid var(--ink);
    box-shadow: 4px 4px 0 rgba(26,23,20,0.12);
    padding: 0.85rem 1rem;
    min-width: 220px;
    display: none;
  }
  .colmenu.open { display: block; }
  .colmenu h4 {
    font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--muted); margin-bottom: 0.6rem; font-weight: 600;
  }
  .colmenu label {
    display: flex; align-items: center; gap: 0.55rem;
    font-size: 0.82rem; padding: 0.28rem 0; cursor: pointer;
    text-transform: none; letter-spacing: 0; color: var(--ink);
  }
  .colmenu input[type=checkbox] {
    width: auto; margin: 0; accent-color: var(--accent);
    border-radius: 0; cursor: pointer;
  }

  /* Table layout, header, resizer, cell, and sort-indicator rules live in the
     "Table (desktop)" block further down. Only the rules unique to this spot remain here. */
  thead th { position: relative; }            /* positioning context for .resizer */
  tbody tr { border-bottom: 1px solid var(--line); transition: background 0.12s; }

  .model-name { font-family: 'Fraunces', serif; font-size: 1.02rem; font-weight: 600; }
  .brand { color: var(--accent-2); font-weight: 500; }
  .year { font-variant-numeric: tabular-nums; }
  .spec { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .spec.empty { color: var(--line); }
  .notes { color: var(--muted); font-size: 0.78rem; max-width: 280px; }

  .tag {
    display: inline-block;
    font-size: 0.68rem;
    padding: 0.1rem 0.45rem;
    border: 1px solid var(--line);
    border-radius: 99px;
    white-space: nowrap;
  }
  .tag.disc { color: var(--muted); }
  .tag.active { border-color: var(--accent-2); color: var(--accent-2); }
  .flags { font-size: 0.7rem; color: var(--accent); letter-spacing: 0.05em; }

  .loading, .empty {
    text-align: center;
    padding: 4rem 1rem;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .loading::after {
    content: '';
    display: block;
    width: 28px; height: 28px;
    margin: 1rem auto 0;
    border: 2px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer {
    max-width: 1300px; margin: 0 auto; padding: 2rem;
    border-top: 1px solid var(--line);
    font-size: 0.72rem; color: var(--muted);
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 1rem;
  }
  footer a { color: var(--accent-2); }

  /* Zebra striping (subtle) */
  tbody tr.datarow.zebra { background: #ece4d4; }
  tbody tr.datarow { cursor: pointer; }
  tbody tr.datarow:hover { background: var(--paper-2); }

  /* Expand caret + detail panel */
  .caretcol { width: 2rem; text-align: center; }
  .expandbtn { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 1.1rem; line-height: 1; padding: 0.2rem 0.4rem; }
  .caret { display: inline-block; transition: transform 0.15s ease; }
  tr.datarow.expanded .caret { transform: rotate(90deg); color: var(--accent); }
  tr.detailrow > td { padding: 0; border-bottom: 1px solid var(--line); }
  tr.detailrow.zebra > td { background: #ece4d4; }
  .detailwrap { padding: 1.1rem 1.4rem; border-left: 3px solid var(--accent); }
  .detail-specs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.6rem 1.5rem; margin: 0; }
  .detail-specs dt { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
  .detail-specs dd { font-size: 0.88rem; font-variant-numeric: tabular-nums; }
  .detail-notes { margin-top: 0.9rem; font-size: 0.84rem; color: var(--ink); }
  .detail-links { margin-top: 0.9rem; font-size: 0.82rem; }
  .detail-links a { color: var(--accent-2); }

  /* Accessibility */
  .vh { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .skip-link { position: absolute; left: -999px; top: 0; background: var(--ink); color: var(--paper); padding: 0.6rem 1rem; z-index: 100; }
  .skip-link:focus { left: 0; }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible,
  th[role="button"]:focus-visible, .expandbtn:focus-visible, .cmpbtn:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  /* Compare button in each row */
  .cmpcol { width: 2rem; text-align: center; }
  .cmpbtn { background: none; border: 1px solid var(--line); color: var(--muted);
    line-height: 1; width: 22px; height: 22px; border-radius: 4px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; padding: 0; transition: all 0.1s; }
  .cmpbtn::before { content: "+"; font-size: 1rem; }
  .cmpbtn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .cmpbtn--on { background: var(--accent); border-color: var(--accent); color: var(--paper); }
  .cmpbtn--on::before { content: "+"; }
  .cmpbtn--on:hover:not(:disabled)::before { content: "\2212"; color: var(--paper-2); }
  .cmpbtn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* Compare bar */
  .cmpbar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--ink); color: var(--paper);
    display: flex; align-items: center; gap: 1rem; padding: 0.8rem 1.5rem;
    box-shadow: 0 -4px 20px rgba(26,23,20,0.3); z-index: 40;
    transform: translateY(0); transition: transform 0.2s ease; }
  .cmpbar[hidden] { display: none; }
  .cmpbar-slots { display: flex; gap: 0.6rem; flex: 1; flex-wrap: wrap; }
  .cmpbar-slot { display: flex; align-items: center; gap: 0.4rem; background: rgba(255,255,255,0.1);
    border-radius: 99px; padding: 0.25rem 0.7rem; font-size: 0.78rem; white-space: nowrap; }
  .cmpbar-slot button { background: none; border: none; color: inherit; cursor: pointer;
    font-size: 1rem; line-height: 1; padding: 0; opacity: 0.7; }
  .cmpbar-slot button:hover { opacity: 1; }
  .cmpbar-btn { background: var(--accent); color: var(--paper); border: none; cursor: pointer;
    font-family: inherit; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em;
    padding: 0.6rem 1.2rem; border-radius: 99px; white-space: nowrap; }
  .cmpbar-btn:hover { background: var(--accent-2); }
  .cmpbar-clear { color: rgba(255,255,255,0.6); font-size: 0.72rem; }
  .cmpbar-clear:hover { color: var(--paper); }

  /* Compare modal */
  #cmpOverlay { align-items: flex-start; justify-content: center; padding: 2rem 1rem; overflow-y: auto; }
  #cmpOverlay:not([hidden]) { display: flex; }
  .cmpmodal { background: var(--card); border: 1px solid var(--ink); border-radius: 12px;
    max-width: 960px; width: 100%; padding: 0; overflow: hidden; }
  .cmpmodal-head { display: flex; justify-content: space-between; align-items: center;
    padding: 1.2rem 1.5rem; border-bottom: 2px solid var(--ink); }
  .cmpmodal-head h2 { font-family: 'Fraunces', serif; font-size: 1.4rem; }
  .cmpclose { background: none; border: none; cursor: pointer; font-size: 1.5rem;
    color: var(--muted); line-height: 1; padding: 0.2rem; }
  .cmpclose:hover { color: var(--ink); }
  .cmpmodal-body { overflow-x: auto; }
  .cmpmodal-hint { font-size: 0.76rem; color: var(--muted); padding: 0.8rem 1.5rem;
    border-top: 1px solid var(--line); }
  .cmpmodal-hint a { color: var(--accent-2); word-break: break-all; }

  /* Comparison table */
  .cmptable { border-collapse: collapse; width: 100%; table-layout: fixed; }
  .cmptable th, .cmptable td { padding: 0.65rem 1rem; text-align: left;
    border-bottom: 1px solid var(--line); vertical-align: top; }
  .cmptable th { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted); width: 140px; background: var(--paper-2); }
  .cmptable td { font-size: 0.88rem; background: var(--paper); }
  .cmptable tbody tr:nth-child(even) td { background: #ece4d4; }
  .cmptable .cmp-label { font-family: 'Fraunces', serif; font-size: 1rem; font-weight: 600; }
  .cmptable .cmp-brand { font-size: 0.72rem; color: var(--muted); }
  .cmptable .cmp-diff { color: var(--accent); font-weight: 500; }
  .cmptable .cmp-same { color: var(--muted); }
  .cmptable .cmp-empty { color: var(--line); font-style: italic; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  /* ── Variables & base ────────────────────────────────── */
  :root { --pad: clamp(1rem, 3vw, 2rem); }

  h1 { font-family: 'Fraunces', serif; font-weight: 900;
    font-size: clamp(2rem, 5vw, 4.5rem); line-height: 0.92; letter-spacing: -0.02em; }
  h1 em { font-style: italic; color: var(--accent); }

  .tagline { text-align: right; font-size: 0.78rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.15em; max-width: 240px; }

  /* ── Page structure ──────────────────────────────────── */
  /* All sections share the same max-width and side padding */
  .stats-bar, .controls, main, footer {
    max-width: 1400px; margin: 0 auto;
  }
  .stats-bar {
    padding: 0.75rem var(--pad);
    display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
    font-size: 0.8rem; border-bottom: 1px solid var(--line); color: var(--accent-2);
  }
  #statnums { display: flex; gap: 1.5rem; flex-wrap: wrap; align-items: center; }
  .suggest-btn { margin-left: auto; font-size: 0.7rem; text-transform: uppercase;
    letter-spacing: 0.12em; color: var(--paper); background: var(--accent);
    padding: 0.45rem 0.95rem; text-decoration: none; border-radius: 99px;
    white-space: nowrap; transition: background 0.15s; }
  .suggest-btn:hover { background: var(--accent-2); }
  .stats-bar strong { font-weight: 600; }

  /* ── Controls / filters ──────────────────────────────── */
  .controls {
    padding: 1.2rem var(--pad) 0.5rem;
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr 1fr 1fr;
    gap: 0.6rem;
  }
  /* Filter toggle — mobile only */
  .filter-toggle { display: none; }
  @media (max-width: 1100px) { .controls { grid-template-columns: 2fr 1fr 1fr 1fr; } }
  @media (max-width: 820px)  { .controls { grid-template-columns: 1fr 1fr 1fr; } }
  @media (max-width: 600px)  {
    .filter-toggle {
      display: flex; align-items: center; gap: 0.5rem;
      margin: 0.75rem var(--pad) 0;
      background: none; border: 1px solid var(--ink); font-family: inherit;
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em;
      padding: 0.5rem 0.9rem; cursor: pointer; color: var(--ink);
      border-radius: 4px; width: fit-content;
    }
    .filter-toggle:hover { background: var(--paper-2); }
    .controls { display: none; padding: 0.75rem var(--pad) 0.5rem;
      grid-template-columns: 1fr 1fr; }
    .controls.open { display: grid; }
  }

  .field label { display: block; font-size: 0.65rem; text-transform: uppercase;
    letter-spacing: 0.12em; color: var(--muted); margin-bottom: 0.3rem; }
  input, select { width: 100%; padding: 0.6rem 0.7rem; border: 1px solid var(--ink);
    background: var(--paper); font-family: inherit; font-size: 0.9rem;
    color: var(--ink); border-radius: 0; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  @media (max-width: 600px) { input, select { font-size: 1rem; } } /* prevent iOS zoom */

  /* ── Main + table ────────────────────────────────────── */
  main { padding: 0 0 4rem; }

  .resultmeta { font-size: 0.75rem; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.1em; padding: 1rem var(--pad);
    display: flex; justify-content: space-between; align-items: center;
    gap: 1rem; flex-wrap: wrap; }
  .meta-actions { display: flex; gap: 1.25rem; align-items: center; }
  .linkbtn { background: none; border: none; font-family: inherit; cursor: pointer;
    color: var(--accent-2); font-size: 0.75rem; text-transform: uppercase;
    letter-spacing: 0.1em; text-decoration: underline; text-underline-offset: 3px; padding: 0; }
  .linkbtn:hover { color: var(--accent); }

  /* Columns panel */
  .colpanel { position: relative; display: inline-block; }
  .colmenu { position: absolute; right: 0; top: 1.8rem; z-index: 20;
    background: var(--paper); border: 1px solid var(--ink);
    box-shadow: 4px 4px 0 rgba(26,23,20,0.12); padding: 0.85rem 1rem;
    min-width: 220px; display: none; }
  .colmenu.open { display: block; }
  .colmenu h4 { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--muted); margin-bottom: 0.6rem; font-weight: 600; }
  .colmenu label { display: flex; align-items: center; gap: 0.55rem;
    font-size: 0.82rem; padding: 0.28rem 0; cursor: pointer;
    text-transform: none; letter-spacing: 0; color: var(--ink); }
  .colmenu input[type=checkbox] { width: auto; margin: 0;
    accent-color: var(--accent); border-radius: 0; cursor: pointer; }

  /* ── Table (desktop) ─────────────────────────────────── */
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  #tablewrap {
    overflow-x: hidden;
    overflow-y: auto;
    max-height: calc(100vh - 230px);
    background: var(--paper);
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }
  table.autofit { width: 100%; table-layout: fixed; }
  table.autofit th, table.autofit td { overflow: hidden; text-overflow: ellipsis; }
  thead th { position: sticky; top: 0; z-index: 10; background: var(--paper-2);
    text-align: left; font-size: 0.65rem; text-transform: uppercase;
    letter-spacing: 0.12em; color: var(--muted); padding: 0.5rem 0.6rem;
    border-bottom: 2px solid var(--ink); cursor: pointer; user-select: none; white-space: nowrap; }
  thead th:hover { color: var(--accent); }
  thead th > span:first-child { display: inline-block; max-width: calc(100% - 10px);
    overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }
  thead th[aria-sort="ascending"]::after  { content: ' \2191'; color: var(--accent); font-size: 0.7rem; }
  thead th[aria-sort="descending"]::after { content: ' \2193'; color: var(--accent); font-size: 0.7rem; }
  thead th[aria-sort="ascending"], thead th[aria-sort="descending"] { color: var(--accent); border-bottom: 3px solid var(--accent); }
  tbody tr:hover { background: var(--paper-2); }
  tbody td { padding: 0.7rem 0.6rem; font-size: 0.86rem; vertical-align: top;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  tbody tr.datarow { background: var(--paper); cursor: pointer; }
  tbody tr.datarow.zebra { background: #ece4d4; }
  tbody tr.datarow:hover, tbody tr.datarow.zebra:hover { background: #d6cebc; }

  .resizer { position: absolute; top: 0; right: 0; width: 9px; height: 100%;
    cursor: col-resize; user-select: none; }
  .resizer::before { content: ""; position: absolute; right: 3px; top: 25%;
    height: 50%; width: 1px; background: var(--line); }
  .resizer:hover::before { right: 3px; top: 0; height: 100%; width: 2px; background: var(--accent); }

  .model-name { font-family: 'Fraunces', serif; font-size: 1.02rem; font-weight: 600; }
  .brand { color: var(--accent-2); font-weight: 500; text-decoration: none; }
  .brand:hover { color: var(--accent); text-decoration: underline; }
  .year { font-variant-numeric: tabular-nums; }
  .spec { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .spec.empty { color: var(--line); }
  .notes { color: var(--muted); font-size: 0.78rem; }
  .tag { display: inline-block; font-size: 0.68rem; padding: 0.1rem 0.45rem;
    border: 1px solid var(--line); border-radius: 99px; white-space: nowrap; }
  .tag.disc { color: var(--muted); }
  .tag.active { border-color: var(--accent-2); color: var(--accent-2); }
  .flags { font-size: 0.7rem; color: var(--accent); letter-spacing: 0.05em; }

  /* ── Mobile card layout ──────────────────────────────── */
  @media (max-width: 600px) {
    /* Unlock the table for card transformation */
    #tablewrap { overflow-x: hidden; max-height: none; border: none; }
    table, tbody { display: block; }
    thead { display: none; }

    /* Each row becomes a card */
    tr.datarow {
      display: grid;
      grid-template-columns: 1fr auto auto;
      grid-template-areas: "brand cmp caret" "model cmp caret" "meta  cmp caret";
      gap: 0 0.4rem;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      margin: 0.5rem var(--pad);
      padding: 0.75rem;
      background: var(--paper);
      cursor: pointer;
    }
    tr.datarow.zebra { background: #ece4d4; }
    tr.datarow:hover { background: var(--paper-2); }

    /* Hide all cells by default; show only the ones we name */
    tr.datarow td { display: none; padding: 0; border: none;
      white-space: normal; overflow: visible; text-overflow: unset; }

    td[data-key="_brand"]    { display: block; grid-area: brand;
      font-size: 0.68rem; color: var(--muted); margin-bottom: 0.1rem; }
    td[data-key="model_name"]{ display: block; grid-area: model;
      font-size: 0.95rem; font-family: 'Fraunces', serif; font-weight: 600;
      line-height: 1.2; padding: 0.05rem 0; }
    /* Meta row: year + design chips */
    td[data-key="release_year"]{ display: inline; grid-area: meta;
      font-size: 0.72rem; color: var(--muted); }
    td[data-key="design"]    { display: inline; grid-area: meta;
      font-size: 0.72rem; color: var(--muted); }
    td[data-key="design"]::before { content: " · "; }
    td[data-key="status"]    { display: none; } /* shown in expand panel */
    td.cmpcol  { display: flex; grid-area: cmp;  align-items: center;
      justify-content: center; width: 28px; }
    td.caretcol{ display: flex; grid-area: caret; align-items: center;
      justify-content: center; width: 28px; }

    /* Detail row in card view */
    tr.detailrow { display: block; }
    tr.detailrow > td { display: block; padding: 0; border: none;
      margin: -0.5rem var(--pad) 0.5rem; border-left: 3px solid var(--accent);
      background: var(--paper); border-radius: 0 0 8px 8px; }
    tr.detailrow.zebra > td { background: #ece4d4; }
    .detailwrap { padding: 0.9rem 1rem; border-left: none; }

    /* Simplify compare modal on mobile */
    .cmpmodal { border-radius: 0; max-height: 100vh; overflow-y: auto; }
    #cmpOverlay { padding: 0; align-items: flex-end; }
    .cmptable th { width: 90px; font-size: 0.55rem; }
    .cmptable td { font-size: 0.8rem; }

    /* Compare bar */
    .cmpbar { flex-wrap: wrap; gap: 0.5rem; padding: 0.75rem 1rem; }
    .cmpbar-slots { width: 100%; }
    .cmpbar-slot { font-size: 0.7rem; }
  }

  /* ── Expand / detail panel ───────────────────────────── */
  .caretcol { width: 2rem; text-align: center; }
  .expandbtn { background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 1.1rem; line-height: 1; padding: 0.2rem 0.4rem; }
  .caret { display: inline-block; transition: transform 0.15s ease; }
  tr.datarow.expanded .caret { transform: rotate(90deg); color: var(--accent); }
  tr.detailrow > td { padding: 0; border-bottom: 1px solid var(--line); }
  tr.detailrow.zebra > td { background: #ece4d4; }
  .detailwrap { padding: 1.1rem 1.4rem; border-left: 3px solid var(--accent); }
  .detail-specs { display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 0.6rem 1.5rem; margin: 0; }
  .detail-specs dt { font-size: 0.6rem; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--muted); }
  .detail-specs dd { font-size: 0.88rem; font-variant-numeric: tabular-nums;
    word-break: break-word; overflow-wrap: break-word; white-space: normal; }
  .detail-notes { margin-top: 0.9rem; font-size: 0.84rem; color: var(--ink);
    background: var(--paper-2); border-left: 3px solid var(--accent);
    padding: 0.5rem 0.75rem; border-radius: 0 4px 4px 0; }
  .detail-links { margin-top: 0.9rem; font-size: 0.82rem; }
  .detail-links a { color: var(--accent-2); }

  /* ── Misc ────────────────────────────────────────────── */
  .loading, .empty { text-align: center; padding: 4rem 1rem;
    color: var(--muted); font-size: 0.9rem; }
  .loading::after { content: ''; display: block; width: 28px; height: 28px;
    margin: 1rem auto 0; border: 2px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer { padding: 2rem var(--pad); border-top: 1px solid var(--line);
    font-size: 0.72rem; color: var(--muted);
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
  footer a { color: var(--accent-2); }

  /* ── Accessibility ───────────────────────────────────── */
  .vh { position: absolute; width: 1px; height: 1px; padding: 0;
    margin: -1px; overflow: hidden; clip: rect(0 0 0 0);
    white-space: nowrap; border: 0; }
  .skip-link { position: absolute; left: -999px; top: 0;
    background: var(--ink); color: var(--paper); padding: 0.6rem 1rem; z-index: 100; }
  .skip-link:focus { left: 0; }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible,
  th[role="button"]:focus-visible, .expandbtn:focus-visible, .cmpbtn:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ── Compare button ──────────────────────────────────── */
  .cmpcol { width: 2rem; text-align: center; }
  .cmpbtn { background: none; border: 1px solid var(--line); color: var(--muted);
    font-size: 1rem; line-height: 1; width: 22px; height: 22px; border-radius: 4px;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    padding: 0; transition: all 0.1s; }
  .cmpbtn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .cmpbtn--on { background: var(--accent); border-color: var(--accent); color: var(--paper); }
  .cmpbtn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* ── Compare bar ─────────────────────────────────────── */
  .cmpbar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--ink);
    color: var(--paper); display: flex; align-items: center; gap: 1rem;
    padding: 0.8rem 1.5rem; box-shadow: 0 -4px 20px rgba(26,23,20,0.3); z-index: 40; }
  .cmpbar[hidden] { display: none; }
  .cmpbar-slots { display: flex; gap: 0.6rem; flex: 1; flex-wrap: wrap; }
  .cmpbar-slot { display: flex; align-items: center; gap: 0.4rem;
    background: rgba(255,255,255,0.1); border-radius: 99px;
    padding: 0.25rem 0.7rem; font-size: 0.78rem; white-space: nowrap; }
  .cmpbar-slot button { background: none; border: none; color: inherit;
    cursor: pointer; font-size: 1rem; line-height: 1; padding: 0; opacity: 0.7; }
  .cmpbar-slot button:hover { opacity: 1; }
  .cmpbar-btn { background: var(--accent); color: var(--paper); border: none;
    cursor: pointer; font-family: inherit; font-size: 0.72rem;
    text-transform: uppercase; letter-spacing: 0.1em; padding: 0.6rem 1.2rem;
    border-radius: 99px; white-space: nowrap; }
  .cmpbar-btn:hover { background: var(--accent-2); }
  .cmpbar-clear { color: rgba(255,255,255,0.6); font-size: 0.72rem; }
  .cmpbar-clear:hover { color: var(--paper); }

  /* ── Compare modal ───────────────────────────────────── */
  #cmpOverlay { align-items: flex-start; justify-content: center;
    padding: 2rem 1rem; overflow-y: auto; }
  #cmpOverlay:not([hidden]) { display: flex; }
  .cmpmodal { background: var(--card); border: 1px solid var(--ink); border-radius: 12px;
    max-width: 960px; width: 100%; padding: 0; overflow: hidden; }
  .cmpmodal-head { display: flex; justify-content: space-between; align-items: center;
    padding: 1.2rem 1.5rem; border-bottom: 2px solid var(--ink); }
  .cmpmodal-head h2 { font-family: 'Fraunces', serif; font-size: 1.4rem; }
  .cmpclose { background: none; border: none; cursor: pointer; font-size: 1.5rem;
    color: var(--muted); line-height: 1; padding: 0.2rem; }
  .cmpclose:hover { color: var(--ink); }
  .cmpmodal-body { overflow-x: auto; }
  .cmpmodal-hint { font-size: 0.76rem; color: var(--muted); padding: 0.8rem 1.5rem;
    border-top: 1px solid var(--line); }
  .cmpmodal-hint a { color: var(--accent-2); word-break: break-all; }
  .cmptable { border-collapse: collapse; width: 100%; table-layout: fixed; }
  .cmptable th, .cmptable td { padding: 0.65rem 1rem; text-align: left;
    border-bottom: 1px solid var(--line); vertical-align: top; }
  .cmptable th { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted); width: 140px; background: var(--paper-2); }
  .cmptable td { font-size: 0.88rem; background: var(--paper); }
  .cmptable tbody tr:nth-child(even) td { background: #ece4d4; }
  .cmptable .cmp-label { font-family: 'Fraunces', serif; font-size: 1rem; font-weight: 600; }
  .cmptable .cmp-brand { font-size: 0.72rem; color: var(--muted); }
  .cmptable .cmp-diff { color: var(--accent); font-weight: 500; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>

<body>

  Filters

  <div class="field">

<main id="main">
  <div class="resultmeta">
    <span id="count" aria-live="polite"></span>
    <span class="meta-actions">
      <span class="colpanel">
        <button class="linkbtn" id="coltoggle">Columns &#9662;</button>
        <div class="colmenu" id="colmenu">
          <h4>Show columns</h4>

  </div>
</main>

<!-- Compare bar — slides up when headphones are selected -->
<div class="cmpbar" id="cmpbar" hidden aria-live="polite">

      <button class="cmpclose" id="cmpClose" aria-label="Close comparison">&times;</button>
    </div>

    <p class="cmpmodal-hint">Share this comparison: <a id="cmpShareLink" href="#"></a></p>
  </div>

<footer>
  <span>Data: community-maintained CSV catalog</span>

<script>
// ---- Config & data source ----
// RAW_BASE points at the GitHub raw CSVs, which are the fallback data source. The
// site normally reads the live D1 catalog API and only drops to these CSVs if that fails.
const RAW_BASE = "https://raw.githubusercontent.com/notacodeman/headphone-database/main/database";

// Column definitions. `on` is the default visibility.
const COLS = [
  { key: "_brand",         label: "Brand",       on: true,  sortable: true,  w: 130 },
  { key: "model_name",     label: "Model",       on: true,  sortable: true,  w: 180 },
  { key: "release_year",   label: "Year",        on: true,  sortable: true,  w: 80 },
  { key: "design",         label: "Design",      on: true,  sortable: true,  w: 120 },
  { key: "fit",            label: "Fit",         on: true,  sortable: true,  w: 100 },
  { key: "driver_type",    label: "Driver",      on: true,  sortable: true,  w: 130 },
  { key: "driver_size_mm", label: "Driver Size", on: true,  sortable: true,  w: 120 },
  { key: "impedance_ohms", label: "Impedance",   on: true,  sortable: true,  w: 90 },
  { key: "sensitivity_db", label: "Sensitivity", on: false, sortable: true,  w: 130 },
  { key: "status",         label: "Status",      on: true,  sortable: true,  w: 130 },
  { key: "_flags",         label: "Wireless/ANC",on: true,  sortable: false, w: 120 }
];

// ---- Application state ----
// Single source of truth for the table: all rows, the filtered subset, current sort,
// and per-column visibility. render() reads only from here, never from the DOM.
const state = { rows: [], filtered: [], sortKey: "release_year", sortDir: "descending", visible: {} };

// ---- Compare state ----
// compareSet holds integer IDs (up to 3). URL: ?compare=1,42,187
const compareSet = new Set();
const COMPARE_MAX = 3;

function compareFromURL() {
  const params = new URLSearchParams(location.search);
  const ids = (params.get("compare") || "").split(",").map(s => parseInt(s, 10)).filter(n => n > 0);
  compareSet.clear();
  ids.slice(0, COMPARE_MAX).forEach(id => compareSet.add(id));
}

function compareToURL() {
  const params = new URLSearchParams(location.search);
  if (compareSet.size > 0) {
    params.set("compare", [...compareSet].join(","));
  } else {
    params.delete("compare");
  }
  const newURL = params.toString() ? `${location.pathname}?${params}` : location.pathname;
  history.replaceState(null, "", newURL);
}

function toggleCompare(intId) {
  if (compareSet.has(intId)) {
    compareSet.delete(intId);
  } else {
    if (compareSet.size >= COMPARE_MAX) return; // max reached
    compareSet.add(intId);
  }
  compareToURL();
  updateCompareBar();
  // Update just the affected row's button without full re-render
  document.querySelectorAll(`tr.datarow[data-id="${intId}"]`).forEach(tr => {
    const btn = tr.querySelector(".cmpbtn");
    if (btn) syncCompareBtnState(btn, intId);
  });
}

function syncCompareBtnState(btn, intId) {
  const selected = compareSet.has(intId);
  const full = !selected && compareSet.size >= COMPARE_MAX;
  btn.classList.toggle("cmpbtn--on", selected);
  btn.setAttribute("aria-pressed", String(selected));
  btn.setAttribute("title", selected ? "Remove from comparison" : (full ? "Maximum 3 selected" : "Add to comparison"));
  btn.disabled = full;
}

// Load saved column prefs (works on the live site; falls back to defaults if unavailable)
function loadColPrefs() {
  COLS.forEach(c => state.visible[c.key] = c.on);
  try {
    const saved = JSON.parse(localStorage.getItem("archive_cols") || "null");
    if (saved) COLS.forEach(c => { if (c.key in saved) state.visible[c.key] = !!saved[c.key]; });
  } catch (e) {}
}
function saveColPrefs() {
  try { localStorage.setItem("archive_cols", JSON.stringify(state.visible)); } catch (e) {}
}

const CARET_W = 44;
const COMPARE_COL_W = 44;
// Column widths are now proportional *weights*, not absolute pixels. The data
// columns split 100% of the available width by weight, so the table always
// fills the container exactly and never overflows. Dragging a divider moves
// weight from that column to its right neighbor, keeping the total constant.
const colW = {};
function loadColW(){ COLS.forEach(c=>colW[c.key]=c.w); try{ const s=JSON.parse(localStorage.getItem("archive_colw")||"null"); if(s) COLS.forEach(c=>{ if(typeof s[c.key]==="number") colW[c.key]=s[c.key]; });}catch(e){} }
function saveColW(){ try{ localStorage.setItem("archive_colw",JSON.stringify(colW)); }catch(e){} }
// Sum of weights for currently-visible data columns.
function visibleWeight(){ return COLS.filter(c=>state.visible[c.key]).reduce((s,c)=>s+colW[c.key],0); }
// Percentage width for one column = its share of the visible weight.
function colPct(key){ const t=visibleWeight(); return t>0 ? (colW[key]/t*100) : 0; }

let resizing = null;
document.addEventListener("mousemove", e => {
  if (!resizing) return;
  const tbl = document.querySelector("#tablewrap table");
  if (!tbl) return;
  // Translate the pixel drag into a change in this column's weight, measured
  // against the table's pixel width so a 100px drag feels like 100px on screen.
  const dataCols = COLS.filter(c=>state.visible[c.key]);
  const others = dataCols.filter(c=>c.key!==resizing.key);
  if (!others.length) return;                  // only one column visible; nothing to trade against
  const pxPerWeight = tbl.clientWidth / resizing.startTotal;
  let deltaW = (e.clientX - resizing.startX) / pxPerWeight;
  // Clamp: the dragged column can't shrink below MINW, and can't grow so far
  // that the remaining columns would each be pushed below MINW.
  const MINW = 30;
  const minOthersTotal = others.length * MINW;
  const maxGrow = resizing.startOthersTotal - minOthersTotal;
  deltaW = Math.max(-(resizing.startW - MINW), Math.min(maxGrow, deltaW));
  // Grow/shrink the dragged column, then scale every OTHER column proportionally
  // to absorb the opposite change. The grand total stays constant, so all columns
  // visibly reflow together and the table always fills the container.
  colW[resizing.key] = resizing.startW + deltaW;
  const scale = (resizing.startOthersTotal - deltaW) / resizing.startOthersTotal;
  others.forEach(c => { colW[c.key] = resizing.startOtherW[c.key] * scale; });
  // Re-apply percentage widths to every visible column so the whole row reflows,
  // not just the two columns nearest the divider.
  dataCols.forEach(c => {
    const th = tbl.querySelector(`th[data-key="${c.key}"]`);
    if (th) th.style.width = colPct(c.key) + "%";
  });
});
document.addEventListener("mouseup", () => { if (resizing){ resizing=null; document.body.style.userSelect=""; saveColW(); } });
function startResize(e){
  const key = e.target.getAttribute("data-key");
  const dataCols = COLS.filter(c=>state.visible[c.key]);
  const others = dataCols.filter(c=>c.key!==key);
  if (!others.length) { e.preventDefault(); e.stopPropagation(); return; }
  // Snapshot every starting weight so the whole drag is computed from the state
  // at mousedown; this avoids cumulative drift from reading values mid-drag.
  const startOtherW = {}; others.forEach(c=>startOtherW[c.key]=colW[c.key]);
  const startOthersTotal = others.reduce((s,c)=>s+colW[c.key],0);
  resizing = { key, startX:e.clientX, startW:colW[key],
               startTotal:visibleWeight(), startOthersTotal, startOtherW };
  document.body.style.userSelect = "none";
  e.preventDefault(); e.stopPropagation();
}

// ---- CSV fallback parser ----
// Quote-aware CSV parser used only on the fallback path. It mirrors the server's parser
// so the site renders identically whether data came from the API or the raw CSVs.
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i+1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === '\r') { /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  const header = rows.shift();
  return rows.filter(r => r.length > 1).map(r => {
    const o = {}; header.forEach((h, i) => o[h.trim()] = (r[i] || "").trim()); return o;
  });
}

// ---- Data loading ----
// Primary load path: fetch the live D1 catalog. On any failure (network, empty, or a
// server error) it delegates to loadFromCSV() so the archive still renders something.
async function load() {
  // Prefer the live D1 catalog; fall back to the GitHub CSVs so the site never breaks.
  try {
    const res = await fetch("/api/catalog");
    if (res.ok) {
      const data = await res.json();
      if (data.ok && data.products && data.products.length) {
        state.rows = data.products.map(p => ({ ...p, _brand: p._brand || "Unknown" }));
        initFilters();
        buildColMenu();
        apply();
        updateCompareBar();
        document.getElementById("source").innerHTML =
          'Source: <a href="https://github.com/notacodeman/headphone-database">github.com/notacodeman/headphone-database</a>';
        return;
      }
    }
    throw new Error("api empty");
  } catch (e) {
    await loadFromCSV();
  }
}

// Fallback loader: fetch both CSVs from GitHub, join brand names client-side, and
// populate state. If even this fails it shows an inline "catalog unavailable" message.
async function loadFromCSV() {
  try {
    const [pRes, mRes] = await Promise.all([
      fetch(RAW_BASE + "/products.csv"),
      fetch(RAW_BASE + "/manufacturers.csv")
    ]);
    if (!pRes.ok || !mRes.ok) throw new Error("fetch failed");
    const products = parseCSV(await pRes.text());
    const mfrs = parseCSV(await mRes.text());
    const mfrName = {};
    mfrs.forEach(m => mfrName[m.manufacturer_id] = m.name);
    products.forEach(p => p._brand = mfrName[p.manufacturer_id] || "Unknown");
    state.rows = products;
    initFilters();
    buildColMenu();
    apply();
    updateCompareBar();
    document.getElementById("source").innerHTML =
      'Source: <a href="https://github.com/notacodeman/headphone-database">github.com/notacodeman/headphone-database</a>';
  } catch (e) {
    document.getElementById("tablewrap").innerHTML =
      '<div class="empty">Could not load the catalog. If you just updated the repo, give it a moment and refresh.</div>';
    document.getElementById("statnums").innerHTML = '<span>Catalog unavailable</span>';
  }
}

// Fixed valid values — must match _generate_data.py VALID_* constants exactly.
// Hardcoding these means a data typo can never silently create a new filter option.
const FILTER_DESIGN  = ["Closed Back", "Open Back", "Semi-Open"];
const FILTER_DRIVER  = ["AMT", "Dynamic", "Electrostatic", "Hybrid", "Planar Magnetic", "Ribbon"];
const FILTER_STATUS  = ["Active", "Discontinued", "Legacy Active"];
const FILTER_FIT     = ["On-Ear", "Over-Ear"];

function uniqueSorted(key) {
  return [...new Set(state.rows.map(r => r[key]).filter(Boolean))].sort();
}

// ---- Filters ----
// Populates the filter dropdowns and the header stat counts, then wires every filter
// control to re-run apply() on change. Called once after data loads (and on CSV refallback).
function initFilters() {
  const fill = (id, vals) => {
    const sel = document.getElementById(id);
    // Remove any options added on a previous call (re-initialisation on CSV fallback)
    while (sel.options.length > 1) sel.remove(1);
    vals.forEach(v => { const o = document.createElement("option"); o.value = v; o.textContent = v; sel.appendChild(o); });
  };
  // Brand: dynamic (94+ brands — hardcoding would be unmaintainable)
  fill("brand", uniqueSorted("_brand"));
  // Design / driver / status: fixed sets — never drift with data
  fill("design", FILTER_DESIGN);
  fill("fit",    FILTER_FIT);
  fill("driver", FILTER_DRIVER);
  fill("status", FILTER_STATUS);

  const brands = uniqueSorted("_brand").length;
  const years = state.rows.map(r => +r.release_year).filter(Boolean);
  document.getElementById("statnums").innerHTML =
    `<span><strong>${state.rows.length}</strong> headphones</span>` +
    `<span><strong>${brands}</strong> brands</span>` +
    `<span><strong>${Math.min(...years)}</strong>&ndash;<strong>${Math.max(...years)}</strong></span>`;

  ["q","brand","design","fit","driver","status"].forEach(id =>
    document.getElementById(id).addEventListener("input", apply));
  document.getElementById("reset").addEventListener("click", () => {
    ["q","brand","design","fit","driver","status"].forEach(id => document.getElementById(id).value = "");
    apply();
  });
}

// Builds the show/hide-columns checkbox menu from COLS, reflecting current visibility
// and persisting any toggle to localStorage before re-rendering the table.
function buildColMenu() {
  const wrap = document.getElementById("colboxes");
  wrap.innerHTML = "";
  COLS.forEach(c => {
    const id = "col_" + c.key;
    const lab = document.createElement("label");
    lab.innerHTML = `<input type="checkbox" id="${id}" ${state.visible[c.key] ? "checked" : ""}> ${c.label}`;
    wrap.appendChild(lab);
    lab.querySelector("input").addEventListener("change", (e) => {
      state.visible[c.key] = e.target.checked;
      saveColPrefs();
      render();
    });
  });
}

// ---- Filter + sort pipeline ----
// Reads every filter control, narrows state.rows into state.filtered, then sorts and
// renders. This is the single entry point re-run whenever any filter or search changes.
function apply() {
  const q  = document.getElementById("q").value.toLowerCase();
  const b  = document.getElementById("brand").value;
  const d  = document.getElementById("design").value;
  const ft = document.getElementById("fit").value;
  const dr = document.getElementById("driver").value;
  const s  = document.getElementById("status").value;

  state.filtered = state.rows.filter(r => {
    if (b  && r._brand      !== b)  return false;
    if (d  && r.design      !== d)  return false;
    if (ft && r.fit         !== ft) return false;
    if (dr && r.driver_type !== dr) return false;
    if (s  && r.status      !== s)  return false;
    if (q) {
      const hay = [r.full_name, r._brand, r.notes, r.model_name].map(x => x || "").join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  sortRows();
  render();
}

// Sorts state.filtered in place by the active column. Numeric spec columns are compared
// as numbers (blank treated as 0); everything else is compared case-insensitively as text.
function sortRows() {
  const k = state.sortKey, dir = state.sortDir === "ascending" ? 1 : -1;
  const numeric = ["release_year","driver_size_mm","impedance_ohms","sensitivity_db"];
  state.filtered.sort((a, b) => {
    let va = a[k], vb = b[k];
    if (numeric.includes(k)) {
      va = parseFloat(va) || 0; vb = parseFloat(vb) || 0;
    } else { va = (va||"").toLowerCase(); vb = (vb||"").toLowerCase(); }
    return va < vb ? -dir : va > vb ? dir : 0;
  });
}

// ---- Cell rendering ----
// Returns the inner HTML for one table cell, with per-column formatting (brand links,
// status tags, spec units, wireless/ANC flags). All user-visible strings pass through esc().
function cellValue(r, key) {
  if (key === "_brand") return `<a class="brand" href="brand.html?id=${esc(r.manufacturer_id)}">${esc(r._brand)}</a>`;
  if (key === "model_name") return `<span class="model-name">${esc(r.model_name)}</span>`;
  if (key === "release_year") return `<span class="year">${esc(r.release_year)}${r.discontinued_year ? "&ndash;" + esc(r.discontinued_year) : ""}</span>`;
  if (key === "status") {
    const cls = /disc/i.test(r.status) ? "disc" : "active";
    return `<span class="tag ${cls}">${esc(r.status)}</span>`;
  }
  if (key === "driver_size_mm") return specCell(r.driver_size_mm, "mm");
  if (key === "impedance_ohms") return specCell(r.impedance_ohms, "\u03A9");
  if (key === "sensitivity_db") return specCell(r.sensitivity_db, "dB");
  if (key === "_flags") {
    const f = [];
    if (r.wireless === "Yes") f.push("WL");
    if (r.anc === "Yes") f.push("ANC");
    return `<span class="flags">${f.join(" \u00b7 ") || "&mdash;"}</span>`;
  }
  if (key === "notes") return `<span class="notes">${esc(r.notes)}</span>`;
  return esc(r[key]);
}

function specCell(val, unit) {
  if (!val) return '<span class="spec empty">&mdash;</span>';
  return `<span class="spec">${esc(val)}\u200a${unit}</span>`;
}

function modelById(id) {
  const r = state.rows.find(x => x.product_id === id);
  return r ? `${r._brand} ${r.model_name}` : id;
}

// Builds the expandable detail panel shown when a row is clicked, listing every spec
// as a definition list plus predecessor/successor links and a review-search shortcut.
function rowDetail(r) {
  const parts = [];
  const add = (label, val, unit = "") => { if (val) parts.push(`<div><dt>${esc(label)}</dt><dd>${esc(val)}${unit}</dd></div>`); };
  add("Full name", r.full_name);
  add("Released", r.release_year);
  add("Discontinued", r.discontinued_year);
  add("Status", r.status);
  add("Category", r.category);
  add("Design", r.design);
  add("Fit", r.fit || "Over-Ear");
  add("Driver type", r.driver_type);
  add("Driver size", r.driver_size_mm, "\u200amm");
  add("Impedance", r.impedance_ohms, "\u200a\u03A9");
  add("Sensitivity", r.sensitivity_db, "\u200adB");
  add("Wireless", r.wireless);
  add("Active noise cancelling", r.anc);
  if (r.predecessor) parts.push(`<div><dt>Replaces</dt><dd>${esc(modelById(r.predecessor))}</dd></div>`);
  if (r.successor) parts.push(`<div><dt>Succeeded by</dt><dd>${esc(modelById(r.successor))}</dd></div>`);
  const q = encodeURIComponent(`${r._brand} ${r.model_name} headphone review measurements`);
  return `
    <dl class="detail-specs">${parts.join("")}</dl>
    ${r.notes ? `<p class="detail-notes">${esc(r.notes)}</p>` : ""}
    <p class="detail-links"><a href="https://duckduckgo.com/?q=${q}" target="_blank" rel="noopener">Find reviews &amp; measurements &rarr;</a></p>
  `;
}

function toggleDetail(tr) {
  const detail = tr.nextElementSibling;
  if (!detail || !detail.classList.contains("detailrow")) return;
  const opening = detail.hasAttribute("hidden");
  if (opening) detail.removeAttribute("hidden"); else detail.setAttribute("hidden", "");
  tr.classList.toggle("expanded", opening);
  const btn = tr.querySelector(".expandbtn");
  if (btn) btn.setAttribute("aria-expanded", String(opening));
}

// ---- Table render ----
// Rebuilds the entire table from state: header cells with sort + resizer handles, data
// rows, the compare button, and the expand caret. Pure and idempotent — safe to call anytime.
function render() {
  document.getElementById("count").textContent =
    `${state.filtered.length} result${state.filtered.length === 1 ? "" : "s"}`;
  if (!state.filtered.length) {
    document.getElementById("tablewrap").innerHTML = '<div class="empty">No headphones match those filters.</div>';
    return;
  }
  const cols = COLS.filter(c => state.visible[c.key]);
  let html = `<table class="autofit"><thead><tr>`;
  cols.forEach(c => {
    const sortAttr = c.sortable ? (state.sortKey === c.key ? ` aria-sort="${state.sortDir}"` : ' aria-sort="none"') : "";
    const last = c.key === cols[cols.length-1].key;
    // Last data column gets no resizer (nothing to its right to borrow from).
    const rz = last ? "" : `<span class="resizer" data-key="${c.key}"></span>`;
    html += `<th scope="col" data-key="${c.key}" style="width:${colPct(c.key)}%"${sortAttr}><span>${c.label}</span>${rz}</th>`;
  });
  html += `<th scope="col" class="cmpcol" style="width:${COMPARE_COL_W}px"><span class="vh">Compare</span></th>`;
  html += `<th scope="col" class="caretcol" style="width:${CARET_W}px"><span class="vh">Details</span></th>`;
  html += "</tr></thead><tbody>";
  state.filtered.forEach((r, i) => {
    const z = i % 2 ? " zebra" : "";
    const label = `${r._brand} ${r.model_name}`;
    const intId = r.id ? parseInt(r.id, 10) : 0;
    const selected = compareSet.has(intId);
    const full = !selected && compareSet.size >= COMPARE_MAX;
    html += `<tr class="datarow${z}" data-id="${intId}">` +
      cols.map(c => `<td data-key="${c.key}">${cellValue(r, c.key)}</td>`).join("") +
      `<td class="cmpcol"><button class="cmpbtn${selected?" cmpbtn--on":""}" data-cid="${intId}" aria-pressed="${selected}" ${full?"disabled":""} title="${selected?"Remove from comparison":(full?"Maximum 3 selected":"Add to comparison")}"></button></td>` +
      `<td class="caretcol"><button class="expandbtn" aria-expanded="false" aria-label="Show details for ${esc(label)}"><span class="caret" aria-hidden="true">\u203A</span></button></td>` +
      `</tr>`;
    html += `<tr class="detailrow${z}" hidden><td colspan="${cols.length + 2}"><div class="detailwrap">${rowDetail(r)}</div></td></tr>`;
  });
  html += "</tbody></table>";
  document.getElementById("tablewrap").innerHTML = html;

  document.querySelectorAll("tr.datarow").forEach(tr => {
    tr.addEventListener("click", (e) => {
      if (e.target.closest("a") || e.target.closest(".cmpbtn")) return;
      toggleDetail(tr);
    });
  });

  document.querySelectorAll(".cmpbtn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const intId = parseInt(btn.getAttribute("data-cid"), 10);
      if (intId) toggleCompare(intId);
    });
  });

  document.querySelectorAll(".resizer").forEach(rz => {
    rz.addEventListener("mousedown", startResize);
    rz.addEventListener("click", e => e.stopPropagation());
  });

  document.querySelectorAll("th[data-key]").forEach(th => {
    const key = th.getAttribute("data-key");
    const col = COLS.find(c => c.key === key);
    if (!col || !col.sortable) return;
    th.setAttribute("tabindex", "0");
    th.setAttribute("role", "button");
    const doSort = () => {
      if (state.sortKey === key) state.sortDir = state.sortDir === "ascending" ? "descending" : "ascending";
      else { state.sortKey = key; state.sortDir = "ascending"; }
      sortRows(); render();
    };
    th.addEventListener("click", (e) => { if (e.target.closest(".resizer")) return; doSort(); });
    th.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); doSort(); } });
  });
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// Wires the columns-menu open/close button and its outside-click dismissal. Kept separate
// from buildColMenu() because the toggle button is static while the checkboxes are rebuilt.
function wireColumnsMenu() {
  const toggle = document.getElementById("coltoggle");
  const menu = document.getElementById("colmenu");
  toggle.setAttribute("aria-haspopup", "true");
  toggle.setAttribute("aria-expanded", "false");
  toggle.addEventListener("click", (e) => {
    e.stopPropagation();
    const open = menu.classList.toggle("open");
    toggle.setAttribute("aria-expanded", String(open));
  });
  document.addEventListener("click", (e) => {
    if (!menu.contains(e.target) && e.target !== toggle) {
      menu.classList.remove("open");
      toggle.setAttribute("aria-expanded", "false");
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { menu.classList.remove("open"); toggle.setAttribute("aria-expanded", "false"); }
  });
}

loadColPrefs();
loadColW();
buildColMenu();
wireColumnsMenu();
compareFromURL();
load();

// Mobile filter toggle
document.getElementById("filterToggle").addEventListener("click", function() {
  const grid = document.getElementById("filtersGrid");
  const open = grid.classList.toggle("open");
  this.setAttribute("aria-expanded", String(open));
  this.querySelector("svg").style.opacity = open ? "1" : "0.6";
});

// ---- Compare bar ----
function updateCompareBar() {
  const bar = document.getElementById("cmpbar");
  const slots = document.getElementById("cmpSlots");
  if (compareSet.size === 0) { bar.hidden = true; return; }
  bar.hidden = false;
  slots.innerHTML = [...compareSet].map(intId => {
    const r = state.rows.find(p => p.id == intId);
    const label = r ? `${r._brand} ${r.model_name}` : `#${intId}`;
    return `<span class="cmpbar-slot">${esc(label)}<button aria-label="Remove ${esc(label)}" data-cid="${intId}">&times;</button></span>`;
  }).join("");
  slots.querySelectorAll("button[data-cid]").forEach(b =>
    b.addEventListener("click", () => { toggleCompare(parseInt(b.getAttribute("data-cid"),10)); })
  );
}

// ---- Compare modal ----
const CMP_FIELDS = [
  { label: "Brand",        key: "_brand" },
  { label: "Full name",    key: "full_name" },
  { label: "Released",     key: "release_year" },
  { label: "Status",       key: "status" },
  { label: "Design",       key: "design" },
  { label: "Fit",          key: "fit" },
  { label: "Driver type",  key: "driver_type" },
  { label: "Driver size",  key: "driver_size_mm",  unit: " mm" },
  { label: "Impedance",    key: "impedance_ohms",  unit: " \u03A9" },
  { label: "Sensitivity",  key: "sensitivity_db",  unit: " dB" },
  { label: "Wireless",     key: "wireless" },
  { label: "ANC",          key: "anc" },
  { label: "Predecessor",  key: "_pred_name" },
  { label: "Successor",    key: "_succ_name" },
  { label: "Notes",        key: "notes" },
];

function resolvedName(id) {
  if (!id) return "";
  const r = state.rows.find(p => p.product_id === id);
  return r ? `${r._brand} ${r.model_name}` : id;
}

function openCompare() {
  const selected = [...compareSet].map(id => state.rows.find(p => p.id == id)).filter(Boolean);
  if (selected.length < 2) { alert("Select at least 2 headphones to compare."); return; }

  // Augment with resolved lineage names
  selected.forEach(r => {
    r._pred_name = resolvedName(r.predecessor);
    r._succ_name = resolvedName(r.successor);
  });

  const n = selected.length;
  const colW = Math.floor((100 - 16) / n); // 16% for label col, rest split equally

  let html = `<table class="cmptable"><thead><tr><th></th>`;
  selected.forEach(r => {
    html += `<td><div class="cmp-brand">${esc(r._brand)}</div><div class="cmp-label">${esc(r.model_name)}</div></td>`;
  });
  html += `</tr></thead><tbody>`;

  CMP_FIELDS.forEach(f => {
    const vals = selected.map(r => {
      const v = r[f.key];
      return (v !== undefined && v !== null && v !== "") ? String(v) : "";
    });
    // Skip rows where all values are empty
    if (vals.every(v => !v)) return;

    // Determine if values differ (ignoring empty cells)
    const nonEmpty = vals.filter(v => v);
    const allSame = nonEmpty.length > 1 && nonEmpty.every(v => v === nonEmpty[0]);

    html += `<tr><th>${esc(f.label)}</th>`;
    vals.forEach(v => {
      if (!v) {
        html += `<td class="cmp-empty">\u2014</td>`;
      } else {
        const cls = nonEmpty.length < 2 ? "" : allSame ? " cmp-same" : " cmp-diff";
        html += `<td class="${cls}">${esc(v)}${v && f.unit ? esc(f.unit) : ""}</td>`;
      }
    });
    html += `</tr>`;
  });
  html += `</tbody></table>`;

  document.getElementById("cmpBody").innerHTML = html;

  // Shareable URL
  const shareURL = `${location.origin}${location.pathname}?compare=${[...compareSet].join(",")}`;
  const linkEl = document.getElementById("cmpShareLink");
  linkEl.href = shareURL;
  linkEl.textContent = shareURL;

  const overlay = document.getElementById("cmpOverlay");
  overlay.removeAttribute("hidden");
  document.getElementById("cmpClose").focus();
}

function closeCompare() {
  document.getElementById("cmpOverlay").setAttribute("hidden", "");
}

document.getElementById("cmpGo").addEventListener("click", openCompare);
document.getElementById("cmpClear").addEventListener("click", () => {
  compareSet.clear();
  compareToURL();
  updateCompareBar();
  document.querySelectorAll(".cmpbtn--on").forEach(b => {
    b.classList.remove("cmpbtn--on");
    b.setAttribute("aria-pressed", "false");
    b.disabled = false;
    b.title = "Add to comparison";
  });
  document.querySelectorAll(".cmpbtn:disabled").forEach(b => {
    b.disabled = false;
    b.title = "Add to comparison";
  });
});
document.getElementById("cmpClose").addEventListener("click", closeCompare);
document.getElementById("cmpOverlay").addEventListener("click", e => {
  if (e.target.id === "cmpOverlay") closeCompare();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeCompare();
});
</script>
