<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Headphone Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Spline+Sans+Mono:wght@300..700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 32 32' xmlns='http://www.w3.org/2000/svg'%3E%3Crect x='2' y='2' width='28' height='28' rx='6' fill='%23c2410c'/%3E%3Cpath d='M9 19v-3a7 7 0 0 1 14 0v3' fill='none' stroke='%23f4f0e8' stroke-width='2.5'/%3E%3Crect x='7' y='18' width='5' height='8' rx='1.5' fill='%23f4f0e8'/%3E%3Crect x='20' y='18' width='5' height='8' rx='1.5' fill='%23f4f0e8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="shared.css">
<style>
  /* ---- Stats bar ---- */
  .stats-bar { max-width: 1400px; margin: 0 auto; padding: 0.75rem var(--pad);
    display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
    font-size: 0.8rem; color: var(--accent-2); border-bottom: 1px solid var(--line); }
  .stats-bar strong { font-weight: 600; }
  #stats { display: flex; gap: 1.5rem; flex-wrap: wrap; align-items: center; }
  .nav-buttons { margin-left: auto; display: flex; gap: 0.5rem; align-items: center; }
  .pill-link { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--paper);
    padding: 0.45rem 0.95rem; border-radius: 99px; text-decoration: none; white-space: nowrap;
    transition: background 0.15s; }
  .pill-link.brands { background: var(--accent-2); }
  .pill-link.brands:hover { background: #152b22; }
  .pill-link.suggest { background: var(--accent); }
  .pill-link.suggest:hover { background: var(--accent-2); }

  /* ---- Toolbar: search, filters popover, result count, actions ---- */
  main { max-width: 1400px; margin: 0 auto; }
  .toolbar { position: relative; max-width: 1400px; margin: 0 auto; padding: 1rem var(--pad);
    display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .search-field { width: min(280px, 100%); }

  input, select { width: 100%; padding: 0.6rem 0.7rem; border: 1px solid var(--ink); border-radius: 0;
    background: var(--paper); font-family: inherit; font-size: 0.9rem; color: var(--ink); }
  input:focus, select:focus { outline: none; border-color: var(--accent); }

  .filter-toggle { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.62rem 0.9rem;
    background: none; border: 1px solid var(--ink); border-radius: 4px; cursor: pointer;
    font-family: inherit; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink); }
  .filter-toggle:hover { background: var(--paper-2); }
  .filter-toggle svg { opacity: 0.6; }
  .filter-toggle[aria-expanded="true"] svg { opacity: 1; }
  .filter-count { background: var(--accent); color: var(--paper); border-radius: 99px;
    font-size: 0.62rem; line-height: 1; padding: 0.22rem 0.4rem; }

  /* Anchored to the toolbar's left edge rather than the button, so a wide panel can't
     run off the right side of the screen. */
  .filter-panel { position: absolute; top: calc(100% + 0.5rem); left: var(--pad); z-index: 25;
    display: none; grid-template-columns: repeat(5, 1fr); gap: 0.6rem; padding: 1rem;
    width: max(600px, 40vw); max-width: calc(100vw - 2 * var(--pad));
    background: var(--paper); border: 1px solid var(--ink); box-shadow: 4px 4px 0 rgba(26,23,20,0.12); }
  .filter-panel.open { display: grid; }
  .filter-panel .field { min-width: 0; }
  .field label { display: block; margin-bottom: 0.3rem; font-size: 0.65rem; text-transform: uppercase;
    letter-spacing: 0.12em; color: var(--muted); }

  .result-count { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
  .toolbar-actions { margin-left: auto; display: flex; gap: 1.25rem; align-items: center; }
  .link-button { padding: 0; background: none; border: none; cursor: pointer; font-family: inherit;
    font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent-2);
    text-decoration: underline; text-underline-offset: 3px; }
  .link-button:hover { color: var(--accent); }

  /* font-size 0 stops this wrapper's own line box from nudging the button off the
     centre line of its neighbours. The menu sets its own sizes. */
  .column-picker { position: relative; display: inline-block; font-size: 0; }
  .column-menu { position: absolute; right: 0; top: 1.8rem; z-index: 20; display: none;
    min-width: 220px; padding: 0.85rem 1rem;
    background: var(--paper); border: 1px solid var(--ink); box-shadow: 4px 4px 0 rgba(26,23,20,0.12); }
  .column-menu.open { display: block; }
  .column-menu h4 { margin-bottom: 0.6rem; font-size: 0.62rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.14em; color: var(--muted); }
  .column-menu label { display: flex; align-items: center; gap: 0.55rem; padding: 0.28rem 0;
    font-size: 0.82rem; cursor: pointer; color: var(--ink); }
  .column-menu input[type=checkbox] { width: auto; margin: 0; accent-color: var(--accent); cursor: pointer; }

  /* ---- Catalog table ---- */
  #tableWrap { overflow-x: hidden; overflow-y: auto; max-height: calc(100vh - 230px);
    background: var(--paper); border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }

  /* The header's bottom rule is a box-shadow, not a border: with border-collapse a sticky
     cell's border scrolls away with the rows. The inset shadow is the divider between headers. */
  .catalog thead th { position: sticky; top: 0; z-index: 10; padding: 0.5rem 0.6rem;
    background: var(--paper-2); text-align: left; white-space: nowrap; overflow: hidden;
    font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted);
    box-shadow: 0 2px 0 0 var(--ink), inset -1px 0 0 var(--line); cursor: pointer; user-select: none; }
  .catalog thead th:last-child { box-shadow: 0 2px 0 0 var(--ink); }
  .catalog thead th:hover { color: var(--accent); }
  .catalog thead th > span:first-child { display: inline-block; max-width: calc(100% - 10px); overflow: hidden; vertical-align: bottom; }
  .catalog thead th[aria-sort="ascending"], .catalog thead th[aria-sort="descending"] {
    color: var(--accent); box-shadow: 0 3px 0 0 var(--accent), inset -1px 0 0 var(--line); }
  .catalog thead th.dragging { opacity: 0.4; }
  #dropIndicator { position: fixed; z-index: 30; display: none; width: 3px; background: var(--accent); pointer-events: none; }

  /* A short grip on headers that can be dragged; it grows into a full accent line on hover. */
  .resizer { position: absolute; top: 0; right: 0; width: 9px; height: 100%; cursor: col-resize; user-select: none; }
  .resizer::before { content: ""; position: absolute; right: 0; top: 38%; height: 24%; width: 3px;
    border-radius: 2px; background: var(--muted); }
  .resizer:hover::before { top: 0; height: 100%; width: 2px; border-radius: 0; background: var(--accent); }

  .catalog .col-center { text-align: center; }
  .catalog .col-tight { padding-left: 0.3rem; padding-right: 0.3rem; }

  .catalog tbody tr { border-bottom: 1px solid var(--line); transition: background 0.12s; }
  .catalog tbody td { padding: 0.7rem 0.6rem; font-size: 0.86rem; vertical-align: top;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .catalog tr.row { background: var(--paper); cursor: pointer; }
  .catalog tr.row.zebra { background: var(--zebra); }
  .catalog tr.row:hover, .catalog tr.row.expanded { background: var(--row-hover); }

  .model-name { font-family: 'Fraunces', serif; font-size: 1.02rem; font-weight: 600; }
  .brand { color: var(--accent-2); font-weight: 500; text-decoration: none; }
  .brand:hover { color: var(--accent); text-decoration: underline; }
  .year, .spec { font-variant-numeric: tabular-nums; }
  .spec { white-space: nowrap; }
  .spec.empty { color: var(--line); }
  .tag { display: inline-block; padding: 0.1rem 0.45rem; border: 1px solid var(--line); border-radius: 99px;
    font-size: 0.68rem; white-space: nowrap; }
  .tag.active { border-color: var(--accent-2); color: var(--accent-2); }
  .tag.discontinued { color: var(--muted); }
  .flags { font-size: 0.7rem; color: var(--accent); letter-spacing: 0.05em; }

  .details-col, .compare-col { width: 2rem; text-align: center; }
  .expand-button { padding: 0.2rem 0.4rem; background: none; border: none; cursor: pointer;
    font-size: 1.1rem; line-height: 1; color: var(--muted); }
  .caret { display: inline-block; transition: transform 0.15s ease; }
  .catalog tr.row.expanded .caret { transform: rotate(90deg); color: var(--accent); }

  /* ---- Expanded row details ---- */
  .catalog tr.details > td { padding: 0; border-bottom: 1px solid var(--line); }
  .catalog tr.details.zebra > td { background: var(--zebra); }
  .catalog tr.details:not([hidden]) > td { border-top: 2px solid var(--accent); }
  .details-panel { padding: 1.1rem 1.4rem; border-left: 3px solid var(--accent); }
  .spec-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.6rem 1.5rem; }
  .spec-list dt { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
  .spec-list dd { font-size: 0.88rem; font-variant-numeric: tabular-nums; white-space: normal; overflow-wrap: break-word; }
  .details-notes { margin-top: 0.9rem; padding: 0.5rem 0.75rem; font-size: 0.84rem;
    background: var(--paper); border: 1px solid var(--line); border-radius: 4px; }
  .details-links { margin-top: 0.9rem; font-size: 0.82rem; }
  .details-links a { color: var(--accent-2); }

  .lineage { margin-top: 1rem; }
  .lineage-label { margin-bottom: 0.5rem; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }
  .lineage-chain { display: flex; align-items: center; flex-wrap: wrap; gap: 0.3rem; }
  .lineage-arrow { padding: 0 0.1rem; font-size: 0.9rem; color: var(--line); }
  .lineage-node { display: flex; flex-direction: column; align-items: center; min-width: 80px; max-width: 140px;
    padding: 0.35rem 0.65rem; border: 1px solid var(--line); border-radius: 4px; text-align: center; }
  .lineage-node.current { background: var(--accent); border-color: var(--accent); color: var(--paper); }
  .lineage-node.other { background: var(--paper-2); cursor: pointer; transition: border-color 0.12s; }
  .lineage-node.other:hover { border-color: var(--accent); }
  .lineage-name { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 0.72rem; font-weight: 600; }
  .lineage-year { margin-top: 0.1rem; font-size: 0.6rem; opacity: 0.75; }

  /* ---- Compare: row buttons, bottom bar, dialog ---- */
  .compare-button { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px;
    padding: 0; background: none; border: 1px solid var(--line); border-radius: 4px; cursor: pointer;
    font-size: 1rem; line-height: 1; color: var(--muted); transition: all 0.1s; }
  .compare-button::before { content: "+"; }
  .compare-button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .compare-button.selected { background: var(--accent); border-color: var(--accent); color: var(--paper); }
  .compare-button.selected:hover:not(:disabled)::before { content: "\2212"; color: var(--paper-2); }
  .compare-button:disabled { opacity: 0.3; cursor: not-allowed; }

  .compare-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 40; display: flex; align-items: center;
    gap: 1rem; padding: 0.8rem 1.5rem; background: var(--ink); color: var(--paper);
    box-shadow: 0 -4px 20px rgba(26,23,20,0.3); }
  .compare-bar[hidden] { display: none; }
  .compare-slots { display: flex; flex: 1; flex-wrap: wrap; gap: 0.6rem; }
  .compare-slot { display: flex; align-items: center; gap: 0.4rem; padding: 0.25rem 0.7rem;
    background: rgba(255,255,255,0.1); border-radius: 99px; font-size: 0.78rem; white-space: nowrap; }
  .compare-slot button { padding: 0; background: none; border: none; cursor: pointer;
    font-size: 1rem; line-height: 1; color: inherit; opacity: 0.7; }
  .compare-slot button:hover { opacity: 1; }
  .compare-open { padding: 0.6rem 1.2rem; background: var(--accent); color: var(--paper); border: none;
    border-radius: 99px; cursor: pointer; white-space: nowrap;
    font-family: inherit; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; }
  .compare-open:hover:not(:disabled) { background: var(--accent-2); }
  .compare-open:disabled { opacity: 0.5; cursor: default; }
  .compare-clear { font-size: 0.72rem; color: rgba(255,255,255,0.6); }
  .compare-clear:hover { color: var(--paper); }

  .compare-dialog { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-start; justify-content: center;
    padding: 2rem 1rem; overflow-y: auto; background: rgba(26,23,20,0.55); }
  .compare-dialog[hidden] { display: none; }
  .compare-modal { width: 100%; max-width: 960px; overflow: hidden;
    background: var(--paper); border: 1px solid var(--ink); border-radius: 12px; }
  .compare-head { display: flex; justify-content: space-between; align-items: center;
    padding: 1.2rem 1.5rem; border-bottom: 2px solid var(--ink); }
  .compare-head h2 { font-family: 'Fraunces', serif; font-size: 1.4rem; }
  .compare-close { padding: 0.2rem; background: none; border: none; cursor: pointer;
    font-size: 1.5rem; line-height: 1; color: var(--muted); }
  .compare-close:hover { color: var(--ink); }
  .compare-body { overflow-x: auto; }
  .compare-share { padding: 0.8rem 1.5rem; border-top: 1px solid var(--line); font-size: 0.76rem; color: var(--muted); }
  .compare-share a { color: var(--accent-2); word-break: break-all; }

  .compare-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .compare-table th, .compare-table td { padding: 0.32rem 0.7rem; text-align: left; vertical-align: top;
    border-bottom: 1px solid var(--line); }
  .compare-table th { width: 120px; background: var(--paper-2); font-size: 0.58rem;
    text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
  .compare-table td { background: var(--paper); font-size: 0.82rem; }
  .compare-table tbody tr:nth-child(even) td { background: var(--zebra); }
  .compare-model { font-family: 'Fraunces', serif; font-size: 0.92rem; font-weight: 600; }
  .compare-brand { font-size: 0.68rem; color: var(--muted); }
  .compare-table .differs { color: var(--accent); font-weight: 500; }
  .compare-table .same { color: var(--muted); }
  .compare-table .missing { color: var(--line); font-style: italic; }

  /* ---- Loading, empty, footer ---- */
  .loading, .empty { padding: 4rem 1rem; text-align: center; font-size: 0.9rem; color: var(--muted); }
  .loading::after { content: ''; display: block; width: 28px; height: 28px; margin: 1rem auto 0;
    border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer { max-width: 1400px; margin: 0 auto; padding: 2rem var(--pad); border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 1rem;
    font-size: 0.72rem; color: var(--muted); }
  footer a { color: var(--accent-2); }

  .skip-link { position: absolute; left: -999px; top: 0; z-index: 100; padding: 0.6rem 1rem;
    background: var(--ink); color: var(--paper); }
  .skip-link:focus { left: 0; }

  /* ---- Narrow screens ---- */
  @media (max-width: 700px) {
    .filter-panel { grid-template-columns: 1fr 1fr; width: max(90vw, 320px); }
  }

  /* Phones: each row becomes a card showing brand, model, year and design. */
  @media (max-width: 600px) {
    input, select { font-size: 1rem; } /* 16px stops iOS zooming in on focus */

    #tableWrap { max-height: none; border: none; }
    .catalog, .catalog tbody { display: block; }
    .catalog thead { display: none; }

    .catalog tr.row { display: grid; grid-template-columns: auto 1fr auto auto;
      grid-template-areas: "brand brand compare caret" "model model compare caret" "year design compare caret";
      gap: 0 0.4rem; align-items: center; margin: 0.5rem var(--pad); padding: 0.75rem;
      border: 1px solid var(--line); border-radius: 8px; }
    .catalog tr.row td { display: none; padding: 0; border: none; white-space: normal; overflow: visible; }
    .catalog tr.row td[data-key="_brand"] { display: block; grid-area: brand; margin-bottom: 0.1rem; font-size: 0.68rem; color: var(--muted); }
    .catalog tr.row td[data-key="model_name"] { display: block; grid-area: model; padding: 0.05rem 0;
      font-family: 'Fraunces', serif; font-size: 0.95rem; font-weight: 600; line-height: 1.2; }
    .catalog tr.row td[data-key="release_year"] { display: inline; grid-area: year; justify-self: start; font-size: 0.72rem; color: var(--muted); }
    .catalog tr.row td[data-key="design"] { display: inline; grid-area: design; justify-self: start; font-size: 0.72rem; color: var(--muted); }
    .catalog tr.row td[data-key="design"]::before { content: "\00b7"; margin-right: 0.3em; }
    .catalog tr.row td.compare-col, .catalog tr.row td.details-col { display: flex; align-items: center; justify-content: center; width: 28px; }
    .catalog tr.row td.compare-col { grid-area: compare; }
    .catalog tr.row td.details-col { grid-area: caret; }

    /* :not([hidden]) so the hidden attribute still closes the panel. */
    .catalog tr.details:not([hidden]) { display: block; }
    .catalog tr.details > td { display: block; margin: -0.5rem var(--pad) 0.5rem; border: none;
      border-left: 3px solid var(--accent); border-radius: 0 0 8px 8px; background: var(--paper); }
    .catalog tr.details:not([hidden]) > td { border-top: none; }
    .details-panel { padding: 0.9rem 1rem; border-left: none; }

    .compare-dialog { padding: 0; align-items: flex-end; }
    .compare-modal { max-height: 100vh; overflow-y: auto; border-radius: 0; }
    .compare-table th { width: 90px; font-size: 0.55rem; }
    .compare-table td { font-size: 0.8rem; }

    .compare-bar { flex-wrap: wrap; gap: 0.5rem; padding: 0.75rem 1rem; }
    .compare-slots { width: 100%; }
    .compare-slot { font-size: 0.7rem; }
  }
</style>
</head>

<a class="skip-link" href="#main">Skip to catalog</a>
<div class="banner"><div class="in">

<!-- The banner shows the name; this heading is for screen readers and search engines. -->
<h1 class="visually-hidden">The Headphone Archive</h1>

<div class="stats-bar">
  <span id="stats">Loading catalog&hellip;</span>
  <nav class="nav-buttons">
    <a class="pill-link brands" href="brands.html">&#9674; All Brands</a>
    <a class="pill-link suggest" href="suggest.html">Suggest an Edit &rarr;</a>
  </nav>
</div>

<main id="main">
  <div class="toolbar">
    <div class="field search-field">
      <label for="search" class="visually-hidden">Search</label>
      <input type="text" id="search" placeholder="Model, brand, keyword&hellip;" autocomplete="off">
    </div>
    <button class="filter-toggle" id="filterToggle" aria-haspopup="true" aria-expanded="false" aria-controls="filterPanel">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
      Filters<span class="filter-count" id="filterCount" hidden></span>
    </button>
    <div class="filter-panel" id="filterPanel">
      <div class="field"><label for="brand">Brand</label><select id="brand"></select></div>
      <div class="field"><label for="design">Design</label><select id="design"></select></div>
      <div class="field"><label for="fit">Fit</label><select id="fit"></select></div>
      <div class="field"><label for="driver">Driver</label><select id="driver"></select></div>
      <div class="field"><label for="status">Status</label><select id="status"></select></div>
      <div class="field"><label for="signature">Sound signature</label><select id="signature"></select></div>
      <div class="field">
        <label for="maxImpedance">Max impedance</label>
        <select id="maxImpedance">
          <option value="">Any</option>
          <option value="16">Up to 16&Omega;</option>
          <option value="32">Up to 32&Omega;</option>
          <option value="50">Up to 50&Omega;</option>
          <option value="80">Up to 80&Omega;</option>
          <option value="150">Up to 150&Omega;</option>
          <option value="300">Up to 300&Omega;</option>
        </select>
      </div>
      <div class="field">
        <label for="maxPrice">Max price (USD)</label>
        <input type="number" id="maxPrice" placeholder="e.g. 500" min="0" step="50">
      </div>
      <div class="field"><label for="connector">Connector</label><select id="connector"></select></div>
      <div class="field"><label for="detachable">Detachable cable</label><select id="detachable"></select></div>
    </div>
    <span class="result-count" id="resultCount" aria-live="polite"></span>
    <span class="toolbar-actions">
      <button class="link-button" id="exportButton">Export CSV</button>
      <span class="column-picker">
        <button class="link-button" id="columnsToggle" aria-haspopup="true" aria-expanded="false">Columns &#9662;</button>
        <div class="column-menu" id="columnMenu">
          <h4>Show columns</h4>
          <div id="columnCheckboxes"></div>
        </div>
      </span>
      <button class="link-button" id="resetFilters">Reset filters</button>
    </span>
  </div>
  <div id="tableWrap"><div class="loading">Fetching the archive</div></div>
</main>

<div class="compare-bar" id="compareBar" hidden aria-live="polite">
  <div class="compare-slots" id="compareSlots"></div>
  <button class="compare-open" id="compareOpen">Compare</button>
  <button class="compare-clear link-button" id="compareClear">Clear</button>
</div>

<div class="compare-dialog" id="compareDialog" role="dialog" aria-modal="true" aria-labelledby="compareTitle" hidden>
  <div class="compare-modal">
    <div class="compare-head">
      <h2 id="compareTitle">Compare Headphones</h2>
      <button class="compare-close" id="compareClose" aria-label="Close comparison">&times;</button>
    </div>
    <div class="compare-body" id="compareBody"></div>
    <p class="compare-share">Share this comparison: <a id="compareShareLink" href="#"></a></p>
  </div>
</div>

<footer>
  <span>Data: community-maintained catalog</span>
  <span>Source: <a href="https://github.com/notacodeman/headphone-database">github.com/notacodeman/headphone-database</a></span>
</footer>

<script src="shared.js"></script>
<script>
// ---- Settings ----

// Fallback data source if /api/catalog is down.
const CSV_BASE_URL = "https://raw.githubusercontent.com/notacodeman/headphone-database/main/database";
const MAX_COMPARE = 3;
const COMPARE_COL_WIDTH = 44;
const DETAILS_COL_WIDTH = 44;
const MIN_DRAG_WEIGHT = 30;       // smallest weight a flexible column can be dragged down to
const SNAP_DRAG_DISTANCE = 15;    // px a Design/Fit handle must move to switch widths
const REORDER_DRAG_DISTANCE = 6;  // px a header must move before a click becomes a reorder
const PHONE_WIDTH = 600;          // matches the card-layout media query

// Keys for the visitor's saved table settings. Don't rename: existing saves would be lost.
const STORAGE_KEYS = {
  visible: "archive_cols",
  weights: "archive_colw",
  small: "archive_colsmall",
  order: "archive_colorder",
};

// Table columns.
//   visible     shown by default
//   fixed       always exactly `width` px, sized to the column's longest value
//   width       px for fixed columns; a share-of-the-leftover weight for flexible ones
//   minWidth    flexible columns try not to shrink below this many px
//   smallWidth  fixed columns with this get a handle that snaps between the two widths
//               and show only the first word ("Open Back" -> "Open")
//   center      centre the header and values
//   tight       half the usual side padding
const COLUMNS = [
  { key: "_brand",           label: "Brand",        visible: true,  sortable: true,  width: 130, minWidth: 110 },
  { key: "model_name",       label: "Model",        visible: true,  sortable: true,  width: 180, minWidth: 110 },
  { key: "release_year",     label: "Year",         visible: true,  sortable: true,  width: 51,  fixed: true, tight: true, center: true },
  { key: "design",           label: "Design",       visible: true,  sortable: true,  width: 116, fixed: true, smallWidth: 65 },
  { key: "fit",              label: "Fit",          visible: true,  sortable: true,  width: 92,  fixed: true, smallWidth: 58 },
  { key: "driver_type",      label: "Driver",       visible: false, sortable: true,  width: 130, minWidth: 90 },
  { key: "driver_size_mm",   label: "Driver Size",  visible: false, sortable: true,  width: 120, minWidth: 90 },
  { key: "impedance_ohms",   label: "Impedance",    visible: true,  sortable: true,  width: 88,  fixed: true, center: true, tight: true },
  { key: "sensitivity_db",   label: "Sensitivity",  visible: false, sortable: true,  width: 105, fixed: true, center: true, tight: true },
  { key: "status",           label: "Status",       visible: false, sortable: true,  width: 120, fixed: true, center: true, tight: true },
  { key: "_flags",           label: "Wireless/ANC", visible: false, sortable: false, width: 110, fixed: true, center: true, tight: true },
  { key: "weight_g",         label: "Weight (g)",   visible: false, sortable: true,  width: 95,  fixed: true, center: true, tight: true },
  { key: "msrp_usd",         label: "MSRP (USD)",   visible: true,  sortable: true,  width: 95,  fixed: true, center: true, tight: true },
  { key: "connector_type",   label: "Connector",    visible: false, sortable: true,  width: 140, minWidth: 100 },
  { key: "detachable_cable", label: "Detachable",   visible: false, sortable: true,  width: 100, minWidth: 80 },
];
const NUMERIC_KEYS = ["release_year", "driver_size_mm", "impedance_ohms", "sensitivity_db", "weight_g", "msrp_usd"];

// Fixed option lists, so a typo in the data can't sneak in as a new filter choice.
// Brand and connector are open-ended, so they're built from the data instead.
const FILTER_OPTIONS = {
  design: ["Closed Back", "Open Back", "Semi-Open"],
  fit: ["On-Ear", "Over-Ear"],
  driver: ["AMT", "Dynamic", "Electrostatic", "Hybrid", "Planar Magnetic", "Ribbon"],
  status: ["Active", "Discontinued", "Legacy Active"],
  signature: ["Neutral", "Warm Neutral", "Neutral Bright", "Warm", "Bright", "Analytical", "V-Shaped", "U-Shaped", "Bassy", "Dark"],
  detachable: ["Yes", "No"],
};
const FILTER_IDS = ["search", "brand", "design", "fit", "driver", "status", "signature",
  "connector", "detachable", "maxImpedance", "maxPrice"];

// ---- State ----

const state = {
  rows: [],
  filtered: [],
  sortKey: "release_year",
  sortDir: "descending",
  visible: {},              // column key -> shown
  small: {},                // column key -> using its smallWidth
  weights: {},              // column key -> width weight
  customWidths: new Set(),  // columns the visitor has resized themselves
  order: null,              // column keys in the visitor's order, or null for COLUMNS order
};
const compareIds = new Set(); // numeric product ids, also kept in the URL as ?compare=1,42
let drag = null;              // the header drag in progress: reorder, snap or resize
let ignoreNextHeaderClick = false;

const byId = id => document.getElementById(id);
const tableWrap = byId("tableWrap");

// ---- Saved settings ----

function readSaved(key) {
  try { return JSON.parse(localStorage.getItem(key) || "null"); } catch (e) { return null; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}

function loadColumnSettings() {
  const visible = readSaved(STORAGE_KEYS.visible);
  const weights = readSaved(STORAGE_KEYS.weights);
  const small = readSaved(STORAGE_KEYS.small);
  const order = readSaved(STORAGE_KEYS.order);
  for (const col of COLUMNS) {
    state.visible[col.key] = visible && col.key in visible ? !!visible[col.key] : col.visible;
    state.weights[col.key] = col.width;
    if (weights && typeof weights[col.key] === "number") {
      state.weights[col.key] = weights[col.key];
      state.customWidths.add(col.key);
    }
    if (col.smallWidth) state.small[col.key] = !!(small && small[col.key]);
  }
  if (Array.isArray(order) && order.every(key => typeof key === "string")) state.order = order;
}

// ---- Column layout ----

const findColumn = key => COLUMNS.find(col => col.key === key);

// COLUMNS in the visitor's order. Columns added since their order was saved go on the end.
function orderedColumns() {
  if (!state.order) return COLUMNS.slice();
  const ordered = state.order.map(findColumn).filter(Boolean);
  return ordered.concat(COLUMNS.filter(col => !state.order.includes(col.key)));
}
const visibleColumns = () => orderedColumns().filter(col => state.visible[col.key]);

const isSmall = col => !!(col.smallWidth && state.small[col.key]);
const fixedWidth = col => isSmall(col) ? col.smallWidth : col.width;

// Px left for the flexible columns once the fixed ones and the two button columns are placed.
function flexibleSpace(tableWidth, cols) {
  const fixedTotal = cols.filter(col => col.fixed).reduce((sum, col) => sum + fixedWidth(col), 0);
  return tableWidth - COMPARE_COL_WIDTH - DETAILS_COL_WIDTH - fixedTotal;
}

// Splits `space` px between flexible columns by weight. Columns that would fall below
// their minWidth are held there and the difference comes out of the others. Model also
// has a default maxWidth (see fitModelColumn) until the visitor resizes it. If the
// minimums can't all fit, a plain split wins: the table must never overflow.
function splitFlexibleWidths(cols, space) {
  const widths = {};
  const totalWeight = cols.reduce((sum, col) => sum + state.weights[col.key], 0);
  if (totalWeight <= 0 || space <= 0) {
    cols.forEach(col => widths[col.key] = 0);
    return widths;
  }
  cols.forEach(col => widths[col.key] = state.weights[col.key] / totalWeight * space);
  if (cols.reduce((sum, col) => sum + (col.minWidth || 0), 0) >= space) return widths;

  const pinned = new Set();
  // Share `px` between the unpinned columns by weight. Returns false if there are none.
  const spread = px => {
    const open = cols.filter(col => !pinned.has(col.key));
    if (!open.length) return false;
    const openWeight = open.reduce((sum, col) => sum + state.weights[col.key], 0);
    open.forEach(col => widths[col.key] += px * state.weights[col.key] / openWeight);
    return true;
  };
  const maxWidthOf = col => col.maxWidth && !state.customWidths.has(col.key) ? col.maxWidth : Infinity;

  for (let pass = 0; pass < cols.length; pass++) {
    let shortfall = 0;
    for (const col of cols) {
      if (!pinned.has(col.key) && widths[col.key] < (col.minWidth || 0)) {
        shortfall += col.minWidth - widths[col.key];
        widths[col.key] = col.minWidth;
        pinned.add(col.key);
      }
    }
    if (shortfall <= 0 || !spread(-shortfall)) break;
  }
  for (let pass = 0; pass < cols.length; pass++) {
    let surplus = 0;
    for (const col of cols) {
      const max = maxWidthOf(col);
      if (!pinned.has(col.key) && widths[col.key] > max) {
        surplus += widths[col.key] - max;
        widths[col.key] = max;
        pinned.add(col.key);
      }
    }
    if (surplus <= 0 || !spread(surplus)) break;
  }
  return widths;
}

// Sizes Model to its longest name so it doesn't balloon on wide screens. Measured from
// the rendered cells because names are free text. Runs once after the first render and
// stops applying once the visitor resizes Model themselves.
async function fitModelColumn() {
  if (state.customWidths.has("model_name")) return;
  try { await document.fonts.ready; } catch (e) {}
  const header = tableWrap.querySelector('th[data-key="model_name"]');
  if (!header) return;
  // Squeezing the column makes each cell's scrollWidth report its full, unclipped width.
  const savedWidth = header.style.width;
  header.style.width = "10px";
  let longest = 0;
  tableWrap.querySelectorAll('tr.row td[data-key="model_name"]').forEach(cell => {
    longest = Math.max(longest, cell.scrollWidth);
  });
  header.style.width = savedWidth;
  if (!longest) return;
  const target = Math.ceil(longest) + 10;
  state.weights.model_name = target;
  findColumn("model_name").maxWidth = target;
  renderTable();
}

// Re-applies flexible widths to the live headers (after a resize drag or window resize).
function applyFlexibleWidths() {
  const table = tableWrap.querySelector("table");
  if (!table) return;
  const cols = COLUMNS.filter(col => state.visible[col.key]);
  const flexible = cols.filter(col => !col.fixed);
  const space = flexibleSpace(table.clientWidth, cols);
  const widths = splitFlexibleWidths(flexible, space);
  flexible.forEach(col => {
    const header = table.querySelector(`th[data-key="${col.key}"]`);
    if (header) header.style.width = (widths[col.key] / space * 100) + "%";
  });
}

// Makes the table scroll inside the window instead of the whole page. Phones use the
// card layout, where the page scrolls normally.
function fitTableHeight() {
  if (window.innerWidth <= PHONE_WIDTH) {
    tableWrap.style.maxHeight = "";
    return;
  }
  const footerHeight = document.querySelector("footer").getBoundingClientRect().height;
  const available = window.innerHeight - tableWrap.getBoundingClientRect().top - footerHeight;
  tableWrap.style.maxHeight = Math.max(200, Math.floor(available)) + "px";
}

// ---- Header dragging: resize, snap Design/Fit, reorder ----

function startResize(event, key) {
  event.preventDefault();
  const col = findColumn(key);
  if (col.fixed) {
    drag = { type: "snap", key, startX: event.clientX, startSmall: isSmall(col) };
  } else {
    const others = COLUMNS.filter(c => state.visible[c.key] && !c.fixed && c.key !== key);
    if (!others.length) return;
    // Everything is worked out from the widths at mousedown so the drag doesn't drift.
    const startWeights = {};
    others.forEach(c => startWeights[c.key] = state.weights[c.key]);
    const othersTotal = others.reduce((sum, c) => sum + state.weights[c.key], 0);
    drag = { type: "resize", key, startX: event.clientX, others, startWeights, othersTotal,
      startWeight: state.weights[key], totalWeight: othersTotal + state.weights[key] };
  }
  document.body.style.userSelect = "none";
}

function startReorder(event, key) {
  drag = { type: "reorder", key, startX: event.clientX, moved: false, dropPoint: null };
  document.body.style.userSelect = "none";
}

function moveResize(mouseX) {
  const table = tableWrap.querySelector("table");
  if (!table) return;
  const space = flexibleSpace(table.clientWidth, COLUMNS.filter(col => state.visible[col.key]));
  const pxPerWeight = space / drag.totalWeight;
  const maxGrow = drag.othersTotal - drag.others.length * MIN_DRAG_WEIGHT;
  let change = (mouseX - drag.startX) / pxPerWeight;
  change = Math.max(MIN_DRAG_WEIGHT - drag.startWeight, Math.min(maxGrow, change));
  // The other columns scale together to absorb the change, so the table stays full width.
  state.weights[drag.key] = drag.startWeight + change;
  const scale = (drag.othersTotal - change) / drag.othersTotal;
  drag.others.forEach(col => state.weights[col.key] = drag.startWeights[col.key] * scale);
  applyFlexibleWidths();
}

// Design and Fit have no useful in-between width, so their handle snaps between two sizes.
function moveSnap(mouseX) {
  const distance = mouseX - drag.startX;
  let small = drag.startSmall;
  if (!small && distance < -SNAP_DRAG_DISTANCE) small = true;
  else if (small && distance > SNAP_DRAG_DISTANCE) small = false;
  if (small !== state.small[drag.key]) {
    state.small[drag.key] = small;
    renderTable();
  }
}

// The drop point is the first header (left to right) whose middle is past the mouse, so
// every mouse position has exactly one answer and the indicator never flickers.
function findDropPoint(mouseX) {
  const headers = [...tableWrap.querySelectorAll("th[data-key]")].filter(th => th.dataset.key !== drag.key);
  for (const th of headers) {
    const box = th.getBoundingClientRect();
    if (mouseX < box.left + box.width / 2) {
      return { beforeKey: th.dataset.key, x: box.left, top: box.top, height: box.height };
    }
  }
  const last = headers[headers.length - 1];
  if (!last) return null;
  const box = last.getBoundingClientRect();
  return { afterKey: last.dataset.key, x: box.right, top: box.top, height: box.height };
}

function dropIndicator() {
  let indicator = byId("dropIndicator");
  if (!indicator) {
    indicator = document.createElement("div");
    indicator.id = "dropIndicator";
    document.body.appendChild(indicator);
  }
  return indicator;
}

function moveReorder(mouseX) {
  if (!drag.moved) {
    if (Math.abs(mouseX - drag.startX) <= REORDER_DRAG_DISTANCE) return;
    drag.moved = true;
    tableWrap.querySelector(`th[data-key="${drag.key}"]`)?.classList.add("dragging");
  }
  drag.dropPoint = findDropPoint(mouseX);
  const indicator = dropIndicator();
  indicator.style.display = drag.dropPoint ? "block" : "none";
  if (drag.dropPoint) {
    indicator.style.left = (drag.dropPoint.x - 1) + "px";
    indicator.style.top = drag.dropPoint.top + "px";
    indicator.style.height = drag.dropPoint.height + "px";
  }
}

function finishReorder() {
  tableWrap.querySelector(`th[data-key="${drag.key}"]`)?.classList.remove("dragging");
  dropIndicator().style.display = "none";
  if (!drag.moved || !drag.dropPoint) return;
  // The mouseup may be followed by a click that would sort. Ignore it, but only this turn.
  ignoreNextHeaderClick = true;
  setTimeout(() => ignoreNextHeaderClick = false);
  const order = orderedColumns().map(col => col.key).filter(key => key !== drag.key);
  const { beforeKey, afterKey } = drag.dropPoint;
  const insertAt = beforeKey ? order.indexOf(beforeKey) : order.indexOf(afterKey) + 1;
  order.splice(insertAt, 0, drag.key);
  state.order = order;
  save(STORAGE_KEYS.order, order);
  renderTable();
}

document.addEventListener("mousemove", event => {
  if (drag?.type === "reorder") moveReorder(event.clientX);
  else if (drag?.type === "snap") moveSnap(event.clientX);
  else if (drag?.type === "resize") moveResize(event.clientX);
});

document.addEventListener("mouseup", () => {
  if (!drag) return;
  document.body.style.userSelect = "";
  if (drag.type === "reorder") finishReorder();
  else if (drag.type === "snap") save(STORAGE_KEYS.small, state.small);
  else {
    state.customWidths.add(drag.key);
    save(STORAGE_KEYS.weights, state.weights);
  }
  drag = null;
});

// ---- Loading ----

// Quote-aware: commas and newlines inside quotes stay in the cell, "" is a literal quote.
function parseCsv(text) {
  const rows = [];
  let row = [], cell = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    if (inQuotes) {
      if (char !== '"') cell += char;
      else if (text[i + 1] === '"') { cell += '"'; i++; }
      else inQuotes = false;
    } else if (char === '"') inQuotes = true;
    else if (char === ",") { row.push(cell); cell = ""; }
    else if (char === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
    else if (char !== "\r") cell += char;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  const header = rows.shift().map(name => name.trim());
  return rows
    .filter(cells => cells.length > 1)
    .map(cells => Object.fromEntries(header.map((name, i) => [name, (cells[i] || "").trim()])));
}

async function fetchFromApi() {
  const response = await fetch("/api/catalog");
  const data = await response.json();
  if (!data.ok || !data.products?.length) throw new Error("API returned no products");
  return data.products.map(product => ({ ...product, _brand: product._brand || "Unknown" }));
}

async function fetchFromCsv() {
  const [productsResponse, brandsResponse] = await Promise.all([
    fetch(CSV_BASE_URL + "/products.csv"),
    fetch(CSV_BASE_URL + "/manufacturers.csv"),
  ]);
  if (!productsResponse.ok || !brandsResponse.ok) throw new Error("CSV fetch failed");
  const products = parseCsv(await productsResponse.text());
  const brandNames = {};
  parseCsv(await brandsResponse.text()).forEach(brand => brandNames[brand.manufacturer_id] = brand.name);
  products.forEach(product => product._brand = brandNames[product.manufacturer_id] || "Unknown");
  return products;
}

async function load() {
  try {
    state.rows = await fetchFromApi().catch(fetchFromCsv);
  } catch (e) {
    tableWrap.innerHTML = '<div class="empty">Could not load the catalog. If you just updated the repo, give it a moment and refresh.</div>';
    byId("stats").textContent = "Catalog unavailable";
    fitTableHeight();
    return;
  }
  fillFilterOptions();
  showStats();
  applyFilters();
  await fitModelColumn();
  renderCompareBar();
  openFocusedProduct();
  fitTableHeight();
}

// ---- Filters ----

const uniqueSorted = key => [...new Set(state.rows.map(row => row[key]).filter(Boolean))].sort();

function fillFilterOptions() {
  const options = { ...FILTER_OPTIONS, brand: uniqueSorted("_brand"), connector: uniqueSorted("connector_type") };
  for (const [id, values] of Object.entries(options)) {
    byId(id).innerHTML = '<option value="">All</option>' +
      values.map(value => `<option>${escapeHtml(value)}</option>`).join("");
  }
}

function showStats() {
  const years = state.rows.map(row => +row.release_year).filter(Boolean);
  byId("stats").innerHTML =
    `<span><strong>${state.rows.length}</strong> headphones</span>` +
    `<span><strong>${uniqueSorted("_brand").length}</strong> brands</span>` +
    `<span><strong>${Math.min(...years)}</strong>&ndash;<strong>${Math.max(...years)}</strong></span>`;
}

function applyFilters() {
  const value = id => byId(id).value;
  const search = value("search").toLowerCase();
  const maxImpedance = parseFloat(value("maxImpedance")) || null;
  const maxPrice = parseFloat(value("maxPrice")) || null;
  const exactMatches = [
    ["brand", "_brand"], ["design", "design"], ["fit", "fit"], ["driver", "driver_type"],
    ["status", "status"], ["signature", "sound_signature"], ["connector", "connector_type"],
    ["detachable", "detachable_cable"],
  ].filter(([id]) => value(id));

  // Rows with no impedance or price are left out once that limit is set.
  const withinLimit = (field, limit) => limit === null || parseFloat(field) <= limit;

  state.filtered = state.rows.filter(row =>
    exactMatches.every(([id, key]) => row[key] === value(id)) &&
    withinLimit(row.impedance_ohms, maxImpedance) &&
    withinLimit(row.msrp_usd, maxPrice) &&
    (!search || [row.full_name, row._brand, row.notes, row.model_name].join(" ").toLowerCase().includes(search))
  );
  sortRows();
  renderTable();
  const activeCount = FILTER_IDS.filter(id => value(id) !== "").length;
  byId("filterCount").hidden = activeCount === 0;
  byId("filterCount").textContent = activeCount;
}

function resetFilters() {
  FILTER_IDS.forEach(id => byId(id).value = "");
  applyFilters();
}

// Numbers sort numerically with blanks as 0; text sorts case-insensitively.
function sortRows() {
  const key = state.sortKey;
  const direction = state.sortDir === "ascending" ? 1 : -1;
  const sortValue = NUMERIC_KEYS.includes(key)
    ? row => parseFloat(row[key]) || 0
    : row => (row[key] || "").toLowerCase();
  state.filtered.sort((a, b) => {
    const x = sortValue(a), y = sortValue(b);
    return x < y ? -direction : x > y ? direction : 0;
  });
}

function sortBy(key) {
  if (!findColumn(key)?.sortable) return;
  if (state.sortKey === key) state.sortDir = state.sortDir === "ascending" ? "descending" : "ascending";
  else { state.sortKey = key; state.sortDir = "ascending"; }
  sortRows();
  renderTable();
}

// ---- Table ----

const emptyCell = '<span class="spec empty">&mdash;</span>';
const specCell = (value, unit) => value ? `<span class="spec">${escapeHtml(value)} ${unit}</span>` : emptyCell;
const textCell = value => value ? `<span class="spec">${escapeHtml(value)}</span>` : emptyCell;
const firstWord = text => (text || "").split(/[\s-]/)[0]; // "Open Back" -> "Open", "Over-Ear" -> "Over"

function cellHtml(row, key) {
  switch (key) {
    case "_brand": return `<a class="brand" href="brand.html?id=${escapeHtml(row.manufacturer_id)}">${escapeHtml(row._brand)}</a>`;
    case "model_name": return `<span class="model-name">${escapeHtml(row.model_name)}</span>`;
    case "release_year":
      return `<span class="year">${escapeHtml(row.release_year)}${row.discontinued_year ? "&ndash;" + escapeHtml(row.discontinued_year) : ""}</span>`;
    case "design":
    case "fit": return escapeHtml(state.small[key] ? firstWord(row[key]) : row[key]);
    case "status": {
      const statusClass = /disc/i.test(row.status) ? "discontinued" : "active";
      return `<span class="tag ${statusClass}">${escapeHtml(row.status)}</span>`;
    }
    case "driver_size_mm": return specCell(row.driver_size_mm, "mm");
    case "impedance_ohms": return specCell(row.impedance_ohms, "Ω");
    case "sensitivity_db": return specCell(row.sensitivity_db, "dB");
    case "weight_g": return specCell(row.weight_g, "g");
    case "_flags": {
      const flags = [row.wireless === "Yes" && "WL", row.anc === "Yes" && "ANC"].filter(Boolean);
      return `<span class="flags">${flags.join(" · ") || "&mdash;"}</span>`;
    }
    case "msrp_usd": return row.msrp_usd ? `<span class="spec">${formatPrice(row.msrp_usd)}</span>` : emptyCell;
    case "connector_type":
    case "detachable_cable": return textCell(row[key]);
    default: return escapeHtml(row[key]);
  }
}

function cellClass(col) {
  const classes = [col.center && "col-center", (col.tight || isSmall(col)) && "col-tight"].filter(Boolean);
  return classes.length ? ` class="${classes.join(" ")}"` : "";
}

const productId = row => parseInt(row.id, 10) || 0;
const productName = row => `${row._brand} ${row.model_name}`;

function renderTable() {
  byId("resultCount").textContent = `${state.filtered.length} result${state.filtered.length === 1 ? "" : "s"}`;
  if (!state.filtered.length) {
    tableWrap.innerHTML = '<div class="empty">No headphones match those filters.</div>';
    return;
  }
  const cols = visibleColumns();
  const flexible = cols.filter(col => !col.fixed);
  // Widths are worked out before the table exists, from the wrapper, so minimums hold on first paint.
  const space = Math.max(0, flexibleSpace(tableWrap.clientWidth || 0, cols));
  const flexWidths = space > 0
    ? splitFlexibleWidths(flexible, space)
    : splitFlexibleWidths(flexible, 100); // hidden wrapper: fall back to plain percentages
  const flexTotal = space > 0 ? space : 100;

  const headers = cols.map(col => {
    const width = col.fixed ? `${fixedWidth(col)}px` : `${flexWidths[col.key] / flexTotal * 100}%`;
    const sort = col.sortable ? ` aria-sort="${state.sortKey === col.key ? state.sortDir : "none"}" tabindex="0" role="button"` : "";
    // Fixed columns only get a handle if they have a small width to snap to.
    const handle = !col.fixed || col.smallWidth ? `<span class="resizer" data-key="${col.key}"></span>` : "";
    return `<th scope="col" data-key="${col.key}" style="width:${width}"${sort}${cellClass(col)}><span>${col.label}</span>${handle}</th>`;
  }).join("");

  const rows = state.filtered.map((row, i) => {
    const zebra = i % 2 ? " zebra" : "";
    const id = productId(row);
    const cells = cols.map(col => `<td data-key="${col.key}"${cellClass(col)}>${cellHtml(row, col.key)}</td>`).join("");
    return `<tr class="row${zebra}" data-id="${id}">${cells}` +
      `<td class="compare-col"><button class="compare-button" data-id="${id}"></button></td>` +
      `<td class="details-col"><button class="expand-button" aria-expanded="false" aria-label="Show details for ${escapeHtml(productName(row))}"><span class="caret" aria-hidden="true">›</span></button></td></tr>` +
      `<tr class="details${zebra}" hidden><td colspan="${cols.length + 2}"></td></tr>`;
  }).join("");

  tableWrap.innerHTML = `<table class="catalog"><thead><tr>${headers}` +
    `<th scope="col" class="compare-col" style="width:${COMPARE_COL_WIDTH}px"><span class="visually-hidden">Compare</span></th>` +
    `<th scope="col" class="details-col" style="width:${DETAILS_COL_WIDTH}px"><span class="visually-hidden">Details</span></th>` +
    `</tr></thead><tbody>${rows}</tbody></table>`;
  tableWrap.querySelectorAll(".compare-button").forEach(updateCompareButton);
}

// ---- Row details ----

function detailsHtml(row) {
  const specs = [
    ["Full name", row.full_name],
    ["Released", row.release_year],
    ["Discontinued", row.discontinued_year],
    ["Status", row.status],
    ["Category", row.category],
    ["Design", row.design],
    ["Fit", row.fit || "Over-Ear"],
    ["Driver type", row.driver_type],
    ["Driver size", row.driver_size_mm, " mm"],
    ["Impedance", row.impedance_ohms, " Ω"],
    ["Sensitivity", row.sensitivity_db, " dB"],
    ["Wireless", row.wireless],
    ["Active noise cancelling", row.anc],
    ["Weight", row.weight_g, " g"],
    ["Launch price", row.msrp_usd && formatPrice(row.msrp_usd)],
    ["Connector", row.connector_type],
    ["Detachable cable", row.detachable_cable],
    ["Sound signature", row.sound_signature],
  ].filter(([, value]) => value)
   .map(([label, value, unit = ""]) => `<div><dt>${escapeHtml(label)}</dt><dd>${escapeHtml(value)}${unit}</dd></div>`);

  const reviewSearch = encodeURIComponent(`${productName(row)} headphone review measurements`);
  return `<div class="details-panel">
    <dl class="spec-list">${specs.join("")}</dl>
    ${row.notes ? `<p class="details-notes">${escapeHtml(row.notes)}</p>` : ""}
    ${lineageHtml(row)}
    <p class="details-links"><a href="https://duckduckgo.com/?q=${reviewSearch}" target="_blank" rel="noopener">Find reviews &amp; measurements &rarr;</a></p>
  </div>`;
}

// Follows predecessor links back to the first model, then successor links forward.
function lineageHtml(row) {
  const byProductId = productId => state.rows.find(other => other.product_id === productId);
  const walk = (start, linkKey) => {
    const found = [], seen = new Set();
    for (let next = start; next && !seen.has(next); ) {
      seen.add(next);
      const product = byProductId(next);
      if (!product) break;
      found.push(product);
      next = product[linkKey];
    }
    return found;
  };
  const chain = [...walk(row.predecessor, "predecessor").reverse(), row, ...walk(row.successor, "successor")];
  if (chain.length < 2) return "";

  const nodes = chain.map(product => {
    const year = product.release_year || "";
    const kind = product.product_id === row.product_id ? "current" : "other";
    return `<span class="lineage-node ${kind}" data-id="${productId(product)}" title="${escapeHtml(productName(product) + (year ? ` (${year})` : ""))}">` +
      `<span class="lineage-name">${escapeHtml(product.model_name)}</span>` +
      (year ? `<span class="lineage-year">${escapeHtml(year)}</span>` : "") + `</span>`;
  });
  return `<div class="lineage"><div class="lineage-label">Lineage</div>` +
    `<div class="lineage-chain">${nodes.join('<span class="lineage-arrow">→</span>')}</div></div>`;
}

// The details panel is built the first time a row opens, not for every row up front.
function toggleDetails(rowElement) {
  const detailsRow = rowElement.nextElementSibling;
  const opening = detailsRow.hidden;
  if (opening && !detailsRow.firstElementChild.innerHTML) {
    const row = state.rows.find(product => productId(product) === +rowElement.dataset.id);
    detailsRow.firstElementChild.innerHTML = detailsHtml(row);
  }
  detailsRow.hidden = !opening;
  rowElement.classList.toggle("expanded", opening);
  rowElement.querySelector(".expand-button").setAttribute("aria-expanded", String(opening));
}

// Clicking another model in a lineage chain jumps to its row, clearing filters if they hide it.
function jumpToProduct(id) {
  const findRow = () => tableWrap.querySelector(`tr.row[data-id="${id}"]`);
  if (!findRow()) resetFilters();
  const target = findRow();
  if (!target) return;
  tableWrap.querySelectorAll("tr.row.expanded").forEach(toggleDetails);
  target.scrollIntoView({ behavior: "smooth", block: "center" });
  setTimeout(() => toggleDetails(target), 300);
}

// brand.html links here with ?focus=ID. Scroll to that row and open it, then tidy the URL.
function openFocusedProduct() {
  const params = new URLSearchParams(location.search);
  const focusId = params.get("focus");
  if (!focusId) return;
  params.delete("focus");
  history.replaceState(null, "", params.toString() ? `${location.pathname}?${params}` : location.pathname);

  requestAnimationFrame(() => {
    const target = tableWrap.querySelector(`tr.row[data-id="${focusId}"]`);
    if (!target) return;
    target.scrollIntoView({ behavior: "smooth", block: "center" });
    target.style.outline = "2px solid var(--accent)";
    setTimeout(() => {
      target.style.outline = "";
      toggleDetails(target);
    }, 600);
  });
}

// ---- Compare ----

function readCompareFromUrl() {
  const ids = (new URLSearchParams(location.search).get("compare") || "").split(",")
    .map(id => parseInt(id, 10)).filter(id => id > 0);
  ids.slice(0, MAX_COMPARE).forEach(id => compareIds.add(id));
}

function writeCompareToUrl() {
  const params = new URLSearchParams(location.search);
  if (compareIds.size) params.set("compare", [...compareIds].join(","));
  else params.delete("compare");
  history.replaceState(null, "", params.toString() ? `${location.pathname}?${params}` : location.pathname);
}

function updateCompareButton(button) {
  const selected = compareIds.has(+button.dataset.id);
  const full = !selected && compareIds.size >= MAX_COMPARE;
  button.classList.toggle("selected", selected);
  button.setAttribute("aria-pressed", String(selected));
  button.disabled = full;
  button.title = selected ? "Remove from comparison" : full ? `Maximum ${MAX_COMPARE} selected` : "Add to comparison";
}

function setCompare(ids) {
  compareIds.clear();
  ids.forEach(id => compareIds.add(id));
  writeCompareToUrl();
  renderCompareBar();
  tableWrap.querySelectorAll(".compare-button").forEach(updateCompareButton);
}

function toggleCompare(id) {
  if (compareIds.has(id)) setCompare([...compareIds].filter(other => other !== id));
  else if (compareIds.size < MAX_COMPARE) setCompare([...compareIds, id]);
}

const findProduct = id => state.rows.find(row => productId(row) === id);

function renderCompareBar() {
  byId("compareBar").hidden = compareIds.size === 0;
  byId("compareOpen").disabled = compareIds.size < 2;
  byId("compareOpen").title = compareIds.size < 2 ? "Pick at least 2 headphones" : "";
  byId("compareSlots").innerHTML = [...compareIds].map(id => {
    const row = findProduct(id);
    const label = row ? productName(row) : `#${id}`;
    return `<span class="compare-slot">${escapeHtml(label)}<button aria-label="Remove ${escapeHtml(label)}" data-id="${id}">&times;</button></span>`;
  }).join("");
}

const COMPARE_FIELDS = [
  { label: "Brand", value: row => row._brand },
  { label: "Full name", value: row => row.full_name },
  { label: "Released", value: row => row.release_year },
  { label: "Status", value: row => row.status },
  { label: "Design", value: row => row.design },
  { label: "Fit", value: row => row.fit },
  { label: "Driver type", value: row => row.driver_type },
  { label: "Driver size", value: row => row.driver_size_mm, unit: " mm" },
  { label: "Impedance", value: row => row.impedance_ohms, unit: " Ω" },
  { label: "Sensitivity", value: row => row.sensitivity_db, unit: " dB" },
  { label: "Wireless", value: row => row.wireless },
  { label: "ANC", value: row => row.anc },
  { label: "Weight", value: row => row.weight_g, unit: " g" },
  { label: "Launch price", value: row => row.msrp_usd && formatPrice(row.msrp_usd) },
  { label: "Connector", value: row => row.connector_type },
  { label: "Detachable", value: row => row.detachable_cable },
  { label: "Sound signature", value: row => row.sound_signature },
  { label: "Predecessor", value: row => linkedName(row.predecessor) },
  { label: "Successor", value: row => linkedName(row.successor) },
  { label: "Notes", value: row => row.notes },
];

function linkedName(linkedProductId) {
  if (!linkedProductId) return "";
  const row = state.rows.find(product => product.product_id === linkedProductId);
  return row ? productName(row) : linkedProductId;
}

// Values that match across every model are muted, ones that differ are highlighted.
function openCompare() {
  const selected = [...compareIds].map(findProduct).filter(Boolean);
  if (selected.length < 2) return;

  const headRow = selected.map(row =>
    `<td><div class="compare-brand">${escapeHtml(row._brand)}</div><div class="compare-model">${escapeHtml(row.model_name)}</div></td>`
  ).join("");
  const bodyRows = COMPARE_FIELDS.map(field => {
    const values = selected.map(row => String(field.value(row) ?? ""));
    const filled = values.filter(Boolean);
    if (!filled.length) return "";
    const matchClass = filled.length < 2 ? "" : filled.every(value => value === filled[0]) ? "same" : "differs";
    const cells = values.map(value => value
      ? `<td class="${matchClass}">${escapeHtml(value)}${field.unit ? escapeHtml(field.unit) : ""}</td>`
      : `<td class="missing">—</td>`).join("");
    return `<tr><th>${escapeHtml(field.label)}</th>${cells}</tr>`;
  }).join("");
  byId("compareBody").innerHTML = `<table class="compare-table"><thead><tr><th></th>${headRow}</tr></thead><tbody>${bodyRows}</tbody></table>`;

  const shareUrl = `${location.origin}${location.pathname}?compare=${[...compareIds].join(",")}`;
  byId("compareShareLink").href = shareUrl;
  byId("compareShareLink").textContent = shareUrl;
  byId("compareDialog").hidden = false;
  byId("compareClose").focus();
}

const closeCompare = () => byId("compareDialog").hidden = true;

// ---- Export ----

const EXPORT_COLUMNS = [
  ["Brand", "_brand"], ["Model", "model_name"], ["Full Name", "full_name"], ["Year", "release_year"],
  ["Status", "status"], ["Design", "design"], ["Fit", "fit"], ["Driver Type", "driver_type"],
  ["Driver Size (mm)", "driver_size_mm"], ["Impedance (Ω)", "impedance_ohms"],
  ["Sensitivity (dB)", "sensitivity_db"], ["Wireless", "wireless"], ["ANC", "anc"],
  ["MSRP (USD)", "msrp_usd"], ["Notes", "notes"],
];

// Downloads the current filtered and sorted rows.
function exportCsv() {
  const csvCell = value => {
    const text = String(value ?? "");
    return /[",\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
  };
  const lines = [
    EXPORT_COLUMNS.map(([label]) => label).join(","),
    ...state.filtered.map(row => EXPORT_COLUMNS.map(([, key]) => csvCell(row[key])).join(",")),
  ];
  const url = URL.createObjectURL(new Blob([lines.join("\r\n")], { type: "text/csv;charset=utf-8;" }));
  const link = document.createElement("a");
  link.href = url;
  link.download = `headphone-archive-${state.filtered.length}-results.csv`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}

// ---- Menus ----

function buildColumnMenu() {
  byId("columnCheckboxes").innerHTML = COLUMNS.map(col =>
    `<label><input type="checkbox" data-key="${col.key}"${state.visible[col.key] ? " checked" : ""}> ${col.label}</label>`
  ).join("");
}

// A button that opens a panel, closed again by clicking elsewhere or pressing Escape.
function setUpPopover(toggle, panel) {
  const setOpen = open => {
    panel.classList.toggle("open", open);
    toggle.setAttribute("aria-expanded", String(open));
  };
  toggle.addEventListener("click", event => {
    event.stopPropagation();
    setOpen(!panel.classList.contains("open"));
  });
  document.addEventListener("click", event => {
    if (!panel.contains(event.target) && !toggle.contains(event.target)) setOpen(false);
  });
  document.addEventListener("keydown", event => { if (event.key === "Escape") setOpen(false); });
}

// ---- Events ----

tableWrap.addEventListener("mousedown", event => {
  const handle = event.target.closest(".resizer");
  const header = event.target.closest("th[data-key]");
  if (handle) startResize(event, handle.dataset.key);
  else if (header) startReorder(event, header.dataset.key);
});

tableWrap.addEventListener("click", event => {
  const target = event.target;
  if (target.closest(".resizer")) return;
  const header = target.closest("th[data-key]");
  if (header) {
    if (ignoreNextHeaderClick) ignoreNextHeaderClick = false;
    else sortBy(header.dataset.key);
    return;
  }
  const compareButton = target.closest(".compare-button");
  if (compareButton) return toggleCompare(+compareButton.dataset.id);
  const lineageNode = target.closest(".lineage-node.other");
  if (lineageNode) return jumpToProduct(lineageNode.dataset.id);
  const row = target.closest("tr.row");
  if (row && !target.closest("a")) toggleDetails(row);
});

tableWrap.addEventListener("keydown", event => {
  const header = event.target.closest("th[data-key]");
  if (header && (event.key === "Enter" || event.key === " ")) {
    event.preventDefault();
    sortBy(header.dataset.key);
  }
});

FILTER_IDS.forEach(id => byId(id).addEventListener("input", applyFilters));
byId("resetFilters").addEventListener("click", resetFilters);
byId("exportButton").addEventListener("click", exportCsv);
byId("columnCheckboxes").addEventListener("change", event => {
  state.visible[event.target.dataset.key] = event.target.checked;
  save(STORAGE_KEYS.visible, state.visible);
  renderTable();
});
setUpPopover(byId("filterToggle"), byId("filterPanel"));
setUpPopover(byId("columnsToggle"), byId("columnMenu"));

byId("compareSlots").addEventListener("click", event => {
  const button = event.target.closest("button[data-id]");
  if (button) toggleCompare(+button.dataset.id);
});
byId("compareOpen").addEventListener("click", openCompare);
byId("compareClear").addEventListener("click", () => setCompare([]));
byId("compareClose").addEventListener("click", closeCompare);
byId("compareDialog").addEventListener("click", event => { if (event.target.id === "compareDialog") closeCompare(); });
document.addEventListener("keydown", event => { if (event.key === "Escape") closeCompare(); });

let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { applyFlexibleWidths(); fitTableHeight(); }, 100);
});
document.fonts?.ready.then(fitTableHeight);

// ---- Start ----

loadColumnSettings();
buildColumnMenu();
readCompareFromUrl();
fitTableHeight();
load();
</script>
</body>
</html>
