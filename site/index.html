<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Headphone Archive</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,400&family=Spline+Sans+Mono:wght@400;500;600&display=swap');

  /* ---- Design tokens ----
     CSS custom properties for the neon-noir palette (paper/ink/amber accents), fonts, and
     spacing. Centralising them here means the whole site re-themes from this one block. */
  :root {
    --ink: #1a1714;
    --paper: #f4f0e8;
    --paper-2: #eae3d6;
    --accent: #c2410c;
    --accent-2: #1e3a2f;
    --line: #d6cdbd;
    --muted: #8a8071;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: var(--paper); }

  /* ---- Base layout: body, header, controls ----
     Page-level typography and the sticky header that holds the title, stat bar, and filter
     controls. The controls use a responsive CSS grid reflowed by the media queries below. */
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Spline Sans Mono', monospace;
    line-height: 1.5;
  }

  header {
    border-bottom: 2px solid var(--ink);
    padding: 2.5rem 2rem 1.5rem;
    max-width: 1300px;
    margin: 0 auto;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 1rem;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: clamp(2.4rem, 13vw, 4.5rem);
    line-height: 0.92;
    letter-spacing: -0.02em;
  }
  h1 em { font-style: italic; color: var(--accent); }

  .tagline {
    text-align: right;
    font-size: 0.78rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    width: 100%;
  }

  .stats-bar {
    max-width: 1300px;
    margin: 0 auto;
    padding: 0.75rem 2rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
    font-size: 0.8rem;
    border-bottom: 1px solid var(--line);
    color: var(--accent-2);
  }
  #statnums { display: flex; gap: 2rem; flex-wrap: wrap; align-items: center; }
  .suggest-btn {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--paper);
    background: var(--accent);
    padding: 0.45rem 0.95rem;
    text-decoration: none;
    border-radius: 99px;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .suggest-btn:hover { background: var(--accent-2); }
  .brands-btn {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--paper);
    background: var(--accent-2);
    padding: 0.45rem 0.95rem;
    text-decoration: none;
    border-radius: 99px;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .brands-btn:hover { background: #152b22; }
  .stats-bar strong { font-weight: 600; }

  /* The filter grid is now a popover anchored to the toolbar's own left edge (not the
     Filters button's position, which can sit far enough right that a wide panel would
     overflow the viewport) instead of an always-open row, so it costs nothing in the
     page's default vertical layout — only .toolbar's own single row does. */
  .controls {
    position: absolute;
    top: calc(100% + 0.5rem);
    left: var(--pad);
    z-index: 25;
    display: none;
    grid-template-columns: repeat(5, 1fr);
    gap: 0.6rem;
    background: var(--paper);
    border: 1px solid var(--ink);
    box-shadow: 4px 4px 0 rgba(26,23,20,0.12);
    padding: 1rem;
    width: max(600px, 40vw);
    max-width: calc(100vw - 2 * var(--pad));
  }
  .controls.open { display: grid; }
  .controls .field { min-width: 0; }

  .field label {
    display: block;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 0.3rem;
  }
  input, select {
    width: 100%;
    padding: 0.6rem 0.7rem;
    border: 1px solid var(--ink);
    background: var(--paper);
    font-family: inherit;
    font-size: 0.9rem;
    color: var(--ink);
    border-radius: 0;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  /* ---- Toolbar ----
     One compact row combining search, the Filters popover trigger, the result count, and
     the export/columns/reset actions — replaces the old separate filter-grid row and
     .resultmeta row so the page's default chrome is a single thin strip. */
  .toolbar {
    position: relative;
    max-width: 1400px;
    margin: 0 auto;
    padding: 1rem var(--pad);
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .searchfield { width: min(280px, 100%); }
  .filter-toggle {
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: none; border: 1px solid var(--ink); font-family: inherit;
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em;
    padding: 0.62rem 0.9rem; cursor: pointer; color: var(--ink);
    border-radius: 4px;
  }
  .filter-toggle:hover { background: var(--paper-2); }
  .filter-count {
    background: var(--accent); color: var(--paper); border-radius: 99px;
    font-size: 0.62rem; line-height: 1; padding: 0.22rem 0.4rem;
  }
  .resultcount { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }

  main { max-width: 1300px; margin: 0 auto; padding: 0 2rem; }
  .meta-actions { display: flex; gap: 1.25rem; align-items: center; }
  .linkbtn {
    background: none; border: none; font-family: inherit; cursor: pointer;
    color: var(--accent-2); font-size: 0.75rem; text-transform: uppercase;
    letter-spacing: 0.1em; text-decoration: underline; text-underline-offset: 3px;
    padding: 0;
  }
  .linkbtn:hover { color: var(--accent); }

  /* Columns panel */
  /* ---- Column show/hide menu ----
     The popover listing each column as a checkbox. .colmenu is absolutely positioned under
     its toggle button and only displayed when .open is present. */
  .colpanel {
    position: relative;
    display: inline-block;
  }
  .colmenu {
    position: absolute;
    right: 0;
    top: 1.8rem;
    z-index: 20;
    background: var(--paper);
    border: 1px solid var(--ink);
    box-shadow: 4px 4px 0 rgba(26,23,20,0.12);
    padding: 0.85rem 1rem;
    min-width: 220px;
    display: none;
  }
  .colmenu.open { display: block; }
  .colmenu h4 {
    font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--muted); margin-bottom: 0.6rem; font-weight: 600;
  }
  .colmenu label {
    display: flex; align-items: center; gap: 0.55rem;
    font-size: 0.82rem; padding: 0.28rem 0; cursor: pointer;
    text-transform: none; letter-spacing: 0; color: var(--ink);
  }
  .colmenu input[type=checkbox] {
    width: auto; margin: 0; accent-color: var(--accent);
    border-radius: 0; cursor: pointer;
  }

  /* Table layout, header, resizer, cell, and sort-indicator rules live in the
     "Table (desktop)" block further down. Only the rules unique to this spot remain here. */
  thead th { position: relative; }            /* positioning context for .resizer */
  tbody tr { border-bottom: 1px solid var(--line); transition: background 0.12s; }

  .model-name { font-family: 'Fraunces', serif; font-size: 1.02rem; font-weight: 600; }
  .brand { color: var(--accent-2); font-weight: 500; }
  .year { font-variant-numeric: tabular-nums; }
  .spec { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .spec.empty { color: var(--line); }

  /* ---- Status tags & wireless/ANC flags ----
     Pill-style badges in the Status column (active vs discontinued get different accents)
     and the compact WL/ANC text flags. Kept small so they don't crowd the row. */
  .tag {
    display: inline-block;
    font-size: 0.68rem;
    padding: 0.1rem 0.45rem;
    border: 1px solid var(--line);
    border-radius: 99px;
    white-space: nowrap;
  }
  .tag.disc { color: var(--muted); }
  .tag.active { border-color: var(--accent-2); color: var(--accent-2); }
  .flags { font-size: 0.7rem; color: var(--accent); letter-spacing: 0.05em; }

  .loading, .empty {
    text-align: center;
    padding: 4rem 1rem;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .loading::after {
    content: '';
    display: block;
    width: 28px; height: 28px;
    margin: 1rem auto 0;
    border: 2px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer {
    max-width: 1300px; margin: 0 auto; padding: 2rem;
    border-top: 1px solid var(--line);
    font-size: 0.72rem; color: var(--muted);
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 1rem;
  }
  footer a { color: var(--accent-2); }

  /* Zebra striping (subtle) */
  tbody tr.datarow.zebra { background: #ece4d4; }
  tbody tr.datarow { cursor: pointer; }
  tbody tr.datarow:hover { background: var(--paper-2); }

  /* Expand caret + detail panel */
  .caretcol { width: 2rem; text-align: center; }
  .expandbtn { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 1.1rem; line-height: 1; padding: 0.2rem 0.4rem; }
  .caret { display: inline-block; transition: transform 0.15s ease; }
  tr.datarow.expanded .caret { transform: rotate(90deg); color: var(--accent); }
  tr.detailrow > td { padding: 0; border-bottom: 1px solid var(--line); }
  tr.detailrow.zebra > td { background: #ece4d4; }
  /* ---- Expanded row detail panel ----
     The drawer revealed when a row is clicked: a responsive grid of every spec plus notes
     and review links. The amber left border ties it visually to its parent row. */
  .detailwrap { padding: 1.1rem 1.4rem; border-left: 3px solid var(--accent); }
  .detail-specs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.6rem 1.5rem; margin: 0; }
  .detail-specs dt { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
  .detail-specs dd { font-size: 0.88rem; font-variant-numeric: tabular-nums; }
  .detail-notes { margin-top: 0.9rem; font-size: 0.84rem; color: var(--ink); }
  .detail-links { margin-top: 0.9rem; font-size: 0.82rem; }
  .detail-links a { color: var(--accent-2); }

  /* Accessibility */
  .vh { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .skip-link { position: absolute; left: -999px; top: 0; background: var(--ink); color: var(--paper); padding: 0.6rem 1rem; z-index: 100; }
  .skip-link:focus { left: 0; }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible,
  th[role="button"]:focus-visible, .expandbtn:focus-visible, .cmpbtn:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  /* Compare button in each row */
  .cmpcol { width: 2rem; text-align: center; }
  .cmpbtn { background: none; border: 1px solid var(--line); color: var(--muted);
    line-height: 1; width: 22px; height: 22px; border-radius: 4px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; padding: 0; transition: all 0.1s; }
  .cmpbtn::before { content: "+"; font-size: 1rem; }
  .cmpbtn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .cmpbtn--on { background: var(--accent); border-color: var(--accent); color: var(--paper); }
  .cmpbtn--on::before { content: "+"; }
  .cmpbtn--on:hover:not(:disabled)::before { content: "\2212"; color: var(--paper-2); }
  .cmpbtn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* Compare bar */
  .cmpbar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--ink); color: var(--paper);
    display: flex; align-items: center; gap: 1rem; padding: 0.8rem 1.5rem;
    box-shadow: 0 -4px 20px rgba(26,23,20,0.3); z-index: 40;
    transform: translateY(0); transition: transform 0.2s ease; }
  .cmpbar[hidden] { display: none; }
  .cmpbar-slots { display: flex; gap: 0.6rem; flex: 1; flex-wrap: wrap; }
  .cmpbar-slot { display: flex; align-items: center; gap: 0.4rem; background: rgba(255,255,255,0.1);
    border-radius: 99px; padding: 0.25rem 0.7rem; font-size: 0.78rem; white-space: nowrap; }
  .cmpbar-slot button { background: none; border: none; color: inherit; cursor: pointer;
    font-size: 1rem; line-height: 1; padding: 0; opacity: 0.7; }
  .cmpbar-slot button:hover { opacity: 1; }
  .cmpbar-btn { background: var(--accent); color: var(--paper); border: none; cursor: pointer;
    font-family: inherit; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em;
    padding: 0.6rem 1.2rem; border-radius: 99px; white-space: nowrap; }
  .cmpbar-btn:hover { background: var(--accent-2); }
  .cmpbar-clear { color: rgba(255,255,255,0.6); font-size: 0.72rem; }
  .cmpbar-clear:hover { color: var(--paper); }

  /* Compare modal */
  /* ---- Compare modal ----
     Full-screen overlay that shows 2-3 selected headphones side by side. Hidden by default
     via the [hidden] attribute and switched to a flex layout only when opened. */
  #cmpOverlay { align-items: flex-start; justify-content: center; padding: 2rem 1rem; overflow-y: auto; }
  #cmpOverlay:not([hidden]) { display: flex; }
  .cmpmodal { background: var(--card); border: 1px solid var(--ink); border-radius: 12px;
    max-width: 960px; width: 100%; padding: 0; overflow: hidden; }
  .cmpmodal-head { display: flex; justify-content: space-between; align-items: center;
    padding: 1.2rem 1.5rem; border-bottom: 2px solid var(--ink); }
  .cmpmodal-head h2 { font-family: 'Fraunces', serif; font-size: 1.4rem; }
  .cmpclose { background: none; border: none; cursor: pointer; font-size: 1.5rem;
    color: var(--muted); line-height: 1; padding: 0.2rem; }
  .cmpclose:hover { color: var(--ink); }
  .cmpmodal-body { overflow-x: auto; }
  .cmpmodal-hint { font-size: 0.76rem; color: var(--muted); padding: 0.8rem 1.5rem;
    border-top: 1px solid var(--line); }
  .cmpmodal-hint a { color: var(--accent-2); word-break: break-all; }

  /* Comparison table */
  .cmptable { border-collapse: collapse; width: 100%; table-layout: fixed; }
  .cmptable th, .cmptable td { padding: 0.65rem 1rem; text-align: left;
    border-bottom: 1px solid var(--line); vertical-align: top; }
  .cmptable th { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted); width: 140px; background: var(--paper-2); }
  .cmptable td { font-size: 0.88rem; background: var(--paper); }
  .cmptable tbody tr:nth-child(even) td { background: #ece4d4; }
  .cmptable .cmp-label { font-family: 'Fraunces', serif; font-size: 1rem; font-weight: 600; }
  .cmptable .cmp-brand { font-size: 0.72rem; color: var(--muted); }
  .cmptable .cmp-diff { color: var(--accent); font-weight: 500; }
  .cmptable .cmp-same { color: var(--muted); }
  .cmptable .cmp-empty { color: var(--line); font-style: italic; }
  /* ---- Accessibility & responsive ----
     Honours reduced-motion preferences and reflows the layout for tablet/phone widths.
     The small-screen rules also bump input font-size to 16px to stop iOS auto-zoom. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
  /* ── Variables & base ────────────────────────────────── */
  :root { --pad: clamp(1rem, 3vw, 2rem); }

  h1 { font-family: 'Fraunces', serif; font-weight: 900;
    font-size: clamp(2.4rem, 13vw, 4.5rem); line-height: 0.92; letter-spacing: -0.02em; }
  h1 em { font-style: italic; color: var(--accent); }

  .tagline { text-align: right; font-size: 0.78rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.15em; width: 100%; }

  /* ── Page structure ──────────────────────────────────── */
  /* All sections share the same max-width and side padding */
  .stats-bar, main, footer {
    max-width: 1400px; margin: 0 auto;
  }
  .stats-bar {
    padding: 0.75rem var(--pad);
    display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
    font-size: 0.8rem; border-bottom: 1px solid var(--line); color: var(--accent-2);
  }
  #statnums { display: flex; gap: 1.5rem; flex-wrap: wrap; align-items: center; }

  /* ── Toolbar (search, filters popover, result count, actions) ──── */
  .toolbar {
    position: relative;
    max-width: 1400px; margin: 0 auto; padding: 1rem var(--pad);
    display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
  }
  .searchfield { width: min(280px, 100%); }
  .filter-toggle {
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: none; border: 1px solid var(--ink); font-family: inherit;
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em;
    padding: 0.62rem 0.9rem; cursor: pointer; color: var(--ink);
    border-radius: 4px;
  }
  .filter-toggle:hover { background: var(--paper-2); }
  .filter-count {
    background: var(--accent); color: var(--paper); border-radius: 99px;
    font-size: 0.62rem; line-height: 1; padding: 0.22rem 0.4rem;
  }
  .resultcount { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }

  /* ── Controls / filters popover ──────────────────────── */
  .controls {
    position: absolute; top: calc(100% + 0.5rem); left: var(--pad); z-index: 25;
    display: none;
    grid-template-columns: repeat(5, 1fr);
    gap: 0.6rem;
    background: var(--paper); border: 1px solid var(--ink);
    box-shadow: 4px 4px 0 rgba(26,23,20,0.12);
    padding: 1rem;
    width: max(600px, 40vw);
    max-width: calc(100vw - 2 * var(--pad));
  }
  .controls.open { display: grid; }
  .controls .field { min-width: 0; }
  @media (max-width: 700px) {
    .controls { grid-template-columns: 1fr 1fr; width: max(90vw, 320px); }
  }

  .field label { display: block; font-size: 0.65rem; text-transform: uppercase;
    letter-spacing: 0.12em; color: var(--muted); margin-bottom: 0.3rem; }
  input, select { width: 100%; padding: 0.6rem 0.7rem; border: 1px solid var(--ink);
    background: var(--paper); font-family: inherit; font-size: 0.9rem;
    color: var(--ink); border-radius: 0; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  @media (max-width: 600px) { input, select { font-size: 1rem; } } /* prevent iOS zoom */

  /* ── Main + table ────────────────────────────────────── */
  main { padding: 0; }

  .meta-actions { display: flex; gap: 1.25rem; align-items: center; margin-left: auto; }
  .linkbtn { background: none; border: none; font-family: inherit; cursor: pointer;
    color: var(--accent-2); font-size: 0.75rem; text-transform: uppercase;
    letter-spacing: 0.1em; text-decoration: underline; text-underline-offset: 3px; padding: 0; }
  .linkbtn:hover { color: var(--accent); }

  /* Columns panel */
  .colpanel { position: relative; display: inline-block; }
  .colmenu { position: absolute; right: 0; top: 1.8rem; z-index: 20;
    background: var(--paper); border: 1px solid var(--ink);
    box-shadow: 4px 4px 0 rgba(26,23,20,0.12); padding: 0.85rem 1rem;
    min-width: 220px; display: none; }
  .colmenu.open { display: block; }
  .colmenu h4 { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--muted); margin-bottom: 0.6rem; font-weight: 600; }
  .colmenu label { display: flex; align-items: center; gap: 0.55rem;
    font-size: 0.82rem; padding: 0.28rem 0; cursor: pointer;
    text-transform: none; letter-spacing: 0; color: var(--ink); }
  .colmenu input[type=checkbox] { width: auto; margin: 0;
    accent-color: var(--accent); border-radius: 0; cursor: pointer; }

  /* ── Table (desktop) ─────────────────────────────────── */
  /* ---- Table (desktop) ----
     The authoritative table styling: full-width fixed layout, sticky header, resizer handles,
     and sort indicators. The auto-fit rules let columns fill the container without overflow. */
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  #tablewrap {
    overflow-x: hidden;
    overflow-y: auto;
    max-height: calc(100vh - 230px);
    background: var(--paper);
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }
  table.autofit { width: 100%; table-layout: fixed; }
  table.autofit td { overflow: hidden; text-overflow: ellipsis; }
  table.autofit th { overflow: hidden; text-overflow: clip; }
  thead th { position: sticky; top: 0; z-index: 10; background: var(--paper-2);
    text-align: left; font-size: 0.65rem; text-transform: uppercase;
    letter-spacing: 0.12em; color: var(--muted); padding: 0.5rem 0.6rem;
    border-bottom: 2px solid var(--ink); cursor: pointer; user-select: none; white-space: nowrap; }
  thead th:hover { color: var(--accent); }
  thead th > span:first-child { display: inline-block; max-width: calc(100% - 10px);
    overflow: hidden; text-overflow: clip; vertical-align: bottom; }
  thead th[aria-sort="ascending"], thead th[aria-sort="descending"] { color: var(--accent); border-bottom: 3px solid var(--accent); }
  tbody tr:hover { background: var(--paper-2); }
  tbody td { padding: 0.7rem 0.6rem; font-size: 0.86rem; vertical-align: top;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  tbody tr.datarow { background: var(--paper); cursor: pointer; }
  tbody tr.datarow.zebra { background: #ece4d4; }
  tbody tr.datarow:hover, tbody tr.datarow.zebra:hover { background: #d6cebc; }

  .resizer { position: absolute; top: 0; right: 0; width: 9px; height: 100%;
    cursor: col-resize; user-select: none; }
  .resizer::before { content: ""; position: absolute; right: 0; top: 25%;
    height: 50%; width: 1px; background: var(--line); }
  .resizer:hover::before { right: 0; top: 0; height: 100%; width: 2px; background: var(--accent); }

  .model-name { font-family: 'Fraunces', serif; font-size: 1.02rem; font-weight: 600; }
  .brand { color: var(--accent-2); font-weight: 500; text-decoration: none; }
  .brand:hover { color: var(--accent); text-decoration: underline; }
  .year { font-variant-numeric: tabular-nums; }
  .spec { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .spec.empty { color: var(--line); }
  .tag { display: inline-block; font-size: 0.68rem; padding: 0.1rem 0.45rem;
    border: 1px solid var(--line); border-radius: 99px; white-space: nowrap; }
  .tag.disc { color: var(--muted); }
  .tag.active { border-color: var(--accent-2); color: var(--accent-2); }
  .flags { font-size: 0.7rem; color: var(--accent); letter-spacing: 0.05em; }

  /* ── Mobile card layout ──────────────────────────────── */
  @media (max-width: 600px) {
    /* Unlock the table for card transformation */
    #tablewrap { overflow-x: hidden; max-height: none; border: none; }
    table, tbody { display: block; }
    thead { display: none; }

    /* Each row becomes a card */
    tr.datarow {
      display: grid;
      /* Year and design each get their own column (auto / 1fr) rather than sharing one
         "meta" area — two grid items placed in the same named area stack on top of each
         other instead of flowing side by side, which is what "auto auto" here fixes. */
      grid-template-columns: auto 1fr auto auto;
      grid-template-areas: "brand  brand  cmp caret" "model  model  cmp caret" "year design cmp caret";
      gap: 0 0.4rem;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      margin: 0.5rem var(--pad);
      padding: 0.75rem;
      background: var(--paper);
      cursor: pointer;
    }
    tr.datarow.zebra { background: #ece4d4; }
    tr.datarow:hover { background: var(--paper-2); }

    /* Hide all cells by default; show only the ones we name */
    tr.datarow td { display: none; padding: 0; border: none;
      white-space: normal; overflow: visible; text-overflow: unset; }

    /* Prefixed with `tr.datarow` (rather than the bare `td[data-key=...]`) so these
       beat the "hide all cells" rule above on specificity — a plain attribute selector
       is less specific than tr.datarow td and was silently losing to display:none. */
    tr.datarow td[data-key="_brand"]    { display: block; grid-area: brand;
      font-size: 0.68rem; color: var(--muted); margin-bottom: 0.1rem; }
    tr.datarow td[data-key="model_name"]{ display: block; grid-area: model;
      font-size: 0.95rem; font-family: 'Fraunces', serif; font-weight: 600;
      line-height: 1.2; padding: 0.05rem 0; }
    /* Meta row: year + design, each in their own grid column so they sit side by side
       instead of overlapping (see the grid-template-areas comment above). */
    tr.datarow td[data-key="release_year"]{ display: inline; grid-area: year;
      font-size: 0.72rem; color: var(--muted); justify-self: start; }
    tr.datarow td[data-key="design"]    { display: inline; grid-area: design;
      font-size: 0.72rem; color: var(--muted); justify-self: start; }
    tr.datarow td[data-key="design"]::before { content: "\00b7"; margin-right: 0.3em; }
    tr.datarow td.cmpcol  { display: flex; grid-area: cmp;  align-items: center;
      justify-content: center; width: 28px; }
    tr.datarow td.caretcol{ display: flex; grid-area: caret; align-items: center;
      justify-content: center; width: 28px; }

    /* Detail row in card view — :not([hidden]) so the hidden attribute (which toggleDetail
       sets/clears) still wins; a bare `display: block` here would override it and force
       every row's detail panel permanently open. */
    tr.detailrow:not([hidden]) { display: block; }
    tr.detailrow > td { display: block; padding: 0; border: none;
      margin: -0.5rem var(--pad) 0.5rem; border-left: 3px solid var(--accent);
      background: var(--paper); border-radius: 0 0 8px 8px; }
    tr.detailrow.zebra > td { background: #ece4d4; }
    .detailwrap { padding: 0.9rem 1rem; border-left: none; }

    /* Simplify compare modal on mobile */
    .cmpmodal { border-radius: 0; max-height: 100vh; overflow-y: auto; }
    #cmpOverlay { padding: 0; align-items: flex-end; }
    .cmptable th { width: 90px; font-size: 0.55rem; }
    .cmptable td { font-size: 0.8rem; }

    /* Compare bar */
    .cmpbar { flex-wrap: wrap; gap: 0.5rem; padding: 0.75rem 1rem; }
    .cmpbar-slots { width: 100%; }
    .cmpbar-slot { font-size: 0.7rem; }
  }

  /* ── Expand / detail panel ───────────────────────────── */
  .caretcol { width: 2rem; text-align: center; }
  .expandbtn { background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 1.1rem; line-height: 1; padding: 0.2rem 0.4rem; }
  .caret { display: inline-block; transition: transform 0.15s ease; }
  tr.datarow.expanded .caret { transform: rotate(90deg); color: var(--accent); }
  tr.detailrow > td { padding: 0; border-bottom: 1px solid var(--line); }
  tr.detailrow.zebra > td { background: #ece4d4; }
  .detailwrap { padding: 1.1rem 1.4rem; border-left: 3px solid var(--accent); }
  .detail-specs { display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 0.6rem 1.5rem; margin: 0; }
  .detail-specs dt { font-size: 0.6rem; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--muted); }
  .detail-specs dd { font-size: 0.88rem; font-variant-numeric: tabular-nums;
    word-break: break-word; overflow-wrap: break-word; white-space: normal; }
  .detail-notes { margin-top: 0.9rem; font-size: 0.84rem; color: var(--ink);
    background: var(--paper); border: 1px solid var(--line);
    padding: 0.5rem 0.75rem; border-radius: 4px; }
  .detail-links { margin-top: 0.9rem; font-size: 0.82rem; }
  .detail-links a { color: var(--accent-2); }

  /* Lineage chain */
  .lineage-chain { margin-top: 1rem; }
  .ln-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--muted); margin-bottom: 0.5rem; }
  .ln-row { display: flex; align-items: center; flex-wrap: wrap; gap: 0.3rem; }
  .ln-arrow { color: var(--line); font-size: 0.9rem; padding: 0 0.1rem; }
  .ln-node { display: flex; flex-direction: column; align-items: center;
    padding: 0.35rem 0.65rem; border-radius: 4px; border: 1px solid var(--line);
    min-width: 80px; max-width: 140px; text-align: center; }
  .ln-current { background: var(--accent); border-color: var(--accent); color: var(--paper); }
  .ln-other { background: var(--paper-2); cursor: pointer; transition: border-color 0.12s; }
  .ln-other:hover { border-color: var(--accent); }
  .ln-name { font-size: 0.72rem; font-weight: 600; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
  .ln-year { font-size: 0.6rem; opacity: 0.75; margin-top: 0.1rem; }

  /* ── Misc ────────────────────────────────────────────── */
  .loading, .empty { text-align: center; padding: 4rem 1rem;
    color: var(--muted); font-size: 0.9rem; }
  .loading::after { content: ''; display: block; width: 28px; height: 28px;
    margin: 1rem auto 0; border: 2px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer { padding: 2rem var(--pad); border-top: 1px solid var(--line);
    font-size: 0.72rem; color: var(--muted);
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
  footer a { color: var(--accent-2); }

  /* ── Accessibility ───────────────────────────────────── */
  .vh { position: absolute; width: 1px; height: 1px; padding: 0;
    margin: -1px; overflow: hidden; clip: rect(0 0 0 0);
    white-space: nowrap; border: 0; }
  .skip-link { position: absolute; left: -999px; top: 0;
    background: var(--ink); color: var(--paper); padding: 0.6rem 1rem; z-index: 100; }
  .skip-link:focus { left: 0; }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible,
  th[role="button"]:focus-visible, .expandbtn:focus-visible, .cmpbtn:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ── Compare button ──────────────────────────────────── */
  .cmpcol { width: 2rem; text-align: center; }
  .cmpbtn { background: none; border: 1px solid var(--line); color: var(--muted);
    font-size: 1rem; line-height: 1; width: 22px; height: 22px; border-radius: 4px;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    padding: 0; transition: all 0.1s; }
  .cmpbtn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .cmpbtn--on { background: var(--accent); border-color: var(--accent); color: var(--paper); }
  .cmpbtn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* ── Compare bar ─────────────────────────────────────── */
  .cmpbar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--ink);
    color: var(--paper); display: flex; align-items: center; gap: 1rem;
    padding: 0.8rem 1.5rem; box-shadow: 0 -4px 20px rgba(26,23,20,0.3); z-index: 40; }
  .cmpbar[hidden] { display: none; }
  .cmpbar-slots { display: flex; gap: 0.6rem; flex: 1; flex-wrap: wrap; }
  .cmpbar-slot { display: flex; align-items: center; gap: 0.4rem;
    background: rgba(255,255,255,0.1); border-radius: 99px;
    padding: 0.25rem 0.7rem; font-size: 0.78rem; white-space: nowrap; }
  .cmpbar-slot button { background: none; border: none; color: inherit;
    cursor: pointer; font-size: 1rem; line-height: 1; padding: 0; opacity: 0.7; }
  .cmpbar-slot button:hover { opacity: 1; }
  .cmpbar-btn { background: var(--accent); color: var(--paper); border: none;
    cursor: pointer; font-family: inherit; font-size: 0.72rem;
    text-transform: uppercase; letter-spacing: 0.1em; padding: 0.6rem 1.2rem;
    border-radius: 99px; white-space: nowrap; }
  .cmpbar-btn:hover { background: var(--accent-2); }
  .cmpbar-clear { color: rgba(255,255,255,0.6); font-size: 0.72rem; }
  .cmpbar-clear:hover { color: var(--paper); }

  /* ── Compare modal ───────────────────────────────────── */
  #cmpOverlay { align-items: flex-start; justify-content: center;
    padding: 2rem 1rem; overflow-y: auto; }
  #cmpOverlay:not([hidden]) { display: flex; }
  .cmpmodal { background: var(--card); border: 1px solid var(--ink); border-radius: 12px;
    max-width: 960px; width: 100%; padding: 0; overflow: hidden; }
  .cmpmodal-head { display: flex; justify-content: space-between; align-items: center;
    padding: 1.2rem 1.5rem; border-bottom: 2px solid var(--ink); }
  .cmpmodal-head h2 { font-family: 'Fraunces', serif; font-size: 1.4rem; }
  .cmpclose { background: none; border: none; cursor: pointer; font-size: 1.5rem;
    color: var(--muted); line-height: 1; padding: 0.2rem; }
  .cmpclose:hover { color: var(--ink); }
  .cmpmodal-body { overflow-x: auto; }
  .cmpmodal-hint { font-size: 0.76rem; color: var(--muted); padding: 0.8rem 1.5rem;
    border-top: 1px solid var(--line); }
  .cmpmodal-hint a { color: var(--accent-2); word-break: break-all; }
  .cmptable { border-collapse: collapse; width: 100%; table-layout: fixed; }
  .cmptable th, .cmptable td { padding: 0.32rem 0.7rem; text-align: left;
    border-bottom: 1px solid var(--line); vertical-align: top; }
  .cmptable th { font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted); width: 120px; background: var(--paper-2); }
  .cmptable td { font-size: 0.82rem; background: var(--paper); }
  .cmptable tbody tr:nth-child(even) td { background: #ece4d4; }
  .cmptable .cmp-label { font-family: 'Fraunces', serif; font-size: 0.92rem; font-weight: 600; }
  .cmptable .cmp-brand { font-size: 0.68rem; color: var(--muted); }
  .cmptable .cmp-diff { color: var(--accent); font-weight: 500; }
  .cmptable .cmp-same { color: var(--muted); }
  .cmptable .cmp-empty { color: var(--line); font-style: italic; }
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to catalog</a>
<header>
  <div class="masthead">
    <h1>The Headphone <em>Archive</em></h1>

  </div>
</header>

<div class="stats-bar" id="statsbar">
  <span id="statnums">Loading catalog&hellip;</span>
  <div style="margin-left:auto;display:flex;gap:0.5rem;align-items:center;">
    <a class="brands-btn" href="brands.html">&#9674; All Brands</a>

<main id="main">

    </div>
    <button class="filter-toggle" id="filterToggle" aria-haspopup="true" aria-expanded="false" aria-controls="filtersGrid">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>

        <div class="field">
          <label for="driver">Driver</label>

</main>

<!-- Compare bar — slides up when headphones are selected -->

<!-- Compare modal -->

      <h2 id="cmpTitle">Compare Headphones</h2>
      <button class="cmpclose" id="cmpClose" aria-label="Close comparison">&times;</button>
    </div>
