<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — The Headphone Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Spline+Sans+Mono:wght@300..700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 32 32' xmlns='http://www.w3.org/2000/svg'%3E%3Crect x='2' y='2' width='28' height='28' rx='6' fill='%23c2410c'/%3E%3Cpath d='M9 19v-3a7 7 0 0 1 14 0v3' fill='none' stroke='%23f4f0e8' stroke-width='2.5'/%3E%3Crect x='7' y='18' width='5' height='8' rx='1.5' fill='%23f4f0e8'/%3E%3Crect x='20' y='18' width='5' height='8' rx='1.5' fill='%23f4f0e8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="shared.css">
<style>
  /* Everything admin lives on this one page, under /admin and /api/admin: the two paths
     Cloudflare Access protects. */

  /* ---- Header, tabs, buttons ---- */
  .admin-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.75rem;
    padding: 1.2rem var(--pad); border-bottom: 2px solid var(--ink); }
  .admin-title { font-family: 'Fraunces', serif; font-size: 1.5rem; font-weight: 700; }
  .admin-title span { display: block; font-family: 'Spline Sans Mono', monospace; font-size: 0.75rem; font-weight: 400;
    text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
  .header-links, .tabs { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .chip { padding: 0.3rem 0.75rem; background: none; border: 1px solid var(--line); border-radius: 99px; cursor: pointer;
    font-family: inherit; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--ink); text-decoration: none; transition: background 0.12s; }
  .chip:hover, .chip[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .chip.warning { border-color: var(--accent); color: var(--accent); }
  .chip.warning:hover { background: var(--accent); color: var(--paper); }
  .tab-count { font-variant-numeric: tabular-nums; opacity: 0.75; }

  .button { padding: 0.55rem 1rem; border: 1px solid var(--ink); border-radius: 2px; cursor: pointer;
    font-family: inherit; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em;
    transition: background 0.12s, color 0.12s; }
  .button.primary { background: var(--ink); color: var(--paper); }
  .button.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
  .button.ghost { background: none; color: var(--ink); }
  .button.ghost:hover { background: var(--paper-2); }
  .button.danger { background: none; border-color: var(--accent); color: var(--accent); }
  .button.danger:hover { background: var(--accent); color: var(--paper); }

  /* ---- Toolbars ---- */
  .controls { max-width: 1400px; margin: 0 auto; padding: 1rem var(--pad) 0.5rem;
    display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  .controls input { flex: 1; min-width: 160px; padding: 0.55rem 0.7rem; border: 1px solid var(--ink);
    background: var(--paper); font-family: inherit; font-size: 0.85rem; color: var(--ink); }
  .controls input:focus { outline: none; border-color: var(--accent); }
  .summary { max-width: 1400px; margin: 0 auto; padding: 0.3rem var(--pad); font-size: 0.72rem; color: var(--muted); }
  .status-filters { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .status-filters button { padding: 0.35rem 0.75rem; background: none; border: 1px solid var(--line); border-radius: 99px;
    cursor: pointer; font-family: inherit; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink); }
  .status-filters button:hover { border-color: var(--ink); }
  .status-filters button.active { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .status-filters button.active[data-status="pending"] { background: var(--accent); border-color: var(--accent); }
  .status-filters button.active[data-status="accepted"] { background: #2d7a3a; border-color: #2d7a3a; }
  .status-filters button.active[data-status="rejected"] { background: var(--muted); border-color: var(--muted); }

  /* ---- Tables ---- */
  .table-wrap { max-width: 1400px; max-height: calc(100vh - 200px); margin: 0 auto; overflow: auto;
    border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  thead th { position: sticky; top: 0; z-index: 10; padding: 0.45rem 0.55rem; background: var(--paper-2);
    border-bottom: 2px solid var(--ink); text-align: left; white-space: nowrap; cursor: pointer; user-select: none;
    font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }
  thead th:hover { color: var(--accent); }
  thead th[aria-sort="ascending"], thead th[aria-sort="descending"] { color: var(--accent); border-bottom: 3px solid var(--accent); }
  thead th > span:first-child { display: inline-block; max-width: calc(100% - 10px); overflow: hidden; vertical-align: bottom; }
  .resizer { position: absolute; top: 0; right: 0; width: 9px; height: 100%; cursor: col-resize; user-select: none; }
  .resizer::before { content: ""; position: absolute; right: 0; top: 25%; height: 50%; width: 1px; background: var(--line); }
  .resizer:hover::before { top: 0; height: 100%; width: 2px; background: var(--accent); }

  tbody tr { border-bottom: 1px solid var(--line); }
  tbody td { padding: 0.55rem; font-size: 0.82rem; vertical-align: top; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  tr.row { background: var(--paper); cursor: pointer; transition: background 0.1s; }
  tr.row.zebra, tr.panel-row.zebra > td { background: var(--zebra); }
  tr.row:hover { background: var(--row-hover); }
  /* An open row and its panel share one highlight. */
  tr.row.expanded > td, tr.row.expanded + tr.panel-row > td { background: #f3e3d6; }
  tr.panel-row > td { padding: 0; border-bottom: 2px solid var(--ink); white-space: normal; }
  .caret-col { width: 2rem; text-align: center; }
  .expand-button { padding: 0.2rem 0.4rem; background: none; border: none; cursor: pointer; font-size: 1.1rem; line-height: 1; color: var(--muted); }
  .caret { display: inline-block; transition: transform 0.15s ease; }
  tr.expanded .caret { transform: rotate(90deg); color: var(--accent); }

  .model-cell { font-family: 'Fraunces', serif; font-size: 0.95rem; font-weight: 600; }
  .tag { padding: 0.1rem 0.4rem; border: 1px solid var(--line); border-radius: 99px; font-size: 0.65rem; white-space: nowrap; }
  .tag.active { border-color: var(--accent-2); color: var(--accent-2); }
  .tag.discontinued { color: var(--muted); }
  .spec-empty { color: var(--line); }
  .flags { color: var(--accent); }

  /* Pending suggestions sit at the top of the catalog table, tinted so they read as
     community input rather than catalog rows. */
  tr.suggestion > td, tr.suggestion.panel-row > td { background: rgba(194,65,12,0.07); }
  tr.suggestion:hover > td, tr.suggestion.expanded > td, tr.suggestion.expanded + tr.panel-row > td { background: rgba(194,65,12,0.13); }
  .suggestion-badge { display: inline-block; padding: 0.05rem 0.4rem; border: 1px solid var(--accent); border-radius: 99px;
    font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }

  /* ---- Expanded panels: product editor, suggestion review, log entry ---- */
  .panel { padding: 1rem 1.25rem; border-left: 3px solid var(--accent); }
  .panel h3 { margin-bottom: 0.7rem; padding-bottom: 0.4rem; border-bottom: 1px solid var(--line);
    font-family: 'Fraunces', serif; font-size: 1rem; color: var(--accent); }
  .field-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0.4rem 0.6rem; margin-bottom: 0.8rem; }
  @media (max-width: 1100px) { .field-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (max-width: 760px) { .field-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .field-grid .span-2 { grid-column: span 2; }
  .field-grid .span-3 { grid-column: span 3; }
  .field-grid .span-all { grid-column: 1 / -1; }
  .field-grid label, .small-label { display: block; margin-bottom: 0.1rem; font-size: 0.55rem; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted); }
  .panel input, .panel select, .panel textarea { width: 100%; padding: 0.28rem 0.4rem; border: 1px solid var(--line);
    background: var(--paper); font-family: inherit; font-size: 0.76rem; color: var(--ink); }
  .panel input:focus, .panel select:focus, .panel textarea:focus { outline: none; border-color: var(--accent); }
  .panel input:disabled { background: var(--paper-2); color: var(--muted); cursor: not-allowed; }
  .panel textarea { min-height: 42px; margin-bottom: 0.8rem; resize: vertical; }
  .field-grid textarea { margin-bottom: 0; }
  .panel input[type=checkbox] { width: auto; }
  .read-only { min-height: 1.4rem; padding: 0.28rem 0.4rem; border: 1px solid var(--line); background: var(--paper-2);
    font-size: 0.78rem; overflow-wrap: anywhere; }
  .read-only a { color: var(--accent-2); }

  .meta { display: flex; flex-wrap: wrap; gap: 0.6rem 1.5rem; align-items: center; margin-bottom: 0.85rem;
    font-size: 0.72rem; color: var(--muted); }
  .meta strong { color: var(--ink); }
  .confidence { padding: 0.15rem 0.5rem; border-radius: 99px; font-size: 0.65rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.04em; }
  .confidence.verified { background: #d1fae5; color: #065f46; }
  .confidence.estimated { background: #fef3c7; color: #92400e; }
  .text-button { padding: 0; background: none; border: none; cursor: pointer; font-family: inherit; font-size: 0.65rem;
    text-decoration: underline; color: var(--muted); }
  .panel-actions { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem;
    padding-bottom: 1rem; border-bottom: 1px solid var(--line); }
  .panel-actions .right { display: flex; gap: 0.5rem; margin-left: auto; }

  /* Change history under the editor. Each entry is the product as it was before that save. */
  .history { margin-top: 1rem; }
  .history-list { list-style: none; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .history-item { border-bottom: 1px solid var(--line); font-size: 0.73rem; }
  .history-item:last-child { border-bottom: none; }
  .history-summary { display: flex; gap: 0.75rem; align-items: center; width: 100%; padding: 0.4rem 0.75rem;
    background: none; border: none; cursor: pointer; font-family: inherit; font-size: inherit; color: inherit; text-align: left; }
  .history-summary:hover { background: var(--paper-2); }
  .history-summary .muted { color: var(--muted); }
  .history-summary .arrow { margin-left: auto; color: var(--muted); }
  .history-detail { padding: 0.75rem; background: var(--paper-2); border-top: 2px solid var(--accent); }
  .history-fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.3rem 1rem;
    max-height: 200px; overflow-y: auto; font-size: 0.71rem; }
  .history-fields dt { font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .history-fields .changed dt, .history-fields .changed dd { font-weight: 600; color: var(--accent); }
  .history-note { padding: 0.75rem; font-size: 0.75rem; color: var(--muted); }

  /* Suggestion review: pick the product, then choose which values to apply. */
  .product-picker { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; margin-bottom: 0.8rem; font-size: 0.76rem; }
  .product-picker input { flex: 0 1 22rem; }
  .picked-name { color: var(--muted); }
  .picked-name.found { font-weight: 600; color: var(--accent-2); }
  .changes-table { margin-bottom: 0.8rem; border: 1px solid var(--line); table-layout: auto; }
  .changes-table th { position: static; padding: 0.3rem 0.5rem; border-bottom: 1px solid var(--line); cursor: default; font-size: 0.55rem; }
  .changes-table td { padding: 0.3rem 0.5rem; font-size: 0.76rem; white-space: normal; vertical-align: middle; }
  .changes-table td.current { color: var(--muted); }
  .changes-table tr.unchanged td { opacity: 0.5; }

  /* Suggestion log */
  .log-table { table-layout: auto; }
  .log-table thead th { cursor: default; }
  .log-table thead th:hover { color: var(--muted); }
  .log-table td { white-space: normal; }
  .log-table .id-col { width: 4.5rem; }
  .log-table .date-col { width: 7.5rem; }
  .log-table .status-col { width: 7rem; }
  .log-table td.id-col { font-variant-numeric: tabular-nums; color: var(--muted); }
  .log-table td.date-col { white-space: nowrap; font-size: 0.76rem; color: var(--muted); }
  @media (max-width: 560px) { .log-table .id-col { display: none; } }
  .status-pill { display: inline-block; padding: 0.05rem 0.5rem; border: 1px solid var(--line); border-radius: 99px;
    font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.08em; white-space: nowrap; }
  .status-pill.pending { border-color: var(--accent); color: var(--accent); }
  .status-pill.reviewed { border-color: var(--accent-2); color: var(--accent-2); }
  .status-pill.accepted { border-color: #2d7a3a; background: rgba(45,122,58,0.08); color: #2d7a3a; }
  .status-pill.rejected { border-color: var(--muted); color: var(--muted); }
  .outcome { margin-top: 0.4rem; padding-top: 0.7rem; border-top: 1px dashed var(--line); font-size: 0.78rem; }
  .outcome ul { margin: 0.3rem 0; list-style: none; }
  .outcome .old-value { color: var(--muted); text-decoration: line-through; }
  .outcome .note { margin-top: 0.3rem; font-style: italic; }
  .outcome .button { margin-top: 0.6rem; }

  /* ---- Footer, messages, dialogs ---- */
  .empty, .loading { padding: 3rem 1rem; text-align: center; font-size: 0.85rem; color: var(--muted); }
  footer { max-width: 1400px; margin: 0 auto; padding: 1.5rem var(--pad); border-top: 1px solid var(--line); font-size: 0.7rem; color: var(--muted); }
  #toast { position: fixed; bottom: 1.5rem; left: 50%; z-index: 99; padding: 0.6rem 1.2rem; border-radius: 4px;
    background: var(--ink); color: var(--paper); font-size: 0.8rem; opacity: 0; pointer-events: none;
    transform: translateX(-50%) translateY(60px); transition: all 0.25s ease; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .confirm-overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
    background: rgba(26,23,20,0.55); }
  .confirm-overlay[hidden] { display: none; }
  .confirm-box { width: 90%; max-width: 380px; padding: 1.5rem 2rem; background: var(--paper); border: 2px solid var(--ink); }
  .confirm-box p { margin-bottom: 1.2rem; font-size: 0.9rem; }
  .confirm-box .buttons { display: flex; gap: 0.5rem; justify-content: flex-end; }
</style>
</head>
<body>
<header class="admin-header">
  <div class="admin-title">The Headphone Archive<span>Catalog Editor</span></div>
  <nav class="header-links" aria-label="Admin">
    <div class="tabs" role="tablist">
      <button type="button" class="chip" role="tab" id="catalogTab" aria-controls="catalogView" aria-selected="true">Catalog editor</button>
      <button type="button" class="chip" role="tab" id="logTab" aria-controls="logView" aria-selected="false">Suggestion log <span class="tab-count" id="pendingCount"></span></button>
    </div>
    <a class="chip" href="/" target="_blank" rel="noopener">&#8599; Public site</a>
    <button type="button" class="chip warning" id="importButton">Reset from CSV</button>
  </nav>
</header>

<section id="catalogView" role="tabpanel" aria-labelledby="catalogTab">
  <div class="controls">
    <input type="text" id="catalogSearch" placeholder="Search model, brand, keyword&hellip;" autocomplete="off" aria-label="Search the catalog">
    <button class="button primary" id="addButton">+ Add headphone</button>
  </div>
  <p class="summary" id="catalogSummary">Loading&hellip;</p>
  <div class="table-wrap" id="catalogTable"><div class="loading">Fetching catalog&hellip;</div></div>
</section>

<section id="logView" role="tabpanel" aria-labelledby="logTab" hidden>
  <div class="controls">
    <input type="text" id="logSearch" placeholder="Search by ID, headphone, source, submitter, notes&hellip;" autocomplete="off" aria-label="Search suggestions">
    <div class="status-filters" role="group" aria-label="Filter by status">
      <button type="button" data-status="all" class="active">All</button>
      <button type="button" data-status="pending">Pending</button>
      <button type="button" data-status="accepted">Accepted</button>
      <button type="button" data-status="rejected">Rejected</button>
    </div>
  </div>
  <p class="summary" id="logSummary">Loading&hellip;</p>
  <div class="table-wrap" id="logTable"><div class="loading">Fetching suggestions&hellip;</div></div>
</section>

<footer id="footerCounts"></footer>
<div id="toast" role="status"></div>
<div class="confirm-overlay" id="confirmDialog" role="dialog" aria-modal="true" hidden>
  <div class="confirm-box">
    <p id="confirmMessage"></p>
    <div class="buttons">
      <button class="button ghost" id="confirmNo">Cancel</button>
      <button class="button danger" id="confirmYes">Confirm</button>
    </div>
  </div>
</div>
<datalist id="productOptions"></datalist>

<script src="shared.js"></script>
<script>
// ---- Settings ----

const COLUMN_WIDTH_KEY = "admin_colw"; // saved column widths; keep the name so old saves load
const CARET_COL_WIDTH = 40;
const MIN_COLUMN_WIDTH = 45;
const TOAST_MS = 2800;

const COLUMNS = [
  { key: "id",             label: "ID",       width: 55 },
  { key: "_brand",         label: "Brand",    width: 130 },
  { key: "model_name",     label: "Model",    width: 200 },
  { key: "release_year",   label: "Year",     width: 70 },
  { key: "status",         label: "Status",   width: 105 },
  { key: "design",         label: "Design",   width: 115 },
  { key: "fit",            label: "Fit",      width: 95 },
  { key: "driver_type",    label: "Driver",   width: 130 },
  { key: "impedance_ohms", label: "Ω",   width: 65 },
  { key: "sensitivity_db", label: "dB",       width: 65 },
  { key: "wireless",       label: "WL/ANC",   width: 90 },
];

// Choices for the editor's dropdowns. These match the values in the catalog today. If a
// product has a value that isn't listed, the editor adds it as an option so a save never
// blanks it out.
const OPTIONS = {
  status: ["Active", "Discontinued", "Legacy Active"],
  category: ["Headphone", "Studio", "Gaming"],
  design: ["Open Back", "Closed Back", "Semi-Open"],
  fit: ["Over-Ear", "On-Ear"],
  driver: ["Dynamic", "Planar Magnetic", "Electrostatic", "Ribbon", "AMT", "Hybrid"],
  yesNo: ["Yes", "No"],
  signature: ["Neutral", "Warm Neutral", "Neutral Bright", "Warm", "Bright", "Analytical", "V-Shaped", "U-Shaped", "Bassy", "Dark"],
  connector: ["3.5mm", "6.35mm", "3.5mm/6.35mm", "Dual 3.5mm", "4.4mm Pentaconn", "mini-XLR", "Dual mini-XLR",
    "A2DC", "MMCX", "Sennheiser 2-pin", "Sennheiser twist-lock", "Electrostatic", "USB", "USB-C", "Lightning", "Wireless"],
};

// Every field in the product editor. Rendering and saving both walk this list.
const EDITOR_FIELDS = [
  { key: "product_id",        label: "Product ID", lockedAfterCreate: true },
  { key: "manufacturer_id",   label: "Brand", type: "brand" },
  { key: "model_name",        label: "Model name" },
  { key: "full_name",         label: "Full name", span: 2 },
  { key: "release_year",      label: "Year" },
  { key: "discontinued_year", label: "Disc. year" },
  { key: "status",            label: "Status", options: OPTIONS.status },
  { key: "category",          label: "Category", options: OPTIONS.category },
  { key: "design",            label: "Design", options: OPTIONS.design },
  { key: "fit",               label: "Fit", options: OPTIONS.fit },
  { key: "driver_type",       label: "Driver type", options: OPTIONS.driver },
  { key: "driver_size_mm",    label: "Driver size (mm)" },
  { key: "impedance_ohms",    label: "Impedance (Ω)" },
  { key: "sensitivity_db",    label: "Sensitivity (dB)" },
  { key: "msrp_usd",          label: "MSRP at release (USD)" },
  { key: "weight_g",          label: "Weight (g)" },
  { key: "sound_signature",   label: "Sound signature", options: OPTIONS.signature, allowBlank: true },
  { key: "connector_type",    label: "Connector", options: OPTIONS.connector, allowBlank: true },
  { key: "detachable_cable",  label: "Detachable cable", options: OPTIONS.yesNo, allowBlank: true },
  { key: "wireless",          label: "Wireless", options: OPTIONS.yesNo },
  { key: "anc",               label: "ANC", options: OPTIONS.yesNo },
  { key: "predecessor",       label: "Predecessor ID", span: 2 },
  { key: "successor",         label: "Successor ID", span: 2 },
  { key: "notes",             label: "Notes", type: "textarea", span: 3 },
];

// Fields shown when comparing history snapshots.
const HISTORY_FIELDS = {
  model_name: "Model", full_name: "Full name", release_year: "Year", discontinued_year: "Disc. year",
  status: "Status", category: "Category", design: "Design", fit: "Fit", driver_type: "Driver",
  driver_size_mm: "Driver size", impedance_ohms: "Impedance", sensitivity_db: "Sensitivity",
  wireless: "Wireless", anc: "ANC", msrp_usd: "MSRP (USD)", weight_g: "Weight",
  sound_signature: "Sound signature", connector_type: "Connector", detachable_cable: "Detachable cable",
  predecessor: "Predecessor", successor: "Successor", notes: "Notes",
};

// Suggestion form field -> the product column it can change.
const SUGGESTION_FIELDS = [
  { from: "driver_size_mm", to: "driver_size_mm",   label: "Driver size (mm)" },
  { from: "impedance_ohms", to: "impedance_ohms",   label: "Impedance (Ω)" },
  { from: "sensitivity_db", to: "sensitivity_db",   label: "Sensitivity (dB)" },
  { from: "connector",      to: "connector_type",   label: "Connector", options: OPTIONS.connector },
  { from: "detachable",     to: "detachable_cable", label: "Detachable cable", options: OPTIONS.yesNo },
  { from: "weight_g",       to: "weight_g",         label: "Weight (g)" },
];
const CHANGE_LABELS = {
  driver_size_mm: "Driver size", impedance_ohms: "Impedance", sensitivity_db: "Sensitivity",
  connector_type: "Connector", detachable_cable: "Detachable cable", weight_g: "Weight",
};

// ---- State ----

let products = [];
let brands = [];
let suggestions = [];
let sortKey = "release_year";
let sortDir = "descending";
let openProductId = null;     // product whose editor is open
let openSuggestionId = null;  // pending suggestion whose review panel is open
let openLogId = null;         // suggestion expanded in the log
let logStatus = "all";
let catalogNeedsRender = false; // set when data changes while the catalog tab is hidden
const histories = new Map();  // product_id -> loaded history entries
const openHistoryEntry = {};  // product_id -> index of the expanded history entry
const columnWidths = {};
let resizing = null;

const byId = id => document.getElementById(id);
const brandLabel = product => `${product._brand || ""} ${product.model_name || ""}`.trim();
const isPending = suggestion => suggestion.status === "pending";

// ---- API ----

// Calls an admin endpoint and returns its JSON, or throws an error that says how to fix it.
async function api(path, options = {}) {
  if (options.body) {
    options = { ...options, headers: { "Content-Type": "application/json" }, body: JSON.stringify(options.body) };
  }
  const response = await fetch(path, options);
  if (response.status === 404) throw new Error(`${path} not found. Are the Pages Functions deployed?`);
  let data;
  try { data = await response.json(); }
  catch (e) { throw new Error(`${path} didn't return JSON (${response.status}). Your Access session may have expired: refresh to log in.`); }
  if (!data.ok) throw new Error(data.error || `${path} failed (${response.status})`);
  return data;
}

// ---- Toast and confirm ----

let toastTimer;
function toast(message) {
  const element = byId("toast");
  element.textContent = message;
  element.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => element.classList.remove("show"), TOAST_MS);
}

function confirmThen(message, onConfirm) {
  byId("confirmMessage").textContent = message;
  byId("confirmDialog").hidden = false;
  const close = () => { byId("confirmDialog").hidden = true; };
  byId("confirmYes").onclick = () => { close(); onConfirm(); };
  byId("confirmNo").onclick = close;
}

// ---- Column widths ----

function loadColumnWidths() {
  COLUMNS.forEach(col => columnWidths[col.key] = col.width);
  try { Object.assign(columnWidths, JSON.parse(localStorage.getItem(COLUMN_WIDTH_KEY) || "null")); } catch (e) {}
}
function saveColumnWidths() {
  try { localStorage.setItem(COLUMN_WIDTH_KEY, JSON.stringify(columnWidths)); } catch (e) {}
}
const tableWidth = () => COLUMNS.reduce((sum, col) => sum + columnWidths[col.key], 0) + CARET_COL_WIDTH;

document.addEventListener("mousemove", event => {
  if (!resizing) return;
  columnWidths[resizing.key] = Math.max(MIN_COLUMN_WIDTH, resizing.startWidth + event.clientX - resizing.startX);
  const header = document.querySelector(`#catalogTable th[data-key="${resizing.key}"]`);
  if (header) header.style.width = columnWidths[resizing.key] + "px";
  byId("catalogTable").querySelector("table").style.minWidth = tableWidth() + "px";
});
document.addEventListener("mouseup", () => {
  if (!resizing) return;
  saveColumnWidths();
  resizing = null;
});

// ---- Catalog table ----

function cellHtml(product, key) {
  const empty = '<span class="spec-empty">&mdash;</span>';
  switch (key) {
    case "model_name": return `<span class="model-cell">${escapeHtml(product.model_name)}</span>`;
    case "release_year": return escapeHtml(product.release_year) + (product.discontinued_year ? "–" + escapeHtml(product.discontinued_year) : "");
    case "status": return `<span class="tag ${/disc/i.test(product.status) ? "discontinued" : "active"}">${escapeHtml(product.status)}</span>`;
    case "wireless": {
      const flags = [product.wireless === "Yes" && "WL", product.anc === "Yes" && "ANC"].filter(Boolean);
      return flags.length ? `<span class="flags">${flags.join(" &middot; ")}</span>` : empty;
    }
    case "impedance_ohms": return product.impedance_ohms ? escapeHtml(product.impedance_ohms) + " Ω" : empty;
    case "sensitivity_db": return product.sensitivity_db ? escapeHtml(product.sensitivity_db) + " dB" : empty;
    default: return escapeHtml(product[key]);
  }
}

// Numbers compare numerically, everything else as text.
function sortedProducts(rows) {
  return [...rows].sort((a, b) => {
    const x = a[sortKey] ?? "", y = b[sortKey] ?? "";
    const bothNumbers = !isNaN(parseFloat(x)) && !isNaN(parseFloat(y));
    const order = bothNumbers ? parseFloat(x) - parseFloat(y) : String(x).localeCompare(String(y));
    return sortDir === "ascending" ? order : -order;
  });
}

function suggestionRowHtml(suggestion) {
  const cells = COLUMNS.map(col => {
    if (col.key === "_brand") return '<td><span class="suggestion-badge">Suggestion</span></td>';
    if (col.key === "model_name") return `<td>${escapeHtml(suggestion.headphone)}</td>`;
    if (col.key === "impedance_ohms" || col.key === "sensitivity_db") return `<td>${escapeHtml(suggestion[col.key])}</td>`;
    return "<td></td>";
  }).join("");
  const open = openSuggestionId === suggestion.id;
  return `<tr class="row suggestion${open ? " expanded" : ""}" data-suggestion-id="${suggestion.id}">${cells}` +
    `<td class="caret-col"><button class="expand-button" aria-label="Review suggestion"><span class="caret">&#x203A;</span></button></td></tr>` +
    `<tr class="panel-row suggestion"${open ? "" : " hidden"}><td colspan="${COLUMNS.length + 1}">` +
    `<div class="panel" id="review-${suggestion.id}">${reviewPanelHtml(suggestion)}</div></td></tr>`;
}

function productRowHtml(product, index) {
  const zebra = index % 2 ? " zebra" : "";
  const open = openProductId === product.product_id;
  const id = escapeHtml(product.product_id);
  return `<tr class="row${zebra}${open ? " expanded" : ""}" data-product-id="${id}">` +
    COLUMNS.map(col => `<td>${cellHtml(product, col.key)}</td>`).join("") +
    `<td class="caret-col"><button class="expand-button" aria-label="Edit ${escapeHtml(product.model_name || "new")}"><span class="caret">&#x203A;</span></button></td></tr>` +
    `<tr class="panel-row${zebra}"${open ? "" : " hidden"}><td colspan="${COLUMNS.length + 1}">` +
    `<div class="panel" id="editor-${id}"></div></td></tr>`;
}

function renderCatalog() {
  // The table is rebuilt from scratch, so keep whatever was typed into an open review panel.
  const reviewDraft = readReviewDraft(openSuggestionId);
  const search = byId("catalogSearch").value.toLowerCase();
  const rows = sortedProducts(products.filter(product => product._isNew ||
    !search || [product._brand, product.model_name, product.full_name, product.notes].join(" ").toLowerCase().includes(search)));
  const pending = suggestions.filter(isPending);
  const saved = products.filter(product => !product._isNew).length;
  byId("catalogSummary").textContent = `${saved} headphones · ${rows.filter(product => !product._isNew).length} shown · click a row to edit`;
  if (!rows.length && !pending.length) {
    byId("catalogTable").innerHTML = '<div class="empty">No matches.</div>';
    return;
  }

  const headers = COLUMNS.map(col =>
    `<th style="width:${columnWidths[col.key]}px" data-key="${col.key}" tabindex="0" aria-sort="${sortKey === col.key ? sortDir : "none"}">` +
    `<span>${escapeHtml(col.label)}</span><span class="resizer" data-key="${col.key}"></span></th>`
  ).join("");
  byId("catalogTable").innerHTML = `<table style="min-width:${tableWidth()}px"><thead><tr>${headers}` +
    `<th style="width:${CARET_COL_WIDTH}px" class="caret-col"><span class="visually-hidden">Edit</span></th></tr></thead><tbody>` +
    pending.map(suggestionRowHtml).join("") + rows.map(productRowHtml).join("") + "</tbody></table>";

  const openProduct = products.find(product => product.product_id === openProductId);
  if (openProduct) fillEditor(openProduct);
  if (openSuggestionId !== null) {
    writeReviewDraft(openSuggestionId, reviewDraft);
    refreshReview(openSuggestionId);
  }
}

// Redraws the catalog now, or when its tab is next shown, so an edit open there isn't lost.
function renderCatalogWhenVisible() {
  if (byId("catalogView").hidden) catalogNeedsRender = true;
  else renderCatalog();
}

function toggleProduct(productId) {
  openProductId = openProductId === productId ? null : productId;
  renderCatalog();
  if (openProductId) {
    requestAnimationFrame(() => byId("editor-" + productId)?.closest("tr").scrollIntoView({ behavior: "smooth", block: "nearest" }));
  }
}

function toggleSuggestion(id) {
  openSuggestionId = openSuggestionId === id ? null : id;
  renderCatalog();
}

// ---- Product editor ----

function editorControl(field, product, isNew) {
  const value = product[field.key] ?? "";
  const id = "field-" + field.key;
  if (field.type === "textarea") return `<textarea id="${id}">${escapeHtml(value)}</textarea>`;
  if (field.type === "brand") {
    return `<select id="${id}">` + brands.map(brand =>
      `<option value="${brand.manufacturer_id}"${String(brand.manufacturer_id) === String(product.manufacturer_id) ? " selected" : ""}>${escapeHtml(brand.name)}</option>`
    ).join("") + "</select>";
  }
  if (field.options) {
    const choices = [...(field.allowBlank ? [""] : []), ...field.options];
    if (value && !choices.includes(value)) choices.push(value);
    return `<select id="${id}">` + choices.map(choice =>
      `<option value="${escapeHtml(choice)}"${choice === value ? " selected" : ""}>${choice ? escapeHtml(choice) : "—"}</option>`
    ).join("") + "</select>";
  }
  const locked = field.lockedAfterCreate && !isNew ? " disabled" : "";
  return `<input id="${id}" value="${escapeHtml(value)}"${locked}>`;
}

function fillEditor(product) {
  const panel = byId("editor-" + product.product_id);
  if (!panel) return;
  const isNew = !!product._isNew;
  const confidence = product.spec_confidence || "Estimated";
  const fields = EDITOR_FIELDS.map(field =>
    `<div class="${field.span ? "span-" + field.span : ""}"><label for="field-${field.key}">${escapeHtml(field.label)}</label>${editorControl(field, product, isNew)}</div>`
  ).join("");
  panel.innerHTML = `
    <h3>${isNew ? "New headphone" : "Editing: " + escapeHtml(brandLabel(product))}</h3>
    <div class="field-grid">${fields}</div>
    <div class="meta">
      <span>Added: <strong>${escapeHtml(product.date_added || "—")}</strong></span>
      <span>Updated: <strong>${escapeHtml(product.date_updated || "—")}</strong></span>
      <span>Specs: <span class="confidence ${confidence === "Verified" ? "verified" : "estimated"}">${escapeHtml(confidence)}</span>
        ${isNew ? "" : '<button class="text-button" data-action="toggle-confidence">toggle</button>'}</span>
    </div>
    <div class="panel-actions">
      ${isNew ? "" : '<button class="button danger" data-action="delete">Delete</button>'}
      <div class="right">
        <button class="button ghost" data-action="cancel">Cancel</button>
        <button class="button primary" data-action="save">Save changes</button>
      </div>
    </div>
    ${isNew ? "" : '<div class="history"><div class="small-label">Change history</div><ul class="history-list"><li class="history-note">Loading…</li></ul></div>'}`;
  if (!isNew) loadHistory(product.product_id);
}

async function saveProduct() {
  const product = {};
  EDITOR_FIELDS.forEach(field => { product[field.key] = byId("field-" + field.key).value.trim(); });
  if (!product.product_id || !product.model_name) return toast("Product ID and Model name are required");
  try {
    await api("/api/admin/products", { method: "POST", body: product });
    product._brand = brands.find(brand => String(brand.manufacturer_id) === product.manufacturer_id)?.name || "";
    const existing = products.find(other => other.product_id === product.product_id && !other._isNew);
    if (existing) Object.assign(existing, product);
    else products = products.filter(other => !other._isNew).concat(product);
    // A new product is saved under the ID typed in, not its placeholder.
    openProductId = product.product_id;
    histories.delete(product.product_id);
    fillProductOptions();
    toast("Saved");
    renderCatalog();
  } catch (e) { toast("Error: " + e.message); }
}

function closeEditor() {
  products = products.filter(product => !product._isNew);
  openProductId = null;
  renderCatalog();
}

function deleteProduct(productId) {
  confirmThen(`Delete ${productId}? This cannot be undone.`, async () => {
    try {
      await api("/api/admin/products", { method: "DELETE", body: { product_id: productId } });
      products = products.filter(product => product.product_id !== productId);
      openProductId = null;
      toast("Deleted");
      renderCatalog();
    } catch (e) { toast("Error: " + e.message); }
  });
}

// Flips Verified/Estimated and saves straight away.
async function toggleConfidence(productId) {
  const product = products.find(other => other.product_id === productId);
  const next = product.spec_confidence === "Verified" ? "Estimated" : "Verified";
  try {
    await api("/api/admin/products", { method: "POST", body: { ...product, spec_confidence: next } });
    product.spec_confidence = next;
    const badge = byId("editor-" + productId).querySelector(".confidence");
    badge.textContent = next;
    badge.className = "confidence " + next.toLowerCase();
    histories.delete(productId);
    loadHistory(productId);
    toast("Marked as " + next);
  } catch (e) { toast("Error: " + e.message); }
}

function addProduct() {
  products = products.filter(product => !product._isNew);
  const draft = {
    _isNew: true, product_id: "NEW_" + Date.now(), model_name: "", full_name: "",
    manufacturer_id: brands[0]?.manufacturer_id || 1, release_year: new Date().getFullYear(),
    status: "Active", category: "Headphone", design: "Closed Back", fit: "Over-Ear",
    driver_type: "Dynamic", wireless: "No", anc: "No", spec_confidence: "Estimated",
  };
  products.unshift(draft);
  openProductId = draft.product_id;
  renderCatalog();
}

// ---- Change history ----

async function loadHistory(productId) {
  if (!histories.has(productId)) {
    try {
      histories.set(productId, (await api("/api/admin/history?product_id=" + encodeURIComponent(productId))).history);
    } catch (e) {
      const list = byId("editor-" + productId)?.querySelector(".history-list");
      if (list) list.innerHTML = `<li class="history-note">Could not load history: ${escapeHtml(e.message)}</li>`;
      return;
    }
  }
  renderHistory(productId);
}

// Entries are newest first. Comparing each with the one below it shows what that save changed.
function renderHistory(productId) {
  const list = byId("editor-" + productId)?.querySelector(".history-list");
  if (!list) return;
  const entries = histories.get(productId) || [];
  if (!entries.length) {
    list.innerHTML = '<li class="history-note">No history yet — changes appear here after the first save.</li>';
    return;
  }
  list.innerHTML = entries.map((entry, i) => {
    const previous = entries[i + 1]?.snapshot;
    const differs = key => previous && String(previous[key] ?? "") !== String(entry.snapshot[key] ?? "");
    const changedCount = Object.keys(HISTORY_FIELDS).filter(differs).length;
    const when = (entry.edited_at || "").slice(0, 16).replace("T", " ");
    const isOpen = openHistoryEntry[productId] === i;
    const detail = !isOpen ? "" : `<div class="history-detail"><div class="small-label">State before edit on ${escapeHtml(when)}</div><dl class="history-fields">` +
      Object.entries(HISTORY_FIELDS).map(([key, label]) =>
        `<div${differs(key) ? ' class="changed"' : ""}><dt>${label}</dt><dd>${escapeHtml(entry.snapshot[key] || "—")}</dd></div>`
      ).join("") + "</dl></div>";
    return `<li class="history-item"><button class="history-summary" data-history-index="${i}">` +
      `<span>${escapeHtml(when)}</span><span class="muted">${previous ? `${changedCount} field${changedCount === 1 ? "" : "s"} changed` : "initial state"}</span>` +
      `<span class="arrow">${isOpen ? "▾" : "▸"}</span></button>${detail}</li>`;
  }).join("");
}

// ---- Suggestion review ----

const normalizeName = text => String(text || "").toLowerCase().replace(/[^a-z0-9]/g, "");

// The public form suggests "Brand Model" names from the catalog, so an exact match is common.
function guessProduct(headphone) {
  const target = normalizeName(headphone);
  if (!target) return null;
  return products.find(product => !product._isNew &&
    (normalizeName(brandLabel(product)) === target || normalizeName(product.full_name) === target)) || null;
}

function reviewPanelHtml(suggestion) {
  const id = suggestion.id;
  const guess = guessProduct(suggestion.headphone);
  const changeRows = SUGGESTION_FIELDS.filter(field => suggestion[field.from]).map(field => `
    <tr data-field="${field.to}">
      <td>${escapeHtml(field.label)}</td>
      <td class="current">—</td>
      <td><input type="text" value="${escapeHtml(suggestion[field.from])}"${field.options ? ` list="options-${field.to}"` : ""} aria-label="New ${escapeHtml(field.label)}"></td>
      <td class="caret-col"><input type="checkbox" checked aria-label="Apply ${escapeHtml(field.label)}"></td>
    </tr>`).join("");
  const changes = changeRows
    ? `<table class="changes-table"><thead><tr><th>Field</th><th>Current</th><th>New value</th><th>Apply</th></tr></thead><tbody>${changeRows}</tbody></table>`
    : '<p class="meta">No spec fields filled in — see the notes below. Accepting will only log the suggestion.</p>';
  const readOnly = (label, html) => `<div class="span-all"><span class="small-label">${label}</span><div class="read-only">${html}</div></div>`;
  const notes = suggestion.notes ? readOnly("Submitter notes", escapeHtml(suggestion.notes)) : "";
  const source = suggestion.source
    ? readOnly("Source", `<a href="${escapeHtml(suggestion.source)}" target="_blank" rel="noopener">${escapeHtml(suggestion.source)}</a>`) : "";
  return `
    <h3>Reviewing suggestion: ${escapeHtml(suggestion.headphone || "—")}</h3>
    <div class="product-picker">
      <label class="small-label" for="pick-${id}">Applies to</label>
      <input id="pick-${id}" list="productOptions" placeholder="Product ID" value="${escapeHtml(guess?.product_id || "")}">
      <span class="picked-name"></span>
    </div>
    ${changes}
    ${notes || source ? `<div class="field-grid">${notes}${source}</div>` : ""}
    <div class="meta">
      <span>Submitted by: <strong>${escapeHtml(suggestion.submitter || "—")}</strong></span>
      <span>Submitted: <strong>${escapeHtml((suggestion.created_at || "").slice(0, 10) || "—")}</strong></span>
    </div>
    <textarea class="review-note" placeholder="Note for the log (optional)" aria-label="Note for the log"></textarea>
    <div class="panel-actions"><div class="right">
      <button class="button ghost" data-action="reject">Reject</button>
      <button class="button primary" data-action="accept">Accept &amp; apply</button>
    </div></div>`;
}

const reviewPanel = id => byId("review-" + id);
const pickedProduct = id => {
  const productId = (reviewPanel(id)?.querySelector(`#pick-${id}`).value || "").trim();
  return products.find(product => product.product_id === productId && !product._isNew);
};

// Shows the picked product's current values next to the suggested ones. Updates the panel
// in place, so typed values survive.
function refreshReview(id) {
  const panel = reviewPanel(id);
  if (!panel) return;
  const product = pickedProduct(id);
  const typedId = panel.querySelector(`#pick-${id}`).value.trim();
  const pickedName = panel.querySelector(".picked-name");
  pickedName.textContent = product ? brandLabel(product) : typedId ? "No product with that ID" : "Pick a product";
  pickedName.classList.toggle("found", !!product);
  panel.querySelectorAll("tr[data-field]").forEach(row => {
    const current = product ? String(product[row.dataset.field] ?? "") : "";
    row.querySelector(".current").textContent = current || "—";
    row.classList.toggle("unchanged", !!product && current === row.querySelector("input[type=text]").value.trim());
  });
}

function readReviewDraft(id) {
  const panel = id === null ? null : reviewPanel(id);
  if (!panel) return null;
  return {
    productId: panel.querySelector(`#pick-${id}`).value,
    note: panel.querySelector(".review-note").value,
    fields: [...panel.querySelectorAll("tr[data-field]")].map(row => ({
      value: row.querySelector("input[type=text]").value,
      apply: row.querySelector("input[type=checkbox]").checked,
    })),
  };
}

function writeReviewDraft(id, draft) {
  const panel = reviewPanel(id);
  if (!draft || !panel) return;
  panel.querySelector(`#pick-${id}`).value = draft.productId;
  panel.querySelector(".review-note").value = draft.note;
  panel.querySelectorAll("tr[data-field]").forEach((row, i) => {
    row.querySelector("input[type=text]").value = draft.fields[i].value;
    row.querySelector("input[type=checkbox]").checked = draft.fields[i].apply;
  });
}

// Datalists for the product picker and the fixed-vocabulary suggestion fields.
function fillProductOptions() {
  const saved = products.filter(product => !product._isNew).sort((a, b) => brandLabel(a).localeCompare(brandLabel(b)));
  byId("productOptions").innerHTML = saved.map(product =>
    `<option value="${escapeHtml(product.product_id)}">${escapeHtml(brandLabel(product))}</option>`).join("");
  for (const field of SUGGESTION_FIELDS.filter(field => field.options)) {
    let list = byId("options-" + field.to);
    if (!list) {
      list = document.createElement("datalist");
      list.id = "options-" + field.to;
      document.body.appendChild(list);
    }
    list.innerHTML = field.options.map(option => `<option value="${escapeHtml(option)}">`).join("");
  }
}

async function acceptSuggestion(id) {
  const product = pickedProduct(id);
  if (!product) return toast("Pick the product this applies to");
  const panel = reviewPanel(id);
  const changes = {};
  panel.querySelectorAll("tr[data-field]").forEach(row => {
    if (row.querySelector("input[type=checkbox]").checked) changes[row.dataset.field] = row.querySelector("input[type=text]").value.trim();
  });
  try {
    const result = await api("/api/admin/suggestions", {
      method: "POST",
      body: { id, action: "accept", product_id: product.product_id, changes, note: panel.querySelector(".review-note").value },
    });
    for (const [field, change] of Object.entries(result.applied)) product[field] = change.to;
    histories.delete(product.product_id);
    const count = Object.keys(result.applied).length;
    toast(count ? `Applied ${count} change${count === 1 ? "" : "s"} to ${brandLabel(product)}` : "Accepted — no values changed");
    openSuggestionId = null;
    await reloadSuggestions();
  } catch (e) { toast("Error: " + e.message); }
}

async function rejectSuggestion(id) {
  try {
    await api("/api/admin/suggestions", { method: "POST", body: { id, action: "reject", note: reviewPanel(id).querySelector(".review-note").value } });
    toast("Rejected");
    openSuggestionId = null;
    await reloadSuggestions();
  } catch (e) { toast("Error: " + e.message); }
}

async function reopenSuggestion(id) {
  try {
    await api("/api/admin/suggestions", { method: "POST", body: { id, action: "reopen" } });
    toast("Reopened — it is back in the Catalog editor queue");
    await reloadSuggestions();
  } catch (e) { toast("Error: " + e.message); }
}

// Fetches suggestions again so the log shows the server's resolved_at and applied changes.
async function reloadSuggestions() {
  try {
    suggestions = (await api("/api/admin/suggestions")).suggestions || [];
  } catch (e) {
    toast("Could not refresh suggestions: " + e.message);
    return;
  }
  renderLog();
  renderCatalogWhenVisible();
}

// ---- Suggestion log ----

function outcomeHtml(suggestion) {
  if (isPending(suggestion)) return '<div class="outcome">Still pending — review it in the Catalog editor tab.</div>';
  let html = `<div class="outcome"><strong>${escapeHtml(suggestion.status)}</strong>` +
    (suggestion.resolved_at ? " on " + escapeHtml(suggestion.resolved_at.slice(0, 10)) : "") +
    (suggestion.product_id ? ` · applied to <strong>${escapeHtml(suggestion.product_id)}</strong>` : "");
  let changes = {};
  try { changes = JSON.parse(suggestion.applied_changes || "{}"); } catch (e) {}
  const changed = Object.entries(changes);
  if (changed.length) {
    html += "<ul>" + changed.map(([field, change]) =>
      `<li>${escapeHtml(CHANGE_LABELS[field] || field)}: <span class="old-value">${escapeHtml(change.from || "—")}</span> &rarr; ${escapeHtml(change.to || "—")}</li>`
    ).join("") + "</ul>";
  } else if (suggestion.status === "accepted") {
    html += "<div>No catalog values changed.</div>";
  }
  if (suggestion.admin_note) html += `<div class="note">${escapeHtml(suggestion.admin_note)}</div>`;
  if (suggestion.status === "rejected") html += `<button type="button" class="button ghost" data-reopen="${suggestion.id}">Reopen</button>`;
  return html + "</div>";
}

function logDetailHtml(suggestion) {
  const field = (label, value, unit = "") => value
    ? `<div><span class="small-label">${label}</span><div class="read-only">${escapeHtml(value)}${unit}</div></div>` : "";
  return `<div class="field-grid">
      ${field("Driver size", suggestion.driver_size_mm, " mm")}${field("Impedance", suggestion.impedance_ohms, " Ω")}
      ${field("Sensitivity", suggestion.sensitivity_db, " dB")}${field("Connector", suggestion.connector)}
      ${field("Detachable cable", suggestion.detachable)}${field("Weight", suggestion.weight_g, " g")}
      ${suggestion.notes ? `<div class="span-all"><span class="small-label">Submitter notes</span><div class="read-only">${escapeHtml(suggestion.notes)}</div></div>` : ""}
      ${suggestion.source ? `<div class="span-all"><span class="small-label">Source</span><div class="read-only"><a href="${escapeHtml(suggestion.source)}" target="_blank" rel="noopener">${escapeHtml(suggestion.source)}</a></div></div>` : ""}
    </div>
    <div class="meta">
      <span>Submitted by: <strong>${escapeHtml(suggestion.submitter || "—")}</strong></span>
      <span>Submitted: <strong>${escapeHtml(suggestion.created_at || "—")}</strong></span>
    </div>
    ${outcomeHtml(suggestion)}`;
}

function renderLog() {
  const pendingCount = suggestions.filter(isPending).length;
  byId("pendingCount").textContent = pendingCount ? `(${pendingCount} pending)` : "";

  const search = byId("logSearch").value.toLowerCase();
  const rows = suggestions.filter(suggestion =>
    (logStatus === "all" || suggestion.status === logStatus) &&
    (!search || ["#" + suggestion.id, suggestion.headphone, suggestion.source, suggestion.submitter, suggestion.notes, suggestion.status]
      .join(" ").toLowerCase().includes(search)));

  const counts = {};
  suggestions.forEach(suggestion => counts[suggestion.status] = (counts[suggestion.status] || 0) + 1);
  const parts = [`${suggestions.length} total`, ...["pending", "accepted", "rejected", "reviewed"]
    .filter(status => counts[status]).map(status => `${counts[status]} ${status}`)];
  if (search || logStatus !== "all") parts.push(`${rows.length} shown`);
  byId("logSummary").textContent = [...parts, "click a row for details"].join(" · ");

  if (!rows.length) {
    byId("logTable").innerHTML = '<div class="empty">No suggestions match.</div>';
    return;
  }
  byId("logTable").innerHTML = `<table class="log-table"><thead><tr><th class="id-col">ID</th><th>Headphone</th>` +
    `<th class="date-col">Submitted</th><th class="status-col">Status</th><th class="caret-col"><span class="visually-hidden">Details</span></th></tr></thead><tbody>` +
    rows.map((suggestion, i) => {
      const open = openLogId === suggestion.id;
      const zebra = i % 2 ? " zebra" : "";
      return `<tr class="row${zebra}${open ? " expanded" : ""}" data-log-id="${suggestion.id}">` +
        `<td class="id-col">#${suggestion.id}</td><td class="model-cell">${escapeHtml(suggestion.headphone)}</td>` +
        `<td class="date-col">${escapeHtml((suggestion.created_at || "").slice(0, 10))}</td>` +
        `<td class="status-col"><span class="status-pill ${escapeHtml(suggestion.status)}">${escapeHtml(suggestion.status)}</span></td>` +
        `<td class="caret-col"><button class="expand-button" aria-expanded="${open}" aria-label="Details for suggestion ${suggestion.id}"><span class="caret">&#x203A;</span></button></td></tr>` +
        `<tr class="panel-row${zebra}"${open ? "" : " hidden"}><td colspan="5"><div class="panel">${open ? logDetailHtml(suggestion) : ""}</div></td></tr>`;
    }).join("") + "</tbody></table>";
}

// ---- Tabs ----

// The open tab is kept in the URL (/admin#log) so a reload or a link lands on it.
function showView(view) {
  const showLog = view === "log";
  byId("catalogView").hidden = showLog;
  byId("logView").hidden = !showLog;
  byId("catalogTab").setAttribute("aria-selected", String(!showLog));
  byId("logTab").setAttribute("aria-selected", String(showLog));
  history.replaceState(null, "", showLog ? "#log" : location.pathname + location.search);
  if (!showLog && catalogNeedsRender) {
    catalogNeedsRender = false;
    renderCatalog();
  }
}

// ---- Events ----

byId("catalogTable").addEventListener("mousedown", event => {
  const handle = event.target.closest(".resizer");
  if (!handle) return;
  event.preventDefault();
  resizing = { key: handle.dataset.key, startX: event.clientX, startWidth: columnWidths[handle.dataset.key] };
});

byId("catalogTable").addEventListener("click", event => {
  const target = event.target;
  const header = target.closest("th[data-key]");
  if (header) {
    if (target.closest(".resizer")) return;
    const key = header.dataset.key;
    if (sortKey === key) sortDir = sortDir === "ascending" ? "descending" : "ascending";
    else { sortKey = key; sortDir = "ascending"; }
    return renderCatalog();
  }
  const action = target.closest("[data-action]")?.dataset.action;
  const productId = target.closest("tr.panel-row")?.previousElementSibling.dataset.productId;
  const suggestionId = +target.closest("tr.panel-row")?.previousElementSibling.dataset.suggestionId;
  if (action === "save") return saveProduct();
  if (action === "cancel") return closeEditor();
  if (action === "delete") return deleteProduct(productId);
  if (action === "toggle-confidence") return toggleConfidence(productId);
  if (action === "accept") return acceptSuggestion(suggestionId);
  if (action === "reject") return rejectSuggestion(suggestionId);
  const historyButton = target.closest("[data-history-index]");
  if (historyButton) {
    const index = +historyButton.dataset.historyIndex;
    openHistoryEntry[productId] = openHistoryEntry[productId] === index ? -1 : index;
    return renderHistory(productId);
  }
  const row = target.closest("tr.row");
  if (!row || target.closest("a")) return;
  if (row.dataset.suggestionId) toggleSuggestion(+row.dataset.suggestionId);
  else toggleProduct(row.dataset.productId);
});

byId("catalogTable").addEventListener("keydown", event => {
  if (event.target.matches("th[data-key]") && (event.key === "Enter" || event.key === " ")) {
    event.preventDefault();
    event.target.click();
  }
});

byId("catalogTable").addEventListener("input", event => {
  const panel = event.target.closest("[id^=review-]");
  if (panel) refreshReview(+panel.id.slice("review-".length));
});

byId("logTable").addEventListener("click", event => {
  const reopenButton = event.target.closest("[data-reopen]");
  if (reopenButton) return reopenSuggestion(+reopenButton.dataset.reopen);
  const row = event.target.closest("tr.row");
  if (!row || event.target.closest("a")) return;
  const id = +row.dataset.logId;
  openLogId = openLogId === id ? null : id;
  renderLog();
});

byId("logSearch").addEventListener("input", () => { renderLog(); byId("logTable").scrollTop = 0; });
document.querySelector(".status-filters").addEventListener("click", event => {
  const button = event.target.closest("button");
  if (!button) return;
  document.querySelectorAll(".status-filters button").forEach(other => other.classList.toggle("active", other === button));
  logStatus = button.dataset.status;
  renderLog();
  byId("logTable").scrollTop = 0;
});

byId("catalogSearch").addEventListener("input", renderCatalog);
byId("addButton").addEventListener("click", addProduct);
byId("catalogTab").addEventListener("click", () => showView("catalog"));
byId("logTab").addEventListener("click", () => showView("log"));
byId("importButton").addEventListener("click", () => {
  confirmThen("Reset D1 from the GitHub CSV? This overwrites all current data.", async () => {
    toast("Importing…");
    try {
      await api("/api/admin/import", { method: "POST" });
      histories.clear();
      toast("Import successful");
      await load();
    } catch (e) { toast("Import failed: " + e.message); }
  });
});
document.addEventListener("keydown", event => {
  if (event.key !== "Escape") return;
  if (!byId("confirmDialog").hidden) byId("confirmNo").click();
  else if (openProductId !== null && !byId("catalogView").hidden) closeEditor();
});

// ---- Start ----

async function load() {
  // Suggestions are fetched alongside but allowed to fail, so a problem there doesn't block editing.
  const suggestionsRequest = api("/api/admin/suggestions").catch(error => error);
  try {
    const [productData, brandData] = await Promise.all([
      api("/api/admin/products"),
      api("/api/admin/products?manufacturers=1"),
    ]);
    products = productData.products || [];
    brands = brandData.manufacturers || [];
  } catch (e) {
    const html = `<div class="empty"><strong>Load failed:</strong> ${escapeHtml(e.message)}</div>`;
    byId("catalogTable").innerHTML = html;
    byId("logTable").innerHTML = html;
    return;
  }
  const suggestionData = await suggestionsRequest;
  if (suggestionData instanceof Error) {
    byId("logTable").innerHTML = `<div class="empty"><strong>Could not load suggestions:</strong> ${escapeHtml(suggestionData.message)} ` +
      "Check the D1 binding and that the suggestions table exists (functions/schema.sql).</div>";
  } else {
    suggestions = suggestionData.suggestions || [];
    renderLog();
  }
  byId("footerCounts").textContent = `${products.length} headphones \u00b7 ${brands.length} brands`;
  fillProductOptions();
  renderCatalog();
}

loadColumnWidths();
if (location.hash === "#log") showView("log");
load();
</script>
</body>
</html>
