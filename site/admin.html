<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — The Headphone Archive</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,900&family=Spline+Sans+Mono:wght@400;500;600&display=swap');
  /* ---- Design tokens (admin) ----
     Same neon-noir palette and fonts as the public site, kept in sync so the editor feels
     like part of the archive. The styles below cover the editable table, the inline edit
     grid, the version-history panel, and the suggestion queue. */
  :root { --ink:#1a1714; --paper:#f4f0e8; --paper-2:#eae3d6; --accent:#c2410c;
    --accent-2:#1e3a2f; --line:#d6cdbd; --muted:#8a8071; --card:#ede7d9;
    --pad: clamp(1rem, 3vw, 2rem); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:var(--paper); color:var(--ink);
    font-family:'Spline Sans Mono',monospace; line-height:1.5; }
  .admin-header { border-bottom:2px solid var(--ink); padding:1.2rem var(--pad);
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:.75rem; }
  .admin-title { font-family:'Fraunces',serif; font-size:1.5rem; font-weight:700; }
  .admin-title span { color:var(--muted); font-size:.75rem; font-family:'Spline Sans Mono',monospace;
    font-weight:400; display:block; text-transform:uppercase; letter-spacing:.1em; }
  .quicklinks { display:flex; gap:.5rem; flex-wrap:wrap; }
  .qlink { font-size:.65rem; text-transform:uppercase; letter-spacing:.1em; text-decoration:none;
    color:var(--ink); border:1px solid var(--line); border-radius:99px; padding:.3rem .75rem; transition:background .12s; }
  .qlink:hover { background:var(--ink); color:var(--paper); }
  .qlink.warn { border-color:var(--accent); color:var(--accent); }
  .qlink.warn:hover { background:var(--accent); color:var(--paper); }
  .controls { display:flex; gap:.6rem; align-items:center; flex-wrap:wrap;
    padding:1rem var(--pad) .5rem; max-width:1400px; margin:0 auto; }
  .controls input { flex:1; min-width:160px; padding:.55rem .7rem;
    border:1px solid var(--ink); background:var(--paper); font-family:inherit; font-size:.85rem; color:var(--ink); }
  .controls input:focus { outline:none; border-color:var(--accent); }
  .btn { font-family:inherit; font-size:.72rem; text-transform:uppercase; letter-spacing:.1em;
    cursor:pointer; padding:.55rem 1rem; border-radius:2px; border:1px solid var(--ink); transition:background .12s,color .12s; }
  .btn-primary { background:var(--ink); color:var(--paper); }
  .btn-primary:hover { background:var(--accent-2); border-color:var(--accent-2); }
  .btn-ghost { background:none; color:var(--ink); }
  .btn-ghost:hover { background:var(--paper-2); }
  .btn-danger { border-color:var(--accent); color:var(--accent); background:none; }
  .btn-danger:hover { background:var(--accent); color:var(--paper); }
  .sub { font-size:.72rem; color:var(--muted); padding:.3rem var(--pad); max-width:1400px; margin:0 auto; }
  .sugg-area { max-width:1400px; margin:0 auto; padding:0 var(--pad) .5rem; }
  .sugg-card { border:1px solid var(--line); border-left:3px solid var(--accent);
    margin-bottom:.5rem; padding:.7rem 1rem; background:var(--card);
    display:grid; grid-template-columns:1fr auto; gap:.5rem; align-items:start; }
  .sugg-info strong { display:block; font-size:.82rem; margin-bottom:.2rem; }
  .sugg-meta { font-size:.68rem; color:var(--muted); }
  .sugg-actions { display:flex; gap:.4rem; }
  .tablewrap { max-width:1400px; margin:0 auto;
    border-left:1px solid var(--line); border-right:1px solid var(--line);
    overflow-x:auto; overflow-y:auto; max-height:calc(100vh - 200px); }
  table { width:100%; min-width:0; border-collapse:collapse; table-layout:fixed; }
  thead th { position:sticky; top:0; z-index:10; background:var(--paper-2);
    text-align:left; font-size:.62rem; text-transform:uppercase; letter-spacing:.12em;
    color:var(--muted); padding:.45rem .55rem; border-bottom:2px solid var(--ink);
    cursor:pointer; user-select:none; white-space:nowrap; }
  thead th:hover { color:var(--accent); }
  thead th[aria-sort="ascending"]::after  { content:' \2191'; color:var(--accent); }
  thead th[aria-sort="descending"]::after { content:' \2193'; color:var(--accent); }
  thead th[aria-sort="ascending"], thead th[aria-sort="descending"] { color: var(--accent); border-bottom: 3px solid var(--accent); }
  thead th > span:first-child { display:inline-block; max-width:calc(100% - 10px);
    overflow:hidden; text-overflow:ellipsis; vertical-align:bottom; }
  .resizer { position:absolute; top:0; right:0; width:9px; height:100%; cursor:col-resize; user-select:none; }
  .resizer::before { content:""; position:absolute; right:3px; top:25%; height:50%; width:1px; background:var(--line); }
  .resizer:hover::before { top:0; height:100%; width:2px; background:var(--accent); }
  tbody tr { border-bottom:1px solid var(--line); }
  tbody tr.datarow { background:var(--paper); cursor:pointer; transition:background .1s; }
  tbody tr.datarow.zebra { background:#ece4d4; }
  tbody tr.datarow:hover, tbody tr.datarow.zebra:hover { background:#d6cebc; }
  tbody td { padding:.55rem .55rem; font-size:.82rem; vertical-align:top; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .caretcol { width:2rem; text-align:center; }
  .expandbtn { background:none; border:none; cursor:pointer; color:var(--muted); font-size:1.1rem; line-height:1; padding:.2rem .4rem; }
  .caret { display:inline-block; transition:transform .15s ease; }
  tr.datarow.expanded .caret { transform:rotate(90deg); color:var(--accent); }
  .model-cell { font-family:'Fraunces',serif; font-size:.95rem; font-weight:600; }
  .tag { font-size:.65rem; padding:.1rem .4rem; border:1px solid var(--line); border-radius:99px; white-space:nowrap; }
  .tag.active { border-color:var(--accent-2); color:var(--accent-2); }
  .tag.disc { color:var(--muted); }
  .spec-val { font-variant-numeric:tabular-nums; }
  .spec-empty { color:var(--line); }
  .flags { color:var(--accent); }
  tr.editrow > td { padding:0; border-bottom:2px solid var(--ink); }
  tr.editrow.zebra > td { background:#ece4d4; }
  .editwrap { padding:1.25rem 1.5rem; border-left:3px solid var(--accent); }
  .editwrap h3 { font-family:'Fraunces',serif; font-size:1rem; margin-bottom:1rem;
    padding-bottom:.4rem; border-bottom:1px solid var(--line); color:var(--accent); }
  .edit-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:.65rem; margin-bottom:1rem; }
  @media (max-width:900px) { .edit-grid { grid-template-columns:repeat(2,1fr); } }
  .edit-grid .span2 { grid-column:span 2; }
  .edit-grid .span4 { grid-column:1/-1; }
  .edit-grid label { display:block; font-size:.58rem; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin-bottom:.2rem; }
  .edit-grid input,.edit-grid select,.edit-grid textarea {
    width:100%; padding:.4rem .5rem; border:1px solid var(--line); background:var(--paper);
    font-family:inherit; font-size:.8rem; color:var(--ink); }
  .edit-grid input:focus,.edit-grid select:focus,.edit-grid textarea:focus { outline:none; border-color:var(--accent); }
  .edit-grid input:disabled { background:var(--paper-2); color:var(--muted); cursor:not-allowed; }
  .edit-grid textarea { resize:vertical; min-height:60px; }
  .edit-meta { display:flex; flex-wrap:wrap; gap:.6rem 1.5rem; margin-bottom:.85rem;
    font-size:.72rem; color:var(--muted); align-items:center; }
  .edit-meta strong { color:var(--ink); }
  .conf-badge { font-size:.65rem; padding:.15rem .5rem; border-radius:99px; font-weight:600;
    letter-spacing:.04em; text-transform:uppercase; }
  .conf-verified { background:#d1fae5; color:#065f46; }
  .conf-est { background:#fef3c7; color:#92400e; }
  .edit-actions { display:flex; justify-content:space-between; align-items:center;
    gap:.5rem; padding-bottom:1rem; border-bottom:1px solid var(--line); }
  .edit-actions-right { display:flex; gap:.5rem; }
  .edit-hist { margin-top:1rem; }
  .edit-hist-head { font-size:.6rem; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin-bottom:.5rem; }
  .hist-list { list-style:none; border:1px solid var(--line); border-radius:4px; overflow:hidden; }
  .hist-item { padding:.4rem .75rem; border-bottom:1px solid var(--line);
    font-size:.73rem; cursor:pointer; display:flex; gap:.75rem; align-items:center; transition:background .1s; }
  .hist-item:last-child { border-bottom:none; }
  .hist-item:hover { background:var(--paper-2); }
  .hist-when { font-family:monospace; flex-shrink:0; }
  .hist-badge { color:var(--muted); }
  .hist-item .arrow { margin-left:auto; color:var(--muted); font-size:.8rem; }
  .hist-detail { padding:.75rem; background:var(--paper-2); border-top:2px solid var(--accent); display:none; }
  .hist-detail.open { display:block; }
  .hist-detail-when { font-size:.68rem; color:var(--muted); margin-bottom:.5rem; }
  .hist-fields { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:.3rem 1rem; max-height:200px; overflow-y:auto; font-size:.71rem; }
  .hf { padding:.1rem 0; }
  .hf dt { font-size:.58rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  .hf dd { color:var(--ink); }
  .hf.changed dt,.hf.changed dd { color:var(--accent); font-weight:600; }
  .hist-none { padding:.75rem; font-size:.75rem; color:var(--muted); }
  #toast { position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%) translateY(60px);
    background:var(--ink); color:var(--paper); font-size:.8rem; padding:.6rem 1.2rem;
    border-radius:4px; opacity:0; transition:all .25s ease; z-index:99; pointer-events:none; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .empty,.loading { text-align:center; padding:3rem 1rem; color:var(--muted); font-size:.85rem; }
  footer { padding:1.5rem var(--pad); border-top:1px solid var(--line); font-size:.7rem; color:var(--muted); max-width:1400px; margin:0 auto; }
  .confirm-overlay { position:fixed; inset:0; background:rgba(26,23,20,.55);
    display:flex; align-items:center; justify-content:center; z-index:50; }
  .confirm-overlay[hidden] { display:none; }
  .confirm-box { background:var(--paper); border:2px solid var(--ink); padding:1.5rem 2rem; max-width:380px; width:90%; }
  .confirm-box p { margin-bottom:1.2rem; font-size:.9rem; }
  .confirm-box .btns { display:flex; gap:.5rem; justify-content:flex-end; }
  .vh { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
</style>
</head>
<body>
<header class="admin-header">
  <div class="admin-title">The Headphone Archive<span>Catalog Editor</span></div>
  <nav class="quicklinks">
    <a class="qlink" href="index.html" target="_blank">&#8599; Public site</a>
    <a class="qlink" href="admin-suggestions.html">Suggestion log</a>
    <span class="qlink warn" id="importBtn" style="cursor:pointer">Reset from CSV</span>
  </nav>
</header>

<div class="controls">
  <input type="text" id="q" placeholder="Search model, brand, keyword&hellip;" autocomplete="off">
  <button class="btn btn-primary" id="addBtn">+ Add headphone</button>
</div>
<p class="sub" id="sub">Loading&hellip;</p>

<div class="sugg-area" id="suggArea"></div>

<div class="tablewrap" id="tablewrap"><div class="loading">Fetching catalog&hellip;</div></div>

<footer><span id="source"></span></footer>
<div id="toast"></div>
<div class="confirm-overlay" id="confirmOverlay" hidden>
  <div class="confirm-box">
    <p id="confirmMsg">Are you sure?</p>
    <div class="btns">
      <button class="btn btn-ghost" id="confirmNo">Cancel</button>
      <button class="btn btn-danger" id="confirmYes">Confirm</button>
    </div>
  </div>
</div>

<script>
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
// ---- State ----
// Module-level state for the admin editor: all products, the brand list, the suggestion
// queue, the active sort, and which row (if any) is expanded for inline editing.
let all=[], mfrs=[], suggs=[], sortKey='release_year', sortDir='descending', expandedId=null;
let openHistIdx={};

const COLS=[
  {key:'id',           label:'ID',       w:55},
  {key:'_brand',       label:'Brand',    w:130},
  {key:'model_name',   label:'Model',    w:200},
  {key:'release_year', label:'Year',     w:70},
  {key:'status',       label:'Status',   w:105},
  {key:'design',       label:'Design',   w:115},
  {key:'fit',          label:'Fit',      w:95},
  {key:'driver_type',  label:'Driver',   w:130},
  {key:'impedance_ohms',label:'\u03A9', w:65},
  {key:'sensitivity_db',label:'dB',      w:65},
  {key:'wireless',     label:'WL/ANC',   w:90},
];
const CARET_W=40;
const colW={};
function loadColW(){COLS.forEach(c=>colW[c.key]=c.w);try{const s=JSON.parse(localStorage.getItem('admin_colw')||'null');if(s)Object.assign(colW,s);}catch(e){}}
function saveColW(){try{localStorage.setItem('admin_colw',JSON.stringify(colW));}catch(e){}}
function visTotalW(){return COLS.reduce((s,c)=>s+colW[c.key],0)+CARET_W;}

// ---- Dropdown option sets ----
// Allowed values for each categorical field, kept in sync with the VALID_* constants in
// _generate_data.py so the editor can only ever produce values the data pipeline accepts.
const OPT_STATUS=['Active','Discontinued','Legacy Active'];
const OPT_DESIGN=['Open Back','Closed Back','Semi-Open'];
const OPT_FIT=['Over-Ear','On-Ear'];
const OPT_DRIVER=['Dynamic','Planar Magnetic','Electrostatic','Ribbon','AMT','Hybrid'];
const OPT_WIRELESS=['Yes','No'];
const OPT_CATEGORY=['Headphone','Studio','Gaming'];
const OPT_SIGNATURE=['Neutral','Balanced','Warm','Bright','V-Shaped','Bass-Heavy','Dark'];
const OPT_CONNECTOR=['3.5mm','6.35mm','3.5mm + 6.35mm','XLR','USB-C','Lightning','Proprietary','Wireless'];
const OPT_DETACHABLE=['Yes','No'];

// ---- Edit-form field definitions ----
// Declarative description of every field in the inline editor: key, label, control type,
// grid span, and (for selects) its option set. render and save both iterate this list, so
// adding an editable field means adding one entry here and nothing else.
const FIELDS=[
  {key:'product_id',     label:'Product ID',      type:'input',    span:1, disabled:true},
  {key:'manufacturer_id',label:'Brand',           type:'mfr',      span:1},
  {key:'model_name',     label:'Model name',      type:'input',    span:1},
  {key:'full_name',      label:'Full name',       type:'input',    span:2},
  {key:'release_year',   label:'Year',            type:'input',    span:1},
  {key:'discontinued_year',label:'Disc. year',    type:'input',    span:1},
  {key:'status',         label:'Status',          type:'select',   span:1, opts:OPT_STATUS},
  {key:'category',       label:'Category',        type:'select',   span:1, opts:OPT_CATEGORY},
  {key:'design',         label:'Design',          type:'select',   span:1, opts:OPT_DESIGN},
  {key:'fit',            label:'Fit',             type:'select',   span:1, opts:OPT_FIT},
  {key:'driver_type',    label:'Driver type',     type:'select',   span:1, opts:OPT_DRIVER},
  {key:'driver_size_mm', label:'Driver size (mm)',type:'input',    span:1},
  {key:'impedance_ohms', label:'Impedance (\u03A9)',type:'input', span:1},
  {key:'sensitivity_db', label:'Sensitivity (dB)',type:'input',    span:1},
  {key:'msrp_usd',       label:'MSRP at release (USD)',type:'input',span:1},
  {key:'weight_g',       label:'Weight (g)',      type:'input',    span:1},
  {key:'sound_signature',label:'Sound signature', type:'select',   span:1, opts:OPT_SIGNATURE, blank:true},
  {key:'connector_type', label:'Connector',       type:'select',   span:1, opts:OPT_CONNECTOR, blank:true},
  {key:'detachable_cable',label:'Detachable cable',type:'select',  span:1, opts:OPT_DETACHABLE, blank:true},
  {key:'wireless',       label:'Wireless',        type:'select',   span:1, opts:OPT_WIRELESS},
  {key:'anc',            label:'ANC',             type:'select',   span:1, opts:OPT_WIRELESS},
  {key:'predecessor',    label:'Predecessor ID',  type:'input',    span:2},
  {key:'successor',      label:'Successor ID',    type:'input',    span:2},
  {key:'notes',          label:'Notes',           type:'textarea', span:4},
];

// Human-readable labels for the version-history diff view, mapping raw column keys to the
// names shown when comparing a product's current values against a historical snapshot.
const HIST_LABELS={model_name:'Model',full_name:'Full name',release_year:'Year',
  discontinued_year:'Disc. year',status:'Status',category:'Category',design:'Design',fit:'Fit',
  driver_type:'Driver',driver_size_mm:'Driver size',impedance_ohms:'Impedance',
  sensitivity_db:'Sensitivity',wireless:'Wireless',anc:'ANC',
  msrp_usd:'MSRP (USD)',weight_g:'Weight',sound_signature:'Sound signature',
  connector_type:'Connector',detachable_cable:'Detachable cable',
  predecessor:'Predecessor',successor:'Successor',notes:'Notes'};

// ---- Cell rendering ----
// Returns the display HTML for one table cell, with special formatting for brand, year,
// status, wireless flags, and spec columns; everything else is escaped plain text.
function cellVal(p,key){
  if(key==='_brand')return esc(p._brand||'');
  if(key==='model_name')return '<span class="model-cell">'+esc(p.model_name)+'</span>';
  if(key==='release_year')return esc(p.release_year)+(p.discontinued_year?'\u2013'+esc(p.discontinued_year):'');
  if(key==='status'){const c=/disc/i.test(p.status)?'disc':'active';return '<span class="tag '+c+'">'+esc(p.status)+'</span>';}
  if(key==='wireless'){const f=[];if(p.wireless==='Yes')f.push('WL');if(p.anc==='Yes')f.push('ANC');return f.length?'<span class="flags">'+f.join(' &middot; ')+'</span>':'<span class="spec-empty">&mdash;</span>';}
  if(key==='impedance_ohms')return p.impedance_ohms?'<span class="spec-val">'+esc(p.impedance_ohms)+' \u03A9</span>':'<span class="spec-empty">&mdash;</span>';
  if(key==='sensitivity_db')return p.sensitivity_db?'<span class="spec-val">'+esc(p.sensitivity_db)+' dB</span>':'<span class="spec-empty">&mdash;</span>';
  return esc(p[key]??'');
}

// Sorts rows by the active column, comparing numerically when both values parse as numbers
// and falling back to locale-aware string comparison otherwise. Direction follows sortDir.
function sortRows(rows){
  return [...rows].sort((a,b)=>{
    let av=a[sortKey]??'',bv=b[sortKey]??'';
    if(sortKey==='_brand'){av=a._brand??'';bv=b._brand??'';}
    const an=parseFloat(av),bn=parseFloat(bv);
    const cmp=!isNaN(an)&&!isNaN(bn)?an-bn:String(av).localeCompare(String(bv));
    return sortDir==='ascending'?cmp:-cmp;
  });
}

let resizing=null;
// ---- Main table render ----
// Rebuilds the admin table from state, including the inline-expanded edit row when one is
// open. Re-attaches all row/resizer/button handlers since the markup is regenerated wholesale.
function render(){
  const q=document.getElementById('q').value.toLowerCase();
  let rows=all.filter(p=>p._isNew||(!(q)||(p._brand+' '+p.model_name+' '+p.full_name+' '+(p.notes||'')).toLowerCase().includes(q)));
  rows=sortRows(rows);
  document.getElementById('sub').textContent=all.filter(p=>!p._isNew).length+' headphones \u00b7 '+rows.filter(p=>!p._isNew).length+' shown \u00b7 click a row to edit';
  if(!rows.length){document.getElementById('tablewrap').innerHTML='<div class="empty">No matches.</div>';renderSuggestions();return;}
  const tw=visTotalW();
  let html='<table style="min-width:'+tw+'px"><thead><tr>';
  COLS.forEach(c=>{
    const sa=sortKey===c.key?' aria-sort="'+sortDir+'"':' aria-sort="none"';
    html+='<th style="width:'+colW[c.key]+'px" data-key="'+c.key+'"'+sa+'><span>'+esc(c.label)+'</span><span class="resizer" data-key="'+c.key+'" tabindex="-1"></span></th>';
  });
  html+='<th style="width:'+CARET_W+'px" class="caretcol"><span class="vh">Edit</span></th></tr></thead><tbody>';
  rows.forEach((p,i)=>{
    const z=i%2?' zebra':'';
    const pid=p.product_id;
    const isExp=expandedId===pid;
    html+='<tr class="datarow'+z+(isExp?' expanded':'')+'" data-id="'+esc(pid)+'">';
    COLS.forEach(c=>{html+='<td>'+cellVal(p,c.key)+'</td>';});
    html+='<td class="caretcol"><button class="expandbtn" aria-label="Edit '+esc(p.model_name||'new')+'"><span class="caret">&#x203A;</span></button></td></tr>';
    html+='<tr class="editrow'+z+'"'+(isExp?'':' hidden')+' data-pid="'+esc(pid)+'"><td colspan="'+(COLS.length+1)+'"><div class="editwrap" id="ew_'+esc(pid)+'"></div></td></tr>';
  });
  html+='</tbody></table>';
  document.getElementById('tablewrap').innerHTML=html;

  // Wire sort
  document.querySelectorAll('thead th[data-key]').forEach(th=>{
    th.setAttribute('tabindex','0');
    const doSort=()=>{const k=th.getAttribute('data-key');if(sortKey===k)sortDir=sortDir==='ascending'?'descending':'ascending';else{sortKey=k;sortDir='ascending';}render();};
    th.addEventListener('click',e=>{if(e.target.closest('.resizer'))return;doSort();});
    th.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();doSort();}});
  });

  // Wire row expand
  document.querySelectorAll('tr.datarow').forEach(tr=>{
    const pid=tr.getAttribute('data-id');
    const handler=e=>{if(e.target.closest('button')||e.target.tagName==='A')return;toggleEdit(pid);};
    tr.addEventListener('click',handler);
    const btn=tr.querySelector('.expandbtn');
    if(btn)btn.addEventListener('click',e=>{e.stopPropagation();toggleEdit(pid);});
  });

  // Wire resize
  resizing=null;
  document.querySelectorAll('.resizer').forEach(rz=>{
    rz.addEventListener('mousedown',e=>{e.preventDefault();resizing={key:rz.getAttribute('data-key'),startX:e.clientX,startW:colW[rz.getAttribute('data-key')]};});
  });

  // Populate expanded row if any
  if(expandedId!==null){
    const p=all.find(x=>x.product_id===expandedId);
    const ew=document.getElementById('ew_'+expandedId);
    if(p&&ew&&!ew.innerHTML)populateEditWrap(ew,p);
  }
  renderSuggestions();
}

// Global resize handlers
document.addEventListener('mousemove',e=>{
  if(!resizing)return;
  const th=document.querySelector('th[data-key="'+resizing.key+'"]');
  colW[resizing.key]=Math.max(45,resizing.startW+(e.clientX-resizing.startX));
  if(th)th.style.width=colW[resizing.key]+'px';
  const tbl=document.querySelector('table');
  if(tbl)tbl.style.minWidth=visTotalW()+'px';
});
document.addEventListener('mouseup',()=>{if(resizing){saveColW();resizing=null;}});

function toggleEdit(pid){
  if(expandedId===pid){expandedId=null;render();return;}
  expandedId=pid;openHistIdx={};render();
  requestAnimationFrame(()=>{const ew=document.getElementById('ew_'+pid);if(ew)ew.closest('tr').scrollIntoView({behavior:'smooth',block:'nearest'});});
}

function populateEditWrap(wrap,p){
  const isNew=!!p._isNew;
  const pid=p.product_id;
  let html='<h3>'+(isNew?'New headphone':'Editing: '+esc((p._brand||'')+' '+(p.model_name||'')))+'</h3>';
  html+='<div class="edit-grid">';
  FIELDS.forEach(f=>{
    const spanCls=f.span>1?' span'+f.span:'';
    const val=p[f.key]??'';
    const dis=(f.disabled&&!isNew)?' disabled':'';
    let ctrl='';
    if(f.type==='textarea'){ctrl='<textarea id="ef_'+f.key+'"'+dis+'>'+esc(val)+'</textarea>';}
    else if(f.type==='mfr'){
      const opts=mfrs.map(m=>'<option value="'+m.manufacturer_id+'"'+(String(m.manufacturer_id)===String(p.manufacturer_id)?' selected':'')+'>'+esc(m.name)+'</option>').join('');
      ctrl='<select id="ef_'+f.key+'">'+opts+'</select>';
    }else if(f.type==='select'){
      const blank=f.blank?'<option value=""'+(val===''?' selected':'')+'>\u2014</option>':'';
      const opts=(f.opts||[]).map(o=>'<option'+(o===val?' selected':'')+'>'+esc(o)+'</option>').join('');
      ctrl='<select id="ef_'+f.key+'">'+blank+opts+'</select>';
    }else{ctrl='<input id="ef_'+f.key+'" value="'+esc(val)+'"'+dis+'>';}
    html+='<div class="'+spanCls+'"><label for="ef_'+f.key+'">'+esc(f.label)+'</label>'+ctrl+'</div>';
  });
  html+='</div>';
  const conf=p.spec_confidence||'Estimated';
  html+='<div class="edit-meta"><span>Added: <strong>'+esc(p.date_added||'\u2014')+'</strong></span><span>Updated: <strong>'+esc(p.date_updated||'\u2014')+'</strong></span><span>Specs: <span class="conf-badge '+(conf==='Verified'?'conf-verified':'conf-est')+'" id="confBadge_'+esc(pid)+'">'+esc(conf)+'</span> <button style="background:none;border:none;cursor:pointer;font-size:.65rem;text-decoration:underline;color:var(--muted)" onclick="toggleConf('+JSON.stringify(pid)+')">toggle</button></span></div>';
  html+='<div class="edit-actions">'+(!isNew?'<button class="btn btn-danger" onclick="confirmDelete('+JSON.stringify(pid)+')">Delete</button>':'<span></span>')+'<div class="edit-actions-right"><button class="btn btn-ghost" onclick="cancelEdit()">Cancel</button><button class="btn btn-primary" onclick="saveEdit('+JSON.stringify(pid)+')">Save changes</button></div></div>';
  if(!isNew){html+='<div class="edit-hist"><div class="edit-hist-head">Change history</div><ul class="hist-list" id="hl_'+esc(pid)+'"><li class="hist-none">Loading\u2026</li></ul></div>';}
  wrap.innerHTML=html;
  if(!isNew)loadInlineHistory(pid);
}

// Lazily fetches and renders a product's edit history into its expanded row, only when the
// history section is opened. Keeps the initial table load light by deferring this call.
async function loadInlineHistory(pid){
  const list=document.getElementById('hl_'+pid);if(!list)return;
  try{
    const res=await fetch('/api/admin/history?product_id='+encodeURIComponent(pid));
    const d=await res.json();if(!d.ok)throw new Error();
    const hist=d.history;
    if(!hist.length){list.innerHTML='<li class="hist-none">No history yet \u2014 changes appear here after the first save.</li>';return;}
    buildHistList(list,hist,pid);
  }catch(e){list.innerHTML='<li class="hist-none">Could not load history.</li>';}
}

function buildHistList(list,hist,pid){
  if(openHistIdx[pid]===undefined)openHistIdx[pid]=-1;
  list.innerHTML=hist.map((entry,i)=>{
    const prev=i+1<hist.length?hist[i+1].snapshot:null;
    const when=(entry.edited_at||'').slice(0,16).replace('T',' ');
    const changed=prev?Object.keys(HIST_LABELS).filter(k=>String(prev[k]??'')!==String(entry.snapshot[k]??'')).length:0;
    const badge=prev?changed+' field'+(changed===1?'':'s')+' changed':'initial state';
    const isOpen=openHistIdx[pid]===i;
    let detHtml='';
    if(isOpen){
      const fields=Object.keys(HIST_LABELS).map(k=>{const val=entry.snapshot[k]??'';const ch=prev&&String(prev[k]??'')!==String(val);return'<div class="hf'+(ch?' changed':'')+'"><dt>'+HIST_LABELS[k]+'</dt><dd>'+esc(val||'\u2014')+'</dd></div>';}).join('');
      detHtml='<div class="hist-detail open"><div class="hist-detail-when">State before edit on '+esc(when)+'</div><div class="hist-fields">'+fields+'</div></div>';
    }
    return'<li class="hist-item" onclick="toggleHistEntry('+JSON.stringify(pid)+','+i+','+JSON.stringify(hist)+')"><span class="hist-when">'+esc(when)+'</span><span class="hist-badge">'+badge+'</span><span class="arrow">'+(isOpen?'\u25be':'\u25b8')+'</span>'+detHtml+'</li>';
  }).join('');
}

function toggleHistEntry(pid,idx,hist){openHistIdx[pid]=openHistIdx[pid]===idx?-1:idx;const list=document.getElementById('hl_'+pid);if(list)buildHistList(list,hist,pid);}

async function saveEdit(pid){
  const p={};
  FIELDS.forEach(f=>{const el=document.getElementById('ef_'+f.key);if(el)p[f.key]=el.value.trim();});
  if(!p.product_id||!p.model_name){toast('Product ID and Model name required');return;}
  try{
    const res=await fetch('/api/admin/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});
    const d=await res.json();if(!d.ok)throw new Error(d.error||'');
    p._brand=(mfrs.find(m=>String(m.manufacturer_id)===String(p.manufacturer_id))||{}).name||'';
    const idx=all.findIndex(x=>x.product_id===p.product_id);
    if(idx>=0)all[idx]={...all[idx],...p};else all=all.filter(x=>!x._isNew).concat([p]);
    expandedId=p.product_id;toast('Saved');render();
  }catch(e){toast('Error: '+e.message);}
}

function cancelEdit(){
  all=all.filter(p=>!p._isNew);
  expandedId=null;openHistIdx={};render();
}

function confirmDelete(pid){
  confirm2('Delete '+pid+'? This cannot be undone.',async()=>{
    try{
      const res=await fetch('/api/admin/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({_delete:true,product_id:pid})});
      const d=await res.json();if(!d.ok)throw new Error(d.error||'');
      all=all.filter(x=>x.product_id!==pid);expandedId=null;toast('Deleted');render();
    }catch(e){toast('Error: '+e.message);}
  });
}

document.getElementById('addBtn').addEventListener('click',()=>{
  all=all.filter(p=>!p._isNew);
  const blank={_isNew:true,product_id:'NEW_'+Date.now(),model_name:'',full_name:'',
    manufacturer_id:mfrs[0]?.manufacturer_id||1,release_year:new Date().getFullYear(),
    status:'Active',category:'Headphone',design:'Closed Back',fit:'Over-Ear',
    driver_type:'Dynamic',wireless:'No',anc:'No',spec_confidence:'Estimated'};
  all.unshift(blank);expandedId=blank.product_id;render();
});

async function toggleConf(pid){
  const badge=document.getElementById('confBadge_'+pid);if(!badge)return;
  const p=all.find(x=>x.product_id===pid);if(!p)return;
  const next=(p.spec_confidence||'Estimated')==='Verified'?'Estimated':'Verified';
  try{
    const updated={...p,spec_confidence:next};
    const res=await fetch('/api/admin/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(updated)});
    const d=await res.json();if(!d.ok)throw new Error(d.error||'');
    p.spec_confidence=next;badge.textContent=next;badge.className='conf-badge '+(next==='Verified'?'conf-verified':'conf-est');toast('Marked as '+next);
  }catch(e){toast('Error: '+e.message);}
}

// ---- Suggestion queue ----
// Renders the pending community-suggestion list shown alongside the catalog, with controls
// to accept, reject, mark reviewed, or delete each one via the admin suggestions endpoint.
function renderSuggestions(){
  const area=document.getElementById('suggArea');
  const pending=suggs.filter(s=>s.status==='pending');
  if(!pending.length){area.innerHTML='';return;}
  area.innerHTML='<div style="font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:.75rem var(--pad) .25rem">'+pending.length+' pending suggestion'+(pending.length===1?'':'s')+'</div>'+
    pending.map(s=>'<div class="sugg-card"><div class="sugg-info"><strong>'+esc(s.brand||'')+' '+esc(s.model_name||'')+'</strong><span class="sugg-meta">'+esc(s.notes||'')+' \u00b7 '+esc((s.submitted_at||'').slice(0,10))+'</span></div><div class="sugg-actions"><button class="btn btn-ghost" onclick="actSugg('+s.id+',\'reject\')">Reject</button><button class="btn btn-primary" onclick="actSugg('+s.id+',\'accept\')">Accept</button></div></div>').join('');
}

async function actSugg(id,action){
  try{
    const res=await fetch('/api/admin/suggestions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,action})});
    const d=await res.json();if(!d.ok)throw new Error(d.error||'');
    suggs=suggs.filter(s=>s.id!==id);toast(action==='accept'?'Accepted':'Rejected');renderSuggestions();
  }catch(e){toast('Error: '+e.message);}
}

document.getElementById('importBtn').addEventListener('click',()=>{
  confirm2('Reset D1 from the GitHub CSV? This overwrites all current data.',async()=>{
    toast('Importing\u2026');
    try{
      const res=await fetch('/api/admin/import',{method:'POST'});
      const d=await res.json();if(!d.ok)throw new Error(d.error||'');
      toast('Import successful');await load();
    }catch(e){toast('Import failed: '+e.message);}
  });
});

let _toastTimer;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(_toastTimer);_toastTimer=setTimeout(()=>el.classList.remove('show'),2800);}
function confirm2(msg,onYes){
  const ov=document.getElementById('confirmOverlay');
  document.getElementById('confirmMsg').textContent=msg;ov.removeAttribute('hidden');
  const yes=document.getElementById('confirmYes'),no=document.getElementById('confirmNo');
  const cleanup=()=>{ov.setAttribute('hidden','');yes.onclick=null;no.onclick=null;};
  yes.onclick=()=>{cleanup();onYes();};no.onclick=cleanup;
}

// ---- Bootstrap ----
// Initial load: fetches products, manufacturers, and suggestions in parallel, seeds state,
// and kicks off the first render. This is the entry point run once when the page opens.
async function load(){
  try{
    const [pRes,mRes,sRes]=await Promise.all([fetch('/api/admin/products'),fetch('/api/admin/products?manufacturers=1'),fetch('/api/admin/suggestions')]);
    let pData,mData,sData;
    try{pData=await pRes.json();}catch(e){throw new Error('Products API non-JSON ('+pRes.status+'). Access session may have expired \u2014 refresh to log in.');}
    try{mData=await mRes.json();}catch(e){throw new Error('Manufacturers API non-JSON');}
    try{sData=await sRes.json();}catch(e){sData={ok:true,suggestions:[]};}
    if(!pData.ok)throw new Error('Products API error: '+(pData.error||'no message'));
    all=pData.products||[];mfrs=(mData.ok&&mData.manufacturers)?mData.manufacturers:[];suggs=(sData.ok&&sData.suggestions)?sData.suggestions:[];
    document.getElementById('source').textContent=all.length+' headphones \u00b7 '+mfrs.length+' brands';
    render();
  }catch(e){document.getElementById('tablewrap').innerHTML='<div class="empty"><strong>Load failed:</strong> '+esc(e.message)+'</div>';}
}

loadColW();load();
document.getElementById('q').addEventListener('input',render);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&expandedId!==null)cancelEdit();});
</script>
</body>
