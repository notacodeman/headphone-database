<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Catalog Editor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,900&family=Spline+Sans+Mono:wght@400;500;600&display=swap');
  :root { --ink:#1a1714; --paper:#f4f0e8; --paper-2:#e3dac9; --card:#fbf9f4; --accent:#c2410c; --accent-2:#1e3a2f; --line:#d6cdbd; --muted:#8a8071; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--paper-2); color:var(--ink); font-family:'Spline Sans Mono',monospace; line-height:1.5; padding:2rem 1.5rem 4rem; }
  .wrap { max-width:1300px; margin:0 auto; }

  .quicklinks { display:flex; gap:0.6rem; flex-wrap:wrap; margin-bottom:1.5rem; }
  .qlink { display:inline-flex; align-items:center; gap:0.4rem; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.1em;
    text-decoration:none; color:var(--ink); background:var(--card); border:1px solid var(--ink); border-radius:99px; padding:0.4rem 0.85rem; transition:background 0.15s,color 0.15s; }
  .qlink:hover { background:var(--ink); color:var(--paper); }
  .qlink.accent { border-color:var(--accent-2); color:var(--accent-2); }
  .qlink.accent:hover { background:var(--accent-2); color:var(--paper); }

  h1 { font-family:'Fraunces',serif; font-weight:900; font-size:clamp(1.7rem,4vw,2.6rem); letter-spacing:-0.02em; }
  h1 em { font-style:italic; color:var(--accent); }
  .sub { color:var(--muted); font-size:0.8rem; margin:0.3rem 0 1.3rem; }

  .toolbar { display:flex; gap:0.75rem; flex-wrap:wrap; align-items:center; margin-bottom:1rem; }
  .toolbar input.search { flex:1; min-width:220px; padding:0.6rem 0.8rem; border:1px solid var(--ink); background:var(--card); font-family:inherit; font-size:0.9rem; color:var(--ink); border-radius:6px; }
  .btn { font-family:inherit; text-transform:uppercase; letter-spacing:0.1em; cursor:pointer; border:none; border-radius:99px; white-space:nowrap; }
  .btn-primary { background:var(--accent); color:var(--paper); font-size:0.72rem; padding:0.6rem 1.1rem; }
  .btn-primary:hover { background:var(--accent-2); }
  .btn-2 { background:var(--accent-2); color:var(--paper); font-size:0.72rem; padding:0.6rem 1.1rem; }
  .btn-ghost { background:none; border:1px solid var(--ink); color:var(--ink); font-size:0.72rem; padding:0.55rem 1rem; }
  .btn-reset { background:none; border:1px solid var(--line); color:var(--muted); font-size:0.6rem; padding:0.35rem 0.7rem; margin-left:auto; }
  .btn-reset:hover { border-color:var(--accent); color:var(--accent); }

  /* The list as an elevated card, clearly separate from the page */
  .card { background:var(--card); border:1px solid var(--ink); border-radius:12px; box-shadow:0 10px 30px -14px rgba(26,23,20,0.45); overflow-x:auto; }
  table { border-collapse:collapse; table-layout:fixed; }
  thead th { position:relative; text-align:left; font-size:0.6rem; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted);
    padding:0.7rem 0.6rem; border-bottom:2px solid var(--ink); background:var(--card); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .resizer { position:absolute; top:0; right:0; width:9px; height:100%; cursor:col-resize; user-select:none; }
  .resizer:hover { background:var(--accent); opacity:0.4; }
  tbody tr { border-bottom:1px solid var(--line); cursor:pointer; }
  tbody tr:nth-child(even) td { background:rgba(26,23,20,0.03); }
  tbody tr:hover td { background:var(--paper-2); }
  tbody td { padding:0.55rem 0.6rem; font-size:0.82rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  td.b { color:var(--accent-2); font-weight:500; }
  td.mn { font-family:'Fraunces',serif; font-size:0.95rem; }
  td.notes { white-space:normal; color:var(--muted); font-size:0.76rem; }
  .muted { color:var(--muted); }
  .loading,.empty { text-align:center; color:var(--muted); padding:3rem 1rem; }

  /* Edit modal */
  .overlay { position:fixed; inset:0; background:rgba(26,23,20,0.55); display:none; align-items:flex-start; justify-content:center; padding:3rem 1rem; overflow-y:auto; z-index:50; }
  .overlay.open { display:flex; }
  .modal { background:var(--card); border:2px solid var(--ink); border-radius:12px; max-width:680px; width:100%; padding:1.6rem 1.8rem; }
  .modal h2 { font-family:'Fraunces',serif; font-size:1.4rem; margin-bottom:1rem; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:0.8rem 1rem; }
  .grid .full { grid-column:1 / -1; }
  @media (max-width:560px){ .grid { grid-template-columns:1fr; } }
  label { display:block; font-size:0.62rem; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); margin-bottom:0.25rem; }
  .modal input, .modal select, .modal textarea { width:100%; padding:0.5rem 0.6rem; border:1px solid var(--ink); background:var(--paper); font-family:inherit; font-size:0.86rem; color:var(--ink); border-radius:5px; }
  .modal textarea { resize:vertical; min-height:60px; }
  .modal-actions { display:flex; justify-content:space-between; align-items:center; margin-top:1.4rem; gap:0.75rem; }
  .modal-actions .right { display:flex; gap:0.6rem; }

  /* Small confirm modal */
  .confirm-box { background:var(--card); border:2px solid var(--ink); border-radius:12px; max-width:440px; width:100%; padding:1.6rem 1.7rem; align-self:center; }
  .confirm-box h3 { font-family:'Fraunces',serif; font-size:1.25rem; margin-bottom:0.6rem; }
  .confirm-box p { font-size:0.85rem; color:var(--ink); margin-bottom:1.3rem; }
  .confirm-box .row { display:flex; justify-content:flex-end; gap:0.6rem; }

  .toast { position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:0.7rem 1.3rem; font-size:0.82rem; border-radius:99px; opacity:0; transition:opacity 0.25s; pointer-events:none; z-index:70; }
  .toast.show { opacity:1; }
  .vh { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *,*::before,*::after{ transition-duration:0.01ms !important; } }
</style>
</head>
<body>
<div class="wrap">
  <nav class="quicklinks" aria-label="Quick links">
    <a class="qlink" href="index.html">&larr; View Archive</a>
    <a class="qlink accent" href="admin-suggestions.html">Review Suggestions &rarr;</a>
    <a class="qlink" href="https://dash.cloudflare.com" target="_blank" rel="noopener">Cloudflare Dashboard &#8599;</a>
    <a class="qlink" href="https://github.com/notacodeman/headphone-database" target="_blank" rel="noopener">GitHub Repo &#8599;</a>
  </nav>

  <h1>Catalog <em>Editor</em></h1>
  <p class="sub" id="sub">Loading&hellip;</p>

  <div class="toolbar">
    <input type="text" class="search" id="q" placeholder="Search by brand, model, keyword&hellip;" autocomplete="off" aria-label="Search the catalog">
    <button class="btn btn-primary" id="addBtn">+ Add headphone</button>
    <button class="btn btn-reset" id="importBtn" title="Wipe and reload the catalog from the GitHub CSVs">Reset from CSV</button>
  </div>

  <div class="card"><div id="tablewrap"><div class="loading">Loading catalog&hellip;</div></div></div>
</div>

<!-- Edit modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Edit headphone</h2>
    <div class="grid">
      <div><label>Product ID *</label><input id="f_product_id" placeholder="BRAND_MODEL"></div>
      <div><label>Brand</label><select id="f_manufacturer_id"></select></div>
      <div><label>Model name *</label><input id="f_model_name"></div>
      <div><label>Full name</label><input id="f_full_name"></div>
      <div><label>Release year</label><input id="f_release_year"></div>
      <div><label>Discontinued year</label><input id="f_discontinued_year"></div>
      <div><label>Status</label><input id="f_status" placeholder="Active / Discontinued / Legacy Active"></div>
      <div><label>Category</label><input id="f_category" placeholder="Headphone / Studio / Gaming"></div>
      <div><label>Design</label><input id="f_design" placeholder="Open Back / Closed Back / Semi-Open / In-Ear"></div>
      <div><label>Driver type</label><input id="f_driver_type" placeholder="Dynamic / Planar Magnetic / ..."></div>
      <div><label>Driver size (mm)</label><input id="f_driver_size_mm"></div>
      <div><label>Impedance (ohms)</label><input id="f_impedance_ohms"></div>
      <div><label>Sensitivity (dB)</label><input id="f_sensitivity_db"></div>
      <div><label>Wireless</label><select id="f_wireless"><option>No</option><option>Yes</option></select></div>
      <div><label>ANC</label><select id="f_anc"><option>No</option><option>Yes</option></select></div>
      <div><label>Predecessor (product_id)</label><input id="f_predecessor"></div>
      <div><label>Successor (product_id)</label><input id="f_successor"></div>
      <div class="full"><label>Comments / notes</label><textarea id="f_notes"></textarea></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="deleteBtn" style="border-color:var(--accent);color:var(--accent);">Delete</button>
      <span class="right">
        <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
        <button class="btn btn-2" id="saveBtn">Save</button>
      </span>
    </div>
  </div>
</div>

<!-- Confirm modal -->
<div class="overlay" id="confirmOverlay">
  <div class="confirm-box">
    <h3 id="confirmTitle">Are you sure?</h3>
    <p id="confirmMsg"></p>
    <div class="row">
      <button class="btn btn-ghost" id="confirmCancel">Cancel</button>
      <button class="btn btn-primary" id="confirmOk">Confirm</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let all = [], mfrs = [], editingId = null;
const FIELDS = ["product_id","manufacturer_id","model_name","full_name","release_year","discontinued_year","status","category","design","driver_type","driver_size_mm","impedance_ohms","sensitivity_db","wireless","anc","predecessor","successor","notes"];

// Columns shown in the list (all of them), with default widths in px.
const COLS = [
  {key:"_brand", label:"Brand", w:120, cls:"b"},
  {key:"model_name", label:"Model", w:160, cls:"mn"},
  {key:"full_name", label:"Full name", w:200},
  {key:"release_year", label:"Year", w:60},
  {key:"discontinued_year", label:"Disc.", w:60},
  {key:"status", label:"Status", w:120},
  {key:"category", label:"Category", w:100},
  {key:"design", label:"Design", w:120},
  {key:"driver_type", label:"Driver", w:130},
  {key:"driver_size_mm", label:"Size", w:60},
  {key:"impedance_ohms", label:"Imp.", w:70},
  {key:"sensitivity_db", label:"Sens.", w:70},
  {key:"wireless", label:"WL", w:55},
  {key:"anc", label:"ANC", w:55},
  {key:"predecessor", label:"Predecessor", w:150},
  {key:"successor", label:"Successor", w:150},
  {key:"notes", label:"Comments", w:300, cls:"notes"},
];

let colW = {};
function loadColW(){ COLS.forEach(c=>colW[c.key]=c.w); try{ const s=JSON.parse(localStorage.getItem("admin_colw")||"null"); if(s) Object.assign(colW,s);}catch(e){} }
function saveColW(){ try{ localStorage.setItem("admin_colw",JSON.stringify(colW)); }catch(e){} }

function esc(s){ return (s||"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2300); }

async function load() {
  try {
    const [pRes, mRes] = await Promise.all([
      fetch("/api/admin/products"),
      fetch("/api/admin/products?manufacturers=1")
    ]);
    const pData = await pRes.json(), mData = await mRes.json();
    if (!pData.ok) throw new Error();
    all = pData.products;
    mfrs = (mData.ok && mData.manufacturers) ? mData.manufacturers : [];
    document.getElementById("f_manufacturer_id").innerHTML =
      mfrs.map(m=>`<option value="${m.manufacturer_id}">${esc(m.name)}</option>`).join("");
    render();
  } catch(e) {
    document.getElementById("tablewrap").innerHTML = '<div class="empty">Could not load the catalog from D1. Check the /api/admin/products binding and Access policy.</div>';
    document.getElementById("sub").textContent = "";
  }
}

function cell(p, key) {
  if (key === "notes") return esc(p.notes);
  if (key === "driver_size_mm") return p.driver_size_mm ? esc(p.driver_size_mm)+" mm" : '<span class="muted">\u2014</span>';
  if (key === "impedance_ohms") return p.impedance_ohms ? esc(p.impedance_ohms)+" \u03A9" : '<span class="muted">\u2014</span>';
  if (key === "sensitivity_db") return p.sensitivity_db ? esc(p.sensitivity_db)+" dB" : '<span class="muted">\u2014</span>';
  return esc(p[key]) || '<span class="muted">\u2014</span>';
}

function render() {
  const q = document.getElementById("q").value.toLowerCase();
  const rows = all.filter(p => !q || (`${p._brand} ${p.model_name} ${p.full_name} ${p.notes}`||"").toLowerCase().includes(q));
  document.getElementById("sub").textContent = `${all.length} headphones in the database${q?` \u00b7 ${rows.length} shown`:""} \u00b7 click a row to edit`;
  if (!rows.length) { document.getElementById("tablewrap").innerHTML='<div class="empty">No matches.</div>'; return; }

  const total = COLS.reduce((s,c)=>s+colW[c.key],0);
  let html = `<table style="width:${total}px"><thead><tr>`;
  COLS.forEach(c => {
    html += `<th data-key="${c.key}" style="width:${colW[c.key]}px"><span>${esc(c.label)}</span><span class="resizer" data-key="${c.key}"></span></th>`;
  });
  html += `</tr></thead><tbody>`;
  rows.forEach(p => {
    html += `<tr data-id="${esc(p.product_id)}">` +
      COLS.map(c => `<td class="${c.cls||""}" style="width:${colW[c.key]}px">${cell(p,c.key)}</td>`).join("") +
      `</tr>`;
  });
  html += `</tbody></table>`;
  document.getElementById("tablewrap").innerHTML = html;

  document.querySelectorAll("tbody tr").forEach(tr => {
    tr.addEventListener("click", () => openEdit(tr.getAttribute("data-id")));
  });
  document.querySelectorAll(".resizer").forEach(rz => {
    rz.addEventListener("mousedown", startResize);
    rz.addEventListener("click", e => e.stopPropagation());
  });
}

// ---- column resizing ----
let resizing = null;
function startResize(e) {
  const key = e.target.getAttribute("data-key");
  resizing = { key, startX: e.clientX, startW: colW[key] };
  document.body.style.userSelect = "none";
  e.preventDefault(); e.stopPropagation();
}
document.addEventListener("mousemove", e => {
  if (!resizing) return;
  colW[resizing.key] = Math.max(45, resizing.startW + (e.clientX - resizing.startX));
  // live-apply widths without full re-render
  document.querySelectorAll(`th[data-key="${resizing.key}"], td.col-${resizing.key}`);
  const th = document.querySelector(`th[data-key="${resizing.key}"]`);
  if (th) th.style.width = colW[resizing.key] + "px";
  const idx = COLS.findIndex(c=>c.key===resizing.key);
  document.querySelectorAll(`tbody tr`).forEach(tr=>{ const td=tr.children[idx]; if(td) td.style.width=colW[resizing.key]+"px"; });
  const total = COLS.reduce((s,c)=>s+colW[c.key],0);
  const tbl = document.querySelector("table"); if (tbl) tbl.style.width = total+"px";
});
document.addEventListener("mouseup", () => { if(resizing){ resizing=null; document.body.style.userSelect=""; saveColW(); } });

function setForm(p) {
  FIELDS.forEach(f => { const el=document.getElementById("f_"+f); if(!el) return;
    el.value = (p[f]!==undefined && p[f]!==null) ? p[f] : (f==="wireless"||f==="anc"?"No":""); });
}
function openEdit(id) {
  const p = all.find(x => x.product_id === id); if (!p) return;
  editingId = id;
  document.getElementById("modalTitle").textContent = "Edit headphone";
  document.getElementById("f_product_id").disabled = true;
  document.getElementById("deleteBtn").style.display = "";
  setForm(p);
  document.getElementById("overlay").classList.add("open");
}
function openAdd() {
  editingId = null;
  document.getElementById("modalTitle").textContent = "Add headphone";
  document.getElementById("f_product_id").disabled = false;
  document.getElementById("deleteBtn").style.display = "none";
  setForm({});
  document.getElementById("overlay").classList.add("open");
}
function closeModal(){ document.getElementById("overlay").classList.remove("open"); }

async function save() {
  const p = {};
  FIELDS.forEach(f => { const el=document.getElementById("f_"+f); if(el) p[f]=el.value.trim(); });
  if (!p.product_id || !p.model_name) { toast("Product ID and Model name are required."); return; }
  try {
    const res = await fetch("/api/admin/products", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(p) });
    const d = await res.json(); if (!d.ok) throw new Error(d.error||"");
    p._brand = (mfrs.find(m=>String(m.manufacturer_id)===String(p.manufacturer_id))||{}).name || "Unknown";
    const i = all.findIndex(x=>x.product_id===p.product_id);
    if (i>=0) all[i] = {...all[i], ...p}; else all.unshift(p);
    closeModal(); render(); toast("Saved.");
  } catch(e){ toast("Save failed: " + (e.message||"error")); }
}
async function del() {
  if (!editingId) return;
  showConfirm("Delete headphone", "Delete this headphone from the database permanently?", async () => {
    try {
      const res = await fetch("/api/admin/products", { method:"DELETE", headers:{"Content-Type":"application/json"}, body:JSON.stringify({product_id:editingId}) });
      const d = await res.json(); if (!d.ok) throw new Error(d.error||"");
      all = all.filter(x=>x.product_id!==editingId);
      closeModal(); render(); toast("Deleted.");
    } catch(e){ toast("Delete failed."); }
  });
}

// ---- confirm modal ----
let confirmAction = null;
function showConfirm(title, msg, onOk) {
  document.getElementById("confirmTitle").textContent = title;
  document.getElementById("confirmMsg").textContent = msg;
  confirmAction = onOk;
  document.getElementById("confirmOverlay").classList.add("open");
}
function hideConfirm(){ document.getElementById("confirmOverlay").classList.remove("open"); confirmAction=null; }

function resetFromCSV() {
  showConfirm("Reset from CSV",
    "This WIPES the live database and reloads it from the GitHub CSVs. Any edits made here that aren't in the CSVs will be lost. Continue?",
    async () => {
      toast("Reimporting from CSV\u2026");
      try {
        const res = await fetch("/api/admin/import", { method:"POST" });
        const d = await res.json(); if (!d.ok) throw new Error(d.error||"");
        toast(`Reloaded ${d.products} headphones.`); load();
      } catch(e){ toast("Import failed: " + (e.message||"error")); }
    });
}

document.getElementById("q").addEventListener("input", render);
document.getElementById("addBtn").addEventListener("click", openAdd);
document.getElementById("importBtn").addEventListener("click", resetFromCSV);
document.getElementById("saveBtn").addEventListener("click", save);
document.getElementById("deleteBtn").addEventListener("click", del);
document.getElementById("cancelBtn").addEventListener("click", closeModal);
document.getElementById("overlay").addEventListener("click", e => { if (e.target.id==="overlay") closeModal(); });
document.getElementById("confirmCancel").addEventListener("click", hideConfirm);
document.getElementById("confirmOk").addEventListener("click", () => { const a=confirmAction; hideConfirm(); if(a) a(); });
document.getElementById("confirmOverlay").addEventListener("click", e => { if (e.target.id==="confirmOverlay") hideConfirm(); });
document.addEventListener("keydown", e => { if (e.key==="Escape"){ closeModal(); hideConfirm(); } });

loadColW();
load();
</script>
</body>
</html>
